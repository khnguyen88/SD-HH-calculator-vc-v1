    el("th",{class:"computed"},"Rim\nCheck"),
    el("th",{}, ""),
  ])));
  const tbody = el("tbody");
  let hglHasAssumed = false;
  state.structures.forEach(row => {
    const calc = computeStructureCalc(row.id);
    const rim   = parseFloat(row.rim);
    const compCrown = calc ? calc.crown : null;
    const crownAssumed = calc ? calc.crownAssumed : false;
    if (crownAssumed) hglHasAssumed = true;
    const crownStyle = calc && calc.crownPass === false ? "color:var(--fail);font-weight:700;" : "";
    const rimStyle   = calc && calc.rimPass   === false ? "color:var(--fail);font-weight:700;" : "";
    tbody.appendChild(el("tr", {}, [
      el("td",{}, row.structureId||row.id),
      el("td",{}, row.type||""),
      el("td",{class:"out computed-cell"}, calc && isFinite(calc.totalFlow) ? fmt(calc.totalFlow,2) : "—"),
      el("td",{class:"out computed-cell"}, calc && isFinite(calc.Hf)        ? fmt(calc.Hf,3)        : "—"),
      el("td",{class:"out computed-cell"}, calc && calc.kb != null           ? fmt(calc.kb,2)         : "—"),
      el("td",{class:"out computed-cell"}, calc && isFinite(calc.Hb)        ? fmt(calc.Hb,3)        : "—"),
      el("td",{class:"out computed-cell", style:"font-weight:700"},
        calc && isFinite(calc.elevation) ? fmt(calc.elevation,2) : "—"),
      (()=>{
        if(!calc||!calc.outPipe) return el("td",{},"—");
        const inv = pipeInvertState(calc.outPipe);
        if(inv.usInvert===null) return el("td",{},"—");
        return el("td",{style:inv.assumed?"color:var(--warn);":""}, fmt(inv.usInvert,2)+(inv.assumed?" *":""));
      })(),
      el("td",{}, (()=>{ const p=calc&&calc.outPipe; const v=p!=null?parseFloat(p.downstreamInvert):NaN; return isFinite(v)?fmt(v,2):"—"; })()),
      el("td",{class:"out computed-cell", style:compCrown!==null?(crownAssumed?"color:var(--warn);":""):""},
        compCrown!==null ? fmt(compCrown,2)+(crownAssumed?" *":"") : "—"),
      el("td",{class:"out computed-cell", style:crownStyle},
        !calc ? "—" : calc.crownPass === null ? "—" : calc.crownPass ? "✓" : "✗ > crown+1"),
      el("td",{}, isFinite(rim) ? fmt(rim,2) : "—"),
      el("td",{class:"out computed-cell", style:rimStyle},
        !calc ? "—" : calc.rimPass === null ? "—" : calc.rimPass ? "✓" : "✗ FLOOD"),
      el("td",{}, detailBtn(()=>openDetailModal(buildHglRowSheet(row.id)))),
    ]));
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  section.appendChild(tableWrap);
  if (hglHasAssumed)
    section.appendChild(el("p",{class:"hint",style:"color:var(--warn);margin-top:6px;"}, "* U/S invert not entered — assumed as D/S invert + 0.1 ft. Enter the upstream invert on the Pipe Sizing & Capacity tab to use the actual value."));
  if (state.structures.length === 0)
    section.appendChild(el("p",{class:"hint"},"No structures defined. Add structures on the Junction Structures tab."));
  c.appendChild(section);
}

// ====== SECTION: Render — Inlet Spacing ======
function renderInletSpacing(){
  const c = document.getElementById("view-inlet-spacing");
  if(!c) return;
  c.innerHTML = "";
  const s = state.inletSpacingSettings;
  const rows = state.inletSpacing;

  c.appendChild(el("h1",{},"Inlet Spacing"));
  c.appendChild(el("p",{class:"view-desc"},
    "HEC-22 grate-inlet on-grade spacing with bypass carryover. Each inlet's Q = (local CA + bypass CA in) × i, where carried bypass is CA (not Q) — the receiving inlet applies its own intensity. SUMP inlets capture 100%. Click ⤢ Detail on any row for the full calculation sheet."));

  // ---- Section 1: Global settings ----
  const gSection = el("div",{class:"section"});
  gSection.appendChild(el("h2",{},"Global settings"));
  const gRow = el("div",{style:"display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;"});

  // Project street
  const streetField = el("div",{class:"field"});
  streetField.appendChild(el("label",{},"Project street"));
  streetField.appendChild(el("input",{type:"text",class:"cell-input",style:"width:200px;",
    value:s.street||"","data-focus-key":"is:global:street",
    oninput:(e)=>{ s.street=e.target.value; withFocusPreserved(renderAll); }}));
  gRow.appendChild(streetField);

  // Default allowable spread
  const allowField = el("div",{class:"field"});
  allowField.appendChild(el("label",{},"Default allowable spread (ft)"));
  allowField.appendChild(el("input",{type:"text",inputmode:"decimal",class:"cell-input",style:"width:80px;",
    value:(s.allowableSpread===undefined||s.allowableSpread===null)?"":s.allowableSpread,
    "data-focus-key":"is:global:allowSpread",
    oninput:(e)=>{ s.allowableSpread=e.target.value; withFocusPreserved(renderAll); }}));
  gRow.appendChild(allowField);

  gSection.appendChild(gRow);

  // Rainfall info note (settings managed in Rainfall tab)
  const rf = state.rainfall;
  const rfSrcLabel = rf.rainfallSource==="noaa"
    ? (rf.county==="Fetched" && rf.fetchedNoaa ? "NOAA Atlas 14 — site-specific ("+String(rf.fetchedNoaa.displayName).slice(0,30)+")" : "NOAA Atlas 14 ("+rf.county+")")
    : rf.rainfallSource==="moco" ? "MoCo Agency Table" : "MDSHA Agency Table";
  gSection.appendChild(el("div",{class:"note"},
    "Rainfall: "+rfSrcLabel+", inlet storm: "+rf.inletStorm+". Change in the Rainfall Settings tab."));

  c.appendChild(gSection);

  // ---- Section 2: Inlet table ----
  const section = el("div",{class:"section"});
  section.appendChild(el("div",{class:"section-head"},[
    el("h2",{},"Inlets"),
    el("button",{class:"btn btn-sm", onclick:()=>{ state.inletSpacing.push(defaultInletSpacingRow()); withFocusPreserved(renderAll); }}, "+ Add Inlet"),
    el("button",{class:"btn btn-sm", onclick:()=>printTableSheet("view-inlet-spacing","Inlet Spacing")}, "\u{1F5A8} Print Table"),
    el("button",{class:"btn btn-sm", onclick:()=>printDetailTableSheet("view-inlet-spacing","Inlet Spacing")}, "\u{1F4CA} Detail")
  ]));

  // Build inletCtx for detail sheets (has all rainfall fields for display)
  const inletCtx = {
    street:          s.street,
    allowableSpread: s.allowableSpread,
    rainfallSource:  state.rainfall.rainfallSource,
    county:          state.rainfall.county,
    storm:           state.rainfall.inletStorm,
    customNoaa:      state.rainfall.customNoaa || {},
  };

  function structureDropdown(row) {
    const sel = el("select", {
      class: "cell-input",
      style: "width:110px;",
      "data-focus-key": "is:"+row.id+":linkedStructure",
      onchange: (e) => {
        row.linkedStructureId = e.target.value;
        withFocusPreserved(renderAll);
      }
    });
    const optCustom = el("option", {value:""}, "Custom");
    if (!row.linkedStructureId) optCustom.selected = true;
    sel.appendChild(optCustom);
    state.structures
      .filter(st => st.type === "inlet")
      .forEach(st => {
        const opt = el("option", {value: st.id}, st.structureId || st.id);
        if (row.linkedStructureId === st.id) opt.selected = true;
        sel.appendChild(opt);
      });
    return sel;
  }

  // Compute the chain once for the whole table
  const chain = computeInletChain(rows, s);
  const comp = chain.results;

  const tableWrap = el("div",{class:"table-wrap"});
  const table = el("table",{class:"data"});
  table.appendChild(el("thead",{},el("tr",{},[
    el("th",{},"Structure"), el("th",{},"Label"), el("th",{},"L (ft)"), el("th",{},"Area (ac)"),
    el("th",{},"C"), el("th",{},"Tc (min)"), el("th",{},"i (in/hr)"),
    el("th",{class:"computed"},"Q (cfs)"), el("th",{},"S"), el("th",{},"Sx"),
    el("th",{},"W (ft)"), el("th",{},"a (ft)"), el("th",{},"n"),
    el("th",{class:"computed"},"Spread T (ft)"), el("th",{},"Allowable T (ft)"),
    el("th",{class:"computed"},"Pickup %"), el("th",{},"Bypass To"),
    el("th",{class:"computed"},"Bypass CA"), el("th",{},""), el("th",{},"")
  ])));
  const tbody = el("tbody");
  rows.forEach(row=>{
    const cc = comp[row.id] || {};
    const trAttrs = {};
    if(cc.cycle) trAttrs.style = "background:rgba(220,60,60,0.10);";
    else if(cc.warn) trAttrs.style = "background:rgba(220,60,60,0.10);";
    if(cc.cycle) trAttrs.title = "In bypass cycle";

    const rf = resolvedInletFields(row);
    const displayLabel = resolvedInletLabel(row);
    const isLinked = !!row.linkedStructureId;

    const labelCell = isLinked
      ? el("input", {class:"cell-input", type:"text", style:"width:120px;color:var(--dim,#888);",
          "data-focus-key":"is:"+row.id+":label", value:displayLabel, disabled:true})
      : el("input", {class:"cell-input", type:"text", style:"width:120px;",
          "data-focus-key":"is:"+row.id+":label", value:row.label||"",
          oninput:(e)=>{ row.label=e.target.value; withFocusPreserved(renderAll); }});

    function autoField(field, fromDA, resolvedVal, width) {
      const stored = row[field];
      const isOverride = stored !== "" && stored != null;
      return el("input", {
        class: "cell-input" + (isOverride ? " i-override" : ""),
        type:"text", inputmode:"decimal", style:"width:"+width+"px;",
        "data-focus-key":"is:"+row.id+":"+field,
        value: isOverride ? stored : "",
        placeholder: fromDA ? String(resolvedVal) : "",
        oninput:(e)=>{ row[field]=e.target.value; withFocusPreserved(renderAll); }
      });
    }

    // i input: shows override (highlighted) or empty with computed placeholder
    const iHasOverride = row.iOverride !== "" && row.iOverride != null;
    const iInput = el("input",Object.assign({
      type:"text",inputmode:"decimal",class:"cell-input"+(iHasOverride?" is-i-override":""),
      style:"width:70px;",
      value:iHasOverride ? row.iOverride : "",
      placeholder:(cc.iComputed && cc.iComputed>0) ? cc.iComputed.toFixed(2) : "",
      "data-focus-key":"is:"+row.id+":iOverride",
      oninput:(e)=>{ row.iOverride=e.target.value; withFocusPreserved(renderAll); }
    }, iHasOverride ? {title:"Override active — auto: "+(cc.iComputed||0).toFixed(2)} : {}));
    const iCell = el("td",{},[iInput]);
    if(iHasOverride){
      iCell.appendChild(el("div",{style:"font-size:10px;color:var(--muted-2);font-family:var(--font-mono);margin-top:2px;"},
        "auto: "+(cc.iComputed||0).toFixed(2)));
    }

    const spreadTxt = cc.isSump ? "—" : (cc.T>0 ? cc.T.toFixed(2) : "—");
    const spreadAttrs = {class:"out computed-cell"};
    if(cc.warn) spreadAttrs.style = "color:var(--fail);font-weight:700;";

    tbody.appendChild(el("tr",trAttrs,[
      el("td",{}, structureDropdown(row)),
      el("td",{}, labelCell),
      el("td",{}, txtCell(row,"L",60)),
      el("td",{}, autoField("area", rf.areaFromDA, rf.area, 70)),
      el("td",{}, autoField("C", rf.CFromDA, rf.C, 55)),
      el("td",{}, autoField("tc", rf.tcFromDA, rf.tc, 60)),
      iCell,
      el("td",{class:"out computed-cell"}, fmt(cc.Q,3)),
      el("td",{}, txtCell(row,"S",65)),
      el("td",{}, txtCell(row,"Sx",60)),
      el("td",{}, txtCell(row,"W",60)),
      el("td",{}, txtCell(row,"a",60)),
      el("td",{}, txtCell(row,"n",60)),
      el("td",spreadAttrs, spreadTxt),
      el("td",{}, txtCell(row,"allowableSpread",60)),
      el("td",{class:"out computed-cell"}, cc.pickupPct!=null ? cc.pickupPct.toFixed(1)+"%" : "—"),
      el("td",{}, bypassSelect(row)),
      el("td",{class:"out computed-cell"}, cc.bypassCA>0 ? cc.bypassCA.toFixed(5) : "0"),
      el("td",{}, detailBtn(()=>openDetailModal(buildInletSpacingSheet(row, comp[row.id], inletCtx)))),
      el("td",{}, delBtn(()=>{ state.inletSpacing=state.inletSpacing.filter(r=>r!==row); withFocusPreserved(renderAll); }))
    ]));
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  section.appendChild(tableWrap);
  if(rows.length===0) section.appendChild(el("p",{class:"hint"},"No inlets yet — click “+ Add Inlet” to start. Label each inlet so bypass carryover can be chained downstream."));
  c.appendChild(section);

  function txtCell(row,field,w){
    return el("input",{class:"cell-input",type:"text",inputmode:"decimal",style:"width:"+w+"px",
      value:(row[field]===undefined||row[field]===null)?"":row[field],
      "data-focus-key":"is:"+row.id+":"+field,
      oninput:(e)=>{ row[field]=e.target.value; withFocusPreserved(renderAll); }});
  }

  function bypassSelect(row){
    const sel = el("select",{class:"cell-input",style:"width:90px",
      "data-focus-key":"is:"+row.id+":bypassTo",
      onchange:(e)=>{ row.bypassTo=e.target.value; withFocusPreserved(renderAll); }});
    sel.appendChild(el("option",{value:""},"—"));
    rows.forEach(other=>{
      if(other===row) return;
      const lbl = resolvedInletLabel(other);
      if(!lbl) return;
      const o = el("option",{value:lbl}, lbl);
      if(row.bypassTo===lbl) o.selected=true;
      sel.appendChild(o);
    });
    return sel;
  }

  // ---- Section 3: Chain warnings ----
  chain.cycles.forEach(msg => c.appendChild(el("div",{class:"note warn"}, msg)));
  chain.orphans.forEach(msg => c.appendChild(el("div",{class:"note warn"}, msg)));

  // ---- Section 4: Disclosure ----
  c.appendChild(el("div",{class:"note"},
    "Structure library dimensions (L, W, a, n) are workbook-derived seed values — verify against the governing MDSHA Book of Standards sheet before submittal. All fields remain editable."));
}

    ? (r.county === "Fetched" && r.fetchedNoaa
        ? "NOAA Atlas 14 \u2014 site-specific (" + String(r.fetchedNoaa.displayName).slice(0, 30) + ")"
        : "NOAA Atlas 14 \u2014 " + r.county)
    : r.rainfallSource === "moco" ? "MoCo Agency Table" : "MDSHA Agency Table";

  const iRows = calc.iOverridden
    ? [["Intensity source", "Manual override"],
       ["i used (all storms)", fmt(Number(row.iOverride), 3) + " in/hr \u26a0 verify against source"]]
    : [["Intensity source", srcLabel],
       ["Time of concentration, Tc", (row.tc !== "" && row.tc != null ? fmt(parseFloat(row.tc), 1) + " min" : "\u2014")]];

  const body = [
    csSection("Inputs", csTable([
      ["Tributary area, A", fmt(calc.A, 2) + " ac"],
      ["Runoff coefficient, C", fmt(calc.C, 2)],
      ["CA = C \u00d7 A", fmt(calc.CA, 3)],
      ["Frequency correction, Cf", fmt(calc.cf, 2)],
      ...iRows,
    ])),
    csSection("Rational Method \u2014 Q = Cf \u00d7 C \u00d7 i \u00d7 A", el("div", {}, visibleDaStorms(r).map(s => {
      const label = {"2yr":"Q\u2082","10yr":"Q\u2081\u2080","25yr":"Q\u2082\u2085","5yr":"Q\u2085"}[s] || ("Q "+s);
      const tag = s === r.pipeStorm ? " \u2190 pipe design storm" : s === r.inletStorm ? " \u2190 inlet design storm" : "";
      const tc  = parseFloat(row.tc);
      const iVal = calc.iOverridden
        ? Number(row.iOverride)
        : lookupIntensity(tc, r.rainfallSource, s, r.county, r.customNoaa || {}, r.fetchedNoaa || null);
      const stormQ = calc.Qs[s];
      const wrap = el("div", {class:"cs-storm-q"});
      wrap.appendChild(el("div",{class:"cs-storm-label"}, label + (tag ? " ("+tag.replace(/[\u2190]/g,"").trim()+")" : "")));
      wrap.appendChild(csTable([
        ["Rainfall intensity, i"+(calc.iOverridden?" (override)":""), fmt(iVal,3)+" in/hr"],
      ]));
      wrap.appendChild(csFormula([
        "Q = "+fmt(calc.cf,2)+" \u00d7 "+fmt(calc.C,2)+" \u00d7 "+fmt(iVal,3)+" \u00d7 "+fmt(calc.A,2),
      ]));
      wrap.appendChild(csResult(label, fmt(stormQ,3)+" cfs"));
      return wrap;
    }))),
  ];
  return sheetWrapper("drainage", "Drainage Area \u2014 " + (row.structureId || row.id),
    row.desc || "Rational Method (Q = Cf\u00b7C\u00b7i\u00b7A)", body);
}

function buildPipeSheet(row, stormOverride){
  const calc = calcPipeRow(row);
  const designQ = stormOverride ? pipeDesignQ(row, null, stormOverride) : calc.designQ;
  const pass = calc.Qfull != null ? (calc.Qfull >= designQ) : null;
  const from = findStructure(row.fromStructureId), to = findStructure(row.toStructureId);
  const geo = pipeGeometry(row);
  const body = [];
  const connRows = [
    ["From structure", from? (from.structureId||from.id) : "\u2014 not set \u2014"],
    ["To structure", to? (to.structureId||to.id) : "\u2014 not set \u2014"],
    ["Angle entering To structure", fmt(parseFloat(row.angle)||0,0)+"\u00b0"],
  ];
  if(from && from.type==="splitter"){
    connRows.push(["Role at Flow Splitter", row.splitRole? (row.splitRole==="primary"?"Primary":"Secondary") : "\u26a0 not set"]);
  }
  body.push(csSection("Connectivity", csTable(connRows)));
  const designNote = (from && from.type==="splitter")
    ? "The From structure is a Flow Splitter \u2014 Design Q is this pipe's share (Primary or Secondary) of that structure's Total Flow. See that structure's detail sheet for the split calculation."
    : "Design Q is the From structure's Total Flow (see that structure's detail sheet for how it is built up).";
  body.push(csSection("Design discharge", el("div",{},[
    el("div",{class:"cs-note"}, designNote),
    csResult("Design Q"+(stormOverride?" ("+stormOverride+")":""), fmt(designQ,2)+" cfs"),
  ])));
  const matEntry = row.material ? state.pipeMaterials.find(m => m.id === row.material) : null;
  const geoRows = [
    ["Shape", row.shape==="circular"?"Circular":"Elliptical"],
    ["Size", row.shape==="circular" ? (row.size||"\u2014")+" in diameter" : (row.size||"\u2014")+" in (span \u00d7 rise)"],
  ];
  if(row.shape==="elliptical" && geo){
    geoRows.push(["Matched Table 4-6 entry", geo.equivDiamIn+" in equivalent circular diameter"]);
  }
  geoRows.push(["Cross-sectional area, A", geo?fmt(geo.areaSf,3)+" sf":"\u2014"]);
  geoRows.push(["Material", matEntry ? (matEntry.label + (matEntry.description ? " — " + matEntry.description : "")) : "Manual"]);
  geoRows.push(["Manning's n", fmt(pipeEffectiveN(row),3)]);
  const So = pipeEffectiveSlope(row);
  const _usInv = parseFloat(row.upstreamInvert);
  const _dsInv = parseFloat(row.downstreamInvert);
  const _L     = parseFloat(row.length);
  const hasInverts = isFinite(_usInv) && isFinite(_dsInv) && isFinite(_L) && _L > 0;
  geoRows.push(["Slope, So"+(hasInverts?" (from inverts)":""), fmt(So,4)+" ft/ft"]);
  if(hasInverts) geoRows.push(["  US invert", fmt(_usInv,2)+" ft"]);
  if(hasInverts) geoRows.push(["  DS invert", fmt(_dsInv,2)+" ft"]);
  geoRows.push(["Length, L", fmt(parseFloat(row.length),0)+" ft"]);
  body.push(csSection("Geometry", csTable(geoRows)));

  if(geo){
    const R = (geo.equivDiamIn/12)/4;
    body.push(csSection("Manning's Equation \u2014 full-flow capacity", el("div",{},[
      csFormula(["V = (1.486/n) \u00d7 R^(2/3) \u00d7 S^(1/2)", "R = D/4 = "+fmt(R,3)+" ft"]),
      csFormula(["V = (1.486/"+fmt(pipeEffectiveN(row),3)+") \u00d7 "+fmt(R,3)+"^(2/3) \u00d7 "+fmt(So,4)+"^(1/2)"]),
      csResult("V (full flow)", fmt(calc.V,2)+" fps"),
      csFormula(["Qfull = V \u00d7 A = "+fmt(calc.V,2)+" \u00d7 "+fmt(geo.areaSf,3)]),
      csResult("Qfull", fmt(calc.Qfull,2)+" cfs"),
      el("div",{class:"cs-note", style:"margin-top:8px;"}, "Adequate if Qfull \u2265 Design Q: "+fmt(calc.Qfull,2)+" "+(pass?"\u2265":"<")+" "+fmt(designQ,2)),
      csResult("Status", pass? "PASS":"FAIL"),
    ])));
  } else {
    body.push(csWarn("Pipe size/shape is incomplete \u2014 capacity not computed."));
  }
  return sheetWrapper("pipe", "Pipe \u2014 "+(from?(from.structureId||from.id):"?")+" \u2192 "+(to?(to.structureId||to.id):"?")+(stormOverride?" ("+stormOverride+")":""), "Manning's Equation", body);
}

function buildStructureSheet(structureId){
  const st = findStructure(structureId);
  if(!st) return sheetWrapper("structure","Structure not found","",[]);
  const calc = computeStructureCalc(structureId);
  const body = [];

  const catalogEntry = (st.structureMode==="standard" && st.agency && st.standardStructureId)
    ? (STRUCTURE_CATALOG[st.agency]||[]).find(e=>e.id===st.standardStructureId) : null;
  const agencyLabel = {"mcdot":"MCDOT","mdsha":"MDSHA","mdot":"MDOT","pgder":"PG DER"}[st.agency]||st.agency||"";
  const catalogLabel = catalogEntry
    ? catalogEntry.label+" ("+agencyLabel+")"
    : st.structureMode==="custom"
      ? "Custom \u2014 "+(st.shape||"?")+(st.shape==="round"&&st.innerDiameter?" ("+st.innerDiameter+" ft dia)":
          ((st.shape==="square"||st.shape==="rectangular")&&st.innerWidth?" ("+st.innerWidth+(st.innerLength&&st.innerLength!==st.innerWidth?"\xd7"+st.innerLength:"")+" ft)":""))
      : "\u2014 (legacy / Kb table)";
  const innerSizeRow = catalogEntry&&catalogEntry.shape==="round"&&catalogEntry.innerDiameter!=null
    ? [["Inner diameter", catalogEntry.innerDiameter+" ft"]]
    : catalogEntry&&catalogEntry.innerWidth!=null
      ? [["Inner size", catalogEntry.innerWidth+(catalogEntry.innerLength!=null&&catalogEntry.innerLength!==catalogEntry.innerWidth?"\xd7"+catalogEntry.innerLength:"")+" ft"]]
      : [];
  body.push(csSection("Structure", csTable([
    ["Type", (STRUCTURE_TYPES.find(t=>t[0]===st.type)||["","?"])[1]],
    ["Description", st.desc||"\u2014"],
    ["Linked drainage area", st.drainageAreaId? ((findDrainage(st.drainageAreaId)||{}).structureId || st.drainageAreaId) : "none"],
    ["Catalog / mode", catalogLabel],
    ...innerSizeRow,
  ])));

  // Captured Q
  if(st.drainageAreaId){
    const da = findDrainage(st.drainageAreaId);
    body.push(csSection("Captured Q (from linked drainage area)", el("div",{},[
      da ? csResult("Captured Q", fmt(calcDrainageRow(da).designQ,2)+" cfs (from "+(da.structureId||da.id)+")") : csWarn("Linked drainage area not found."),
    ])));
  } else {
    body.push(csSection("Captured Q", csResult("Captured Q", "0.00 cfs (no drainage area linked)")));
  }

  // Inflow pipes
  if(calc.inflow && calc.inflow.length){
    const rows = calc.inflow.map(inf=>{
      const p = inf.pipe, fromSt = findStructure(inf.fromId);
      return [ "Pipe from "+(fromSt?(fromSt.structureId||fromSt.id):"?")+" ("+fmt(parseFloat(p.angle)||0,0)+"\u00b0)", fmt(inf.Q,2)+" cfs" ];
    });
    body.push(csSection("Inflow pipes ("+calc.inflow.length+")", csTable(rows)));
  } else {
    body.push(csSection("Inflow pipes", el("div",{class:"cs-note"}, "None \u2014 this is a headwater structure.")));
  }

  body.push(csSection("Total Flow", el("div",{},[
    csFormula(["Total Flow = Captured Q + \u03a3(inflow pipe Q)"]),
    csFormula(["Total Flow = "+fmt(calc.captured,2)+" + "+fmt(calc.totalFlow-calc.captured,2)]),
    csResult("Total Flow", fmt(calc.totalFlow,2)+" cfs"),
  ])));

  if(calc.isSplitter && calc.splitInfo){
    const s = calc.splitInfo;
    const splitBody = [];
    if(s.method==="ratio"){
      splitBody.push(csFormula(["Primary Q = Total Flow \u00d7 Ratio = "+fmt(calc.totalFlow,2)+" \u00d7 "+fmt(s.ratio,2)]));
    } else {
      splitBody.push(csFormula(["Primary Q = MIN(Total Flow, Primary Capacity) = MIN("+fmt(calc.totalFlow,2)+", "+fmt(s.cap,2)+")"]));
    }
    splitBody.push(csResult("Primary Q", fmt(s.primaryQ,2)+" cfs"));
    splitBody.push(csFormula(["Secondary Q = Total Flow \u2212 Primary Q = "+fmt(calc.totalFlow,2)+" \u2212 "+fmt(s.primaryQ,2)]));
    splitBody.push(csResult("Secondary Q", fmt(s.secondaryQ,2)+" cfs"));
    if(calc.warnings.some(w=>w.indexOf("Primary and one Secondary")>=0)){
      splitBody.push(csWarn("Missing a Primary or Secondary outgoing pipe \u2014 assign Role on the Pipe Sizing & Capacity tab."));
    }
    body.push(csSection("Flow split ("+(s.method==="ratio"?"fixed ratio":"capacity-limited primary")+")", el("div",{}, splitBody)));
  }

  if(calc.warnings && calc.warnings.length){
    body.push(csSection("Warnings", el("div",{}, calc.warnings.map(w=>csWarn(w)))));
  }

  return sheetWrapper("structure", "Structure \u2014 "+(st.structureId||st.id), "Flow collection and total discharge", body);
}

function buildHglRowSheet(structureId, stormOverride){
  const st = findStructure(structureId);
  if(!st) return sheetWrapper("hgl","Structure not found","",[]);
  const calc = computeStructureCalc(structureId, null, stormOverride||null);
  if(!calc) return sheetWrapper("hgl","Calculation error","",[]);
  const body = [];
  body.push(csSection("Total Flow at this structure", el("div",{},[
    csResult("Total Flow"+(stormOverride?" ("+stormOverride+")":""), fmt(calc.totalFlow,2)+" cfs"),
  ])));
  if(calc.isBase){
    body.push(csSection("Elevation (fixed)", el("div",{},[
      el("div",{class:"cs-note"}, st.forceElev
        ? "\u201cForce fixed elevation\u201d is checked for this structure."
        : "No outgoing pipe found \u2014 treated as the system outfall/end point."),
      csResult("Elevation", fmt(calc.elevation,2)+" ft"),
    ])));
  } else {
    const outSt = calc.outPipe ? findStructure(calc.outPipe.toStructureId) : null;
    body.push(csSection("Friction loss (outgoing"+(calc.isSplitter?" \u2014 Primary":"")+" pipe)", el("div",{},[
      csTable([
        ["Outgoing pipe to", outSt?(outSt.structureId||outSt.id):"\u2014"],
        ["Flow carried by this pipe, Q", fmt(calc.outPipeFlow,2)+" cfs"+(calc.isSplitter?" (Primary share)":"")],
        ["Friction slope, Sf", fmt(calc.Sf,6)+" ft/ft"],
        ["Length, L", fmt(parseFloat(calc.outPipe.length),0)+" ft"],
      ]),
      csFormula(["Hf = Sf \u00d7 L = "+fmt(calc.Sf,6)+" \u00d7 "+fmt(parseFloat(calc.outPipe.length),0)]),
      csResult("Hf", fmt(calc.Hf,4)+" ft"),
    ])));
    const structLossBody = [];
    const kLabel = calc.useCatalogKah ? "K\u2090\u2095 (HEC-22 Approx.)" : "Kb";
    const kSourceNote = calc.useCatalogKah
      ? "Inflow pipe count: "+calc.inflowCount+" \u2014 K\u2090\u2095 from HEC-22 5th Ed. Table 8.5 Approx. Method ("+resolveStructureCategory(st)+")"
      : "Inflow pipe count: "+calc.inflowCount+" \u2014 Kb column: "+(calc.kbColumn||"n/a")+" (legacy Kb table)";
    structLossBody.push(el("div",{class:"cs-note"}, kSourceNote));
    if (calc.useCatalogKah) {
      structLossBody.push(el("div",{class:"cs-note"},
        "Note: Controlling-angle convention follows HEC-22 \u00a78.5: the angle producing the smaller head loss governs (smaller-loss pipe\u2019s angle selected as controlling angle when 2 inflows present)."));
    }
    if(calc.inflowCount===0){
      structLossBody.push(el("div",{class:"cs-note"}, "No piped inflow \u2014 nominal entrance condition, "+kLabel+" evaluated at 0\u00b0."));
    } else if(calc.inflowCount===1){
      structLossBody.push(el("div",{class:"cs-note"}, "Single inflow pipe \u2014 "+kLabel+" taken directly at that pipe's angle."));
    } else if(calc.controlling){
      const ctl = calc.controlling;
      const kShort = calc.useCatalogKah ? "K\u2090\u2095" : "Kb";
      structLossBody.push(csTable([
        ["Pipe 1: Q\u2081, \u03c5\u2081", fmt(ctl.Q1,2)+" cfs, "+fmt(ctl.a1,0)+"\u00b0"],
        ["Pipe 2: Q\u2082, \u03c5\u2082", fmt(ctl.Q2,2)+" cfs, "+fmt(ctl.a2,0)+"\u00b0"],
        ["V\u2081/\u2083 = Q\u2081 / A(out)", fmt(ctl.V1_3,2)+" fps"],
        ["V\u2082/\u2083 = Q\u2082 / A(out)", fmt(ctl.V2_3,2)+" fps"],
        ["Lv\u2081 = "+kShort+"(\u03c5\u2081)\u00d7V\u2081/\u2083\u00b2/2g", fmt(ctl.Lv1,4)+" ft  ("+kShort+"="+fmt(ctl.Kb1,3)+")"],
        ["Lv\u2082 = "+kShort+"(\u03c5\u2082)\u00d7V\u2082/\u2083\u00b2/2g", fmt(ctl.Lv2,4)+" ft  ("+kShort+"="+fmt(ctl.Kb2,3)+")"],
        ["Controlling angle \u03c5c", fmt(ctl.vc,0)+"\u00b0  ("+(ctl.Lv1>ctl.Lv2? "Lv\u2081 > Lv\u2082 \u2192 use \u03c5\u2082" : "Lv\u2082 \u2265 Lv\u2081 \u2192 use \u03c5\u2081")+")"],
      ]));
    } else if(calc.kb==null){
      structLossBody.push(csWarn("More than 2 inflow pipes \u2014 controlling-angle method not applicable. Compute Hb manually."));
    }
    if(calc.kb!=null){
      structLossBody.push(csTable([
        ["Vout = Total Flow / A(outgoing pipe)", fmt(calc.Vout,2)+" fps"],
        [kLabel, fmt(calc.kb,3)],
      ]));
      structLossBody.push(csFormula([kLabel+" \xd7 Vout\xb2 / 2g = "+fmt(calc.kb,3)+" \xd7 "+fmt(calc.Vout,2)+"\xb2 / "+ (2*G).toFixed(1)]));
      structLossBody.push(csResult("H_ah / Hb", fmt(calc.Hb,4)+" ft"));
    }
    body.push(csSection("Structure loss", el("div",{}, structLossBody)));
    body.push(csSection("Upstream HGL", el("div",{},[
      csFormula(["Upstream HGL = Downstream Elev + Hf + Hb"]),
      csFormula(["Upstream HGL = "+fmt(calc.downstreamElev,2)+" + "+fmt(calc.Hf,4)+" + "+fmt(calc.Hb,4)]),
      csResult("Upstream HGL", fmt(calc.elevation,2)+" ft"),
    ])));
  }
  const crown = calc.crown;
  const crownAssumed = calc.crownAssumed;
  const rim   = (st.rim  !==""&&st.rim  !=null)?parseFloat(st.rim)  :null;
  body.push(csSection("Clearance checks", csTable([
    ["Pipe crown elevation",         crown!=null?fmt(crown,2)+" ft"+(crownAssumed?" * (assumed)":""):"\u2014 not computed"],
    ["Limit: HGL \u2264 Crown + 1.0 ft", crown!=null?fmt(crown+1,2)+" ft":"\u2014"],
    ["Result", calc.crownPass===null?"\u2014":(calc.crownPass?"OK":"EXCEEDS LIMIT")],
    ["Rim / grate elevation",        rim!=null?fmt(rim,2)+" ft":"\u2014 not set"],
    ["Limit: HGL \u2264 Rim \u2212 1.0 ft",   rim!=null?fmt(rim-1,2)+" ft":"\u2014"],
    ["Result", calc.rimPass===null?"\u2014":(calc.rimPass?"OK":"EXCEEDS LIMIT")],
  ])));
  if(calc.warnings && calc.warnings.length){
    body.push(csSection("Warnings", el("div",{}, calc.warnings.map(w=>csWarn(w)))));
  }
  return sheetWrapper("hgl",
    "HGL \u2014 "+(st.structureId||st.id)+(stormOverride?" ("+stormOverride+")":""),
    "Friction loss, structure loss, and upstream HGL", body);
}

function buildOutletStageSheet(stageResult, os){
  const body = [];
  body.push(csSection("Stage", csTable([
    ["Outlet structure", os? (os.label||os.id) : "\u2014"],
    ["Headwater elevation (stage)", fmt(stageResult.stage,2)+" ft"],
    ["Tailwater", stageResult.tw!=null? fmt(stageResult.tw,2)+" ft ("+(os?os.twMode:"")+")" : "none (free discharge)"],
  ])));

  stageResult.devices.forEach(dr=>{
    const d = dr.device;
    const rows = [];
    if(d.type==="weir"){
      rows.push(["Type", "Weir ("+(d.weirShape==="vnotch"?"V-notch":"Rectangular")+")"]);
      rows.push(["Crest elevation", fmt(parseFloat(d.crest),2)+" ft"]);
      if(d.weirShape==="vnotch") rows.push(["Notch angle", fmt(parseFloat(d.notchAngle)||90,0)+"\u00b0"]);
      else rows.push(["Length, L", fmt(parseFloat(d.length),2)+" ft"]);
      rows.push(["Coefficient", fmt(parseFloat(d.coef),3)]);
      rows.push(["Regime", dr.regime]);
      const body2 = [csTable(rows)];
      if(dr.regime==="dry" || dr.regime==="n/a"){
        body2.push(csResult("Q", "0.00 cfs"));
      } else {
        const H1 = dr.head;
        if(d.weirShape==="vnotch"){
          body2.push(csFormula(["Qfree = C \u00d7 tan(\u03b8/2) \u00d7 H\u00b2\u00b7\u2075 = "+fmt(parseFloat(d.coef),3)+" \u00d7 tan("+fmt(parseFloat(d.notchAngle)||90,0)+"\u00b0/2) \u00d7 "+fmt(H1,3)+"\u00b2\u00b7\u2075"]));
        } else {
          body2.push(csFormula(["Qfree = C \u00d7 L \u00d7 H\u00b9\u00b7\u2075 = "+fmt(parseFloat(d.coef),3)+" \u00d7 "+fmt(parseFloat(d.length),2)+" \u00d7 "+fmt(H1,3)+"\u00b9\u00b7\u2075"]));
        }
        if(dr.regime.indexOf("submerged")===0){
          body2.push(csFormula(["Submergence factor = [1\u2212(H2/H1)\u207f]^0.385, H2="+fmt(dr.H2,3)+" ft"]));
          if(dr.factor!=null) body2.push(csResult("Factor", fmt(dr.factor,4)));
        }
        body2.push(csResult("Q", fmt(dr.Q,3)+" cfs \u2014 "+dr.regime));
      }
      body.push(csSection("Device: "+(d.label||d.id), el("div",{}, body2)));
    } else {
      const isPipe = d.type==="pipe";
      rows.push(["Type", isPipe?"Pipe (orifice-equivalent)":"Orifice"]);
      rows.push(["Invert elevation", fmt(parseFloat(d.invert),2)+" ft"]);
      rows.push(["Diameter", fmt(parseFloat(d.diameter),2)+" in"]);
      rows.push(["Discharge coefficient, Cd", fmt(parseFloat(d.cd),3)]);
      rows.push(["Regime", dr.regime]);
      const body2 = [csTable(rows)];
      if(dr.regime==="dry" || dr.regime==="n/a"){
        body2.push(csResult("Q", "0.00 cfs"));
      } else if(dr.regime==="partial"){
        body2.push(el("div",{class:"cs-note"}, "Water surface is below the top of the opening \u2014 uses the exact wetted circular-segment area and the head to that area's own centroid (not the pipe centerline)."));
        body2.push(csFormula(["\u03b1 = cos\u207b\u00b9(1 \u2212 h/R) = cos\u207b\u00b9(1 \u2212 "+fmt(dr.h,3)+"/"+fmt(parseFloat(d.diameter)/24,3)+")"]));
        body2.push(csTable([
          ["Depth above invert, h", fmt(dr.h,3)+" ft"],
          ["Half-angle, \u03b1", fmt(dr.alpha*180/Math.PI,2)+"\u00b0  ("+fmt(dr.alpha,4)+" rad)"],
          ["Wetted area, A = R\u00b2(2\u03b1\u2212sin2\u03b1)/2", fmt(dr.area,4)+" sf"],
          ["Centroid above invert, R\u22124Rsin\u00b3\u03b1/(3(2\u03b1\u2212sin2\u03b1))", fmt(dr.centroidAboveInvert,4)+" ft"],
          ["Head to area centroid, hc = h \u2212 centroid", fmt(dr.head,3)+" ft"],
        ]));
        body2.push(csFormula(["Q = Cd \u00d7 A(h) \u00d7 \u221a(2g\u00d7hc) = "+fmt(parseFloat(d.cd),3)+" \u00d7 "+fmt(dr.area,4)+" \u00d7 \u221a(2\u00d7"+G+"\u00d7"+fmt(dr.head,3)+")"]));
        body2.push(csResult("Q", fmt(dr.Q,3)+" cfs"));
      } else {
        body2.push(el("div",{class:"cs-note"}, dr.regime==="submerged" ? "Opening is fully submerged on both the headwater and tailwater sides \u2014 differential head." : "Opening is fully submerged at headwater; tailwater does not govern \u2014 head to the pipe's center."));
        body2.push(csTable([["Full area, A", fmt(dr.area,4)+" sf"], ["Driving head, H", fmt(dr.head,3)+" ft"]]));
        body2.push(csFormula(["Q = Cd \u00d7 A \u00d7 \u221a(2g\u00d7H) = "+fmt(parseFloat(d.cd),3)+" \u00d7 "+fmt(dr.area,4)+" \u00d7 \u221a(2\u00d7"+G+"\u00d7"+fmt(dr.head,3)+")"]));
        body2.push(csResult("Q", fmt(dr.Q,3)+" cfs \u2014 "+dr.regime));
      }
      body.push(csSection("Device: "+(d.label||d.id), el("div",{}, body2)));
    }
  });

  body.push(csSection("Total", csResult("Total Q (all devices)", fmt(stageResult.total,3)+" cfs")));

  return sheetWrapper("outlet-stage", (os?(os.label||os.id)+" \u2014 ":"")+"Stage "+fmt(stageResult.stage,2)+" ft", "Rating curve detail at this headwater elevation", body);
}

/* =======================================================================
   Formulas & Examples reference
   Every governing equation used elsewhere in the tool, each with a worked
   numeric example. Examples are computed live from the current project
   (defaulting to the seeded example structures/devices where present) via
   the exact same functions the rest of the app uses, so the numbers here
   can never drift out of sync with what the calculators actually do.
======================================================================= */
function csSub(text){ return el("div",{class:"cs-note", style:"font-style:normal;margin:2px 0 8px 0;"}, text); }

function buildFormulasReferenceSheet(){
  const body = [];
  const s = state;

  // ---------------- 1. Rational Method ----------------
  const daEx = s.drainage[0];
  const daCalc = daEx ? calcDrainageRow(daEx) : null;
  const b1 = [];
  b1.push(csSub("Runoff from a drainage area for the design storm."));
  b1.push(csFormula(["Q = Cf \u00d7 C \u00d7 i \u00d7 A"]));
  b1.push(csTable([["Cf","Frequency correction factor (1.0 for storms \u2264 25-yr)"],["C","Runoff coefficient"],["i","Rainfall intensity, in/hr, for the design storm"],["A","Tributary area, acres"]]));
  if(daEx){
    const daDesignI = (daCalc.cf > 0 && daCalc.CA > 0) ? daCalc.designQ / (daCalc.cf * daCalc.CA) : 0;
    b1.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 "+(daEx.structureId||daEx.id)));
    b1.push(csTable([["Cf",fmt(daCalc.cf,2)],["C",fmt(daCalc.C,2)],["i ("+s.rainfall.pipeStorm+" design storm)",fmt(daDesignI,3)+" in/hr"],["A",fmt(daCalc.A,2)+" ac"]]));
    b1.push(csFormula(["Q = "+fmt(daCalc.cf,2)+" \u00d7 "+fmt(daCalc.C,2)+" \u00d7 "+fmt(daDesignI,3)+" \u00d7 "+fmt(daCalc.A,2)]));
    b1.push(csResult("Q ("+s.rainfall.pipeStorm+")", fmt(daCalc.designQ,3)+" cfs"));
  }
  body.push(csSection("1. Rational Method (Drainage Area tab)", el("div",{}, b1)));

  // ---------------- 2. Manning's Equation ----------------
  let pipeEx=null, pipeCalc=null, fromSt=null, toSt=null;
  for(const p of s.pipes){ if(p.shape==="circular" && p.size){ pipeEx=p; break; } }
  if(pipeEx){ pipeCalc = calcPipeRow(pipeEx); fromSt=findStructure(pipeEx.fromStructureId); toSt=findStructure(pipeEx.toStructureId); }
  const b2 = [];
  b2.push(csSub("Full-flow capacity and velocity of a pipe run."));
  b2.push(csFormula(["V = (1.486/n) \u00d7 R^(2/3) \u00d7 S^(1/2)","R = D/4 (circular, full flow)","Qfull = V \u00d7 A"]));
  b2.push(csTable([["n","Manning's roughness"],["S","Pipe slope, ft/ft"],["R","Hydraulic radius, ft"],["A","Cross-sectional area, sf"]]));
  if(pipeEx && pipeCalc){
    const R = (pipeCalc.equivDiamIn/12)/4;
    b2.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 "+(fromSt?fromSt.structureId:"?")+" \u2192 "+(toSt?toSt.structureId:"?")));
    b2.push(csTable([["Size",pipeEx.size+" in circular"],["n",fmt(pipeEffectiveN(pipeEx),3)],["S",fmt(pipeEffectiveSlope(pipeEx),4)+" ft/ft"],["A = \u03c0/4\u00d7D\u00b2",fmt(pipeCalc.areaSf,4)+" sf"],["R = D/4",fmt(R,3)+" ft"]]));
    b2.push(csFormula(["V = (1.486/"+fmt(pipeEffectiveN(pipeEx),3)+") \u00d7 "+fmt(R,3)+"^(2/3) \u00d7 "+fmt(pipeEffectiveSlope(pipeEx),4)+"^(1/2)"]));
    b2.push(csResult("V", fmt(pipeCalc.V,3)+" fps"));
    b2.push(csFormula(["Qfull = "+fmt(pipeCalc.V,3)+" \u00d7 "+fmt(pipeCalc.areaSf,4)]));
    b2.push(csResult("Qfull", fmt(pipeCalc.Qfull,3)+" cfs \u2014 Design Q = "+fmt(pipeCalc.designQ,3)+" cfs \u2192 "+(pipeCalc.pass?"PASS":"FAIL")));
  }
  body.push(csSection("2. Manning's Equation (Pipe Sizing & Capacity tab)", el("div",{}, b2)));

  // ---------------- 3. Friction Loss ----------------
  const b3 = [];
  b3.push(csSub("Head lost to friction along a pipe run, at the actual design flow (not full-flow capacity)."));
  b3.push(csFormula(["Sf = ( Q\u00d7n / (1.486\u00d7A\u00d7R^(2/3)) )\u00b2","Hf = Sf \u00d7 L"]));
  if(pipeEx && pipeCalc){
    const R = (pipeCalc.equivDiamIn/12)/4;
    const Sf = frictionSlope(pipeCalc.designQ, pipeEffectiveN(pipeEx), pipeCalc.areaSf, R);
    const Hf = Sf*(parseFloat(pipeEx.length)||0);
    b3.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 same pipe as above"));
    b3.push(csTable([["Q (design)",fmt(pipeCalc.designQ,3)+" cfs"],["L",fmt(parseFloat(pipeEx.length),0)+" ft"]]));
    b3.push(csFormula(["Sf = ( "+fmt(pipeCalc.designQ,3)+"\u00d7"+fmt(pipeEffectiveN(pipeEx),3)+" / (1.486\u00d7"+fmt(pipeCalc.areaSf,4)+"\u00d7"+fmt(R,3)+"^(2/3)) )\u00b2"]));
    b3.push(csResult("Sf", fmt(Sf,7)+" ft/ft"));
    b3.push(csFormula(["Hf = "+fmt(Sf,7)+" \u00d7 "+fmt(parseFloat(pipeEx.length),0)]));
    b3.push(csResult("Hf", fmt(Hf,4)+" ft"));
  }
  body.push(csSection("3. Friction Loss (Junction Structures tab)", el("div",{}, b3)));

  // ---------------- 4. Structure Loss / controlling angle ----------------
  let twoInflowSt=null;
  for(const st of s.structures){ if(getIncomingPipes(st.id).length===2){ twoInflowSt=st; break; } }
  const b4 = [];
  b4.push(csSub("Turbulence loss where flow enters a structure and turns to exit through the outgoing pipe. With two inflow pipes, the controlling-angle method applies: the angle belonging to the SMALLER computed loss governs the merged flow."));
  b4.push(csFormula(["Single inflow: Kb at that pipe's angle","Two inflow: V1/3=Q1/Aout, V2/3=Q2/Aout","Lv1=Kb(\u03c51)\u00d7V1/3\u00b2/2g, Lv2=Kb(\u03c52)\u00d7V2/3\u00b2/2g","Lv1>Lv2 \u2192 \u03c5c=\u03c52  |  Lv2>Lv1 \u2192 \u03c5c=\u03c51","Hb = Kb(\u03c5c) \u00d7 Vout\u00b2/2g,  Vout = Total Flow/Aout"]));
  if(twoInflowSt){
    const calc = computeStructureCalc(twoInflowSt.id);
    const ctl = calc.controlling;
    b4.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 "+(twoInflowSt.structureId||twoInflowSt.id)));
    if(ctl){
      b4.push(csTable([
        ["Pipe 1: Q1, \u03c51",fmt(ctl.Q1,3)+" cfs, "+fmt(ctl.a1,0)+"\u00b0"],
        ["Pipe 2: Q2, \u03c52",fmt(ctl.Q2,3)+" cfs, "+fmt(ctl.a2,0)+"\u00b0"],
        ["V1/3, V2/3",fmt(ctl.V1_3,3)+" fps, "+fmt(ctl.V2_3,3)+" fps"],
        ["Kb(\u03c51), Kb(\u03c52)",fmt(ctl.Kb1,3)+", "+fmt(ctl.Kb2,3)],
        ["Lv1, Lv2",fmt(ctl.Lv1,5)+" ft, "+fmt(ctl.Lv2,5)+" ft"],
      ]));
      b4.push(csResult("Controlling angle \u03c5c", fmt(ctl.vc,0)+"\u00b0  ("+(ctl.Lv1>ctl.Lv2?"Lv1 > Lv2 \u2192 use \u03c52":"Lv2 > Lv1 \u2192 use \u03c51")+")"));
    }
    b4.push(csTable([["Total Flow",fmt(calc.totalFlow,3)+" cfs"],["Vout = Total Flow/Aout",fmt(calc.Vout,3)+" fps"],["Kb(\u03c5c)",fmt(calc.kb,3)]]));
    b4.push(csFormula(["Hb = "+fmt(calc.kb,3)+" \u00d7 "+fmt(calc.Vout,3)+"\u00b2 / "+(2*G).toFixed(1)]));
    b4.push(csResult("Hb", fmt(calc.Hb,4)+" ft"));
    b4.push(csFormula(["Upstream HGL = Downstream Elev + Hf + Hb = "+fmt(calc.downstreamElev,3)+" + "+fmt(calc.Hf,4)+" + "+fmt(calc.Hb,4)]));
    b4.push(csResult("Upstream HGL", fmt(calc.elevation,3)+" ft"));
  }
  body.push(csSection("4. Structure Loss \u2014 Controlling-Angle Method (Junction Structures tab)", el("div",{}, b4)));

  // ---------------- 5. Flow Splitter ----------------
  let splitterEx=null;
  for(const st of s.structures){ if(st.type==="splitter"){ splitterEx=st; break; } }
  const b5 = [];
  b5.push(csSub("Divides a structure's Total Flow between a Primary and a Secondary outgoing pipe."));
  b5.push(csFormula(["Capacity method: Primary = MIN(Total Flow, Capacity), Secondary = Total Flow \u2212 Primary","Ratio method: Primary = Total Flow \u00d7 Ratio, Secondary = Total Flow \u2212 Primary"]));
  if(splitterEx){
    const calc = computeStructureCalc(splitterEx.id);
    const si = calc.splitInfo;
    b5.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 "+(splitterEx.structureId||splitterEx.id)+" ("+si.method+" method)"));
    if(si.method==="ratio"){
      b5.push(csTable([["Total Flow",fmt(calc.totalFlow,3)+" cfs"],["Ratio",fmt(si.ratio,2)]]));
      b5.push(csFormula(["Primary = "+fmt(calc.totalFlow,3)+" \u00d7 "+fmt(si.ratio,2)]));
    } else {
      b5.push(csTable([["Total Flow",fmt(calc.totalFlow,3)+" cfs"],["Primary Capacity",fmt(si.cap,3)+" cfs"]]));
      b5.push(csFormula(["Primary = MIN("+fmt(calc.totalFlow,3)+", "+fmt(si.cap,3)+")"]));
    }
    b5.push(csResult("Primary Q", fmt(si.primaryQ,3)+" cfs"));
    b5.push(csResult("Secondary Q = Total \u2212 Primary", fmt(si.secondaryQ,3)+" cfs"));
  }
  body.push(csSection("5. Flow Splitter (Junction Structures tab)", el("div",{}, b5)));

  // ---------------- 6. Circular segment geometry ----------------
  const b6 = [];
  b6.push(csSub("Exact wetted area and centroid of a circular orifice/pipe flowing partially full, at depth h above the invert, radius R. This is the exact solution (via direct integration), not an approximation."));
  b6.push(csFormula(["\u03b1 = cos\u207b\u00b9(1 \u2212 h/R)   (half-angle)","A = R\u00b2(2\u03b1 \u2212 sin 2\u03b1)/2","Centroid above invert = R \u2212 4R\u00b7sin\u00b3\u03b1 / (3(2\u03b1 \u2212 sin 2\u03b1))","Head to centroid, hc = h \u2212 (centroid above invert)"]));
  const segEx = circularSegment(1.0, 1.0);
  b6.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 R = 1.0 ft (24 in), h = 1.0 ft (half full)"));
  b6.push(csFormula(["\u03b1 = cos\u207b\u00b9(1 \u2212 1.0/1.0) = cos\u207b\u00b9(0)"]));
  b6.push(csResult("\u03b1", fmt(segEx.alpha*180/Math.PI,2)+"\u00b0  ("+fmt(segEx.alpha,4)+" rad)"));
  b6.push(csFormula(["A = 1.0\u00b2(2\u00d7"+fmt(segEx.alpha,4)+" \u2212 sin(2\u00d7"+fmt(segEx.alpha,4)+"))/2"]));
  b6.push(csResult("A", fmt(segEx.A,4)+" sf  (exactly half of \u03c0R\u00b2 = "+fmt(Math.PI/2,4)+" sf, as expected at half-full)"));
  b6.push(csFormula(["Centroid above invert = 1.0 \u2212 4(1.0)sin\u00b3("+fmt(segEx.alpha,4)+") / (3(2\u00d7"+fmt(segEx.alpha,4)+" \u2212 sin(2\u00d7"+fmt(segEx.alpha,4)+")))"]));
  b6.push(csResult("Centroid above invert", fmt(segEx.centroidAboveInvert,4)+" ft  (matches the classical semicircle result, 4R/3\u03c0 above the diameter line)"));
  b6.push(csResult("hc = h \u2212 centroid", fmt(segEx.hc,4)+" ft"));
  body.push(csSection("6. Circular Segment Geometry \u2014 partial flow (Outlet Structure tab)", el("div",{}, b6)));

  // ---------------- 7. Orifice/Pipe full & submerged flow ----------------
  const orificeEx = state.outletDevices.find(d=>d.type==="orifice" || d.type==="pipe");
  const b7 = [];
  b7.push(csSub("Once the water surface reaches the top of the opening, the full circular area governs. If tailwater also submerges the opening, the driving head becomes the difference between headwater and tailwater rather than head to the pipe's center."));
  b7.push(csFormula(["Full, free discharge: H = HW \u2212 (invert + R)","Submerged (TW above the opening too): H = HW \u2212 TW","Q = Cd \u00d7 A \u00d7 \u221a(2g\u00d7H),  A = \u03c0R\u00b2"]));
  if(orificeEx){
    const invert = parseFloat(orificeEx.invert), diamFt = (parseFloat(orificeEx.diameter)||0)/12, r=diamFt/2, cd=parseFloat(orificeEx.cd)||0.6;
    const top = invert+2*r;
    const hwFree = invert+2*r+0.75, rFree = orificeOrPipeQ(orificeEx, hwFree, null, "none");
    b7.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 "+(orificeEx.label||orificeEx.id)+" (invert="+fmt(invert,2)+" ft, D="+fmt(diamFt*12,1)+" in, Cd="+fmt(cd,2)+")"));
    b7.push(el("div",{class:"cs-note"}, "Free discharge, headwater "+fmt(hwFree-top,2)+" ft above the top of the opening, no tailwater:"));
    b7.push(csFormula(["H = "+fmt(hwFree,2)+" \u2212 ("+fmt(invert,2)+" + "+fmt(r,3)+") = "+fmt(rFree.head,3)+" ft"]));
    b7.push(csFormula(["Q = "+fmt(cd,2)+" \u00d7 "+fmt(rFree.area,4)+" \u00d7 \u221a(2\u00d7"+G+"\u00d7"+fmt(rFree.head,3)+")"]));
    b7.push(csResult("Q (free, full)", fmt(rFree.Q,3)+" cfs"));

    const hwSub = top+2.0, twSub = top+1.9, rSub = orificeOrPipeQ(orificeEx, hwSub, twSub, "linked");
    if(rSub.regime==="submerged"){
      b7.push(el("div",{class:"cs-note", style:"margin-top:10px;"}, "Same opening, now with tailwater also above the top (HW="+fmt(hwSub,2)+" ft, TW="+fmt(twSub,2)+" ft):"));
      b7.push(csFormula(["H = "+fmt(hwSub,2)+" \u2212 "+fmt(twSub,2)+" = "+fmt(rSub.head,3)+" ft"]));
      b7.push(csFormula(["Q = "+fmt(cd,2)+" \u00d7 "+fmt(rSub.area,4)+" \u00d7 \u221a(2\u00d7"+G+"\u00d7"+fmt(rSub.head,3)+")"]));
      b7.push(csResult("Q (submerged)", fmt(rSub.Q,3)+" cfs"));
    }
  }
  body.push(csSection("7. Orifice/Pipe \u2014 Full & Submerged Flow (Outlet Structure tab)", el("div",{}, b7)));

  // ---------------- 8/9. Weir free & submerged flow ----------------
  const weirEx = state.outletDevices.find(d=>d.type==="weir");
  const b8 = [];
  b8.push(csSub("Rectangular weir, free (unsubmerged) discharge."));
  b8.push(csFormula(["Q = C \u00d7 L \u00d7 H\u00b9\u00b7\u2075   (H = headwater above crest)","V-notch: Q = C \u00d7 tan(\u03b8/2) \u00d7 H\u00b2\u00b7\u2075"]));
  let wFreeEx=null, wSubEx=null, H1demo=0.5;
  if(weirEx){
    const crest = parseFloat(weirEx.crest);
    wFreeEx = weirQ(weirEx, crest+H1demo, null, "none");
    b8.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 "+(weirEx.label||weirEx.id)+" (crest="+fmt(crest,2)+" ft, L="+fmt(parseFloat(weirEx.length),1)+" ft, C="+fmt(parseFloat(weirEx.coef),2)+")"));
    b8.push(csFormula(["H = "+fmt(crest+H1demo,2)+" \u2212 "+fmt(crest,2)+" = "+fmt(H1demo,2)+" ft"]));
    b8.push(csFormula(["Q = "+fmt(parseFloat(weirEx.coef),2)+" \u00d7 "+fmt(parseFloat(weirEx.length),1)+" \u00d7 "+fmt(H1demo,2)+"\u00b9\u00b7\u2075"]));
    b8.push(csResult("Q (free)", fmt(wFreeEx.Q,3)+" cfs"));
  }
  body.push(csSection("8. Weir \u2014 Free Flow (Outlet Structure tab)", el("div",{}, b8)));

  const b9 = [];
  b9.push(csSub("When tailwater rises above the crest too, free-flow discharge is reduced by the Villemonte submergence factor."));
  b9.push(csFormula(["Qsub = Qfree \u00d7 [1 \u2212 (H2/H1)\u207f]^0.385","H1 = HW\u2212crest, H2 = TW\u2212crest,  n = 1.5 (rect.) or 2.5 (V-notch)"]));
  if(weirEx){
    const crest = parseFloat(weirEx.crest);
    const H2demo = 0.3;
    wSubEx = weirQ(weirEx, crest+H1demo, crest+H2demo, "linked");
    b9.push(el("div",{class:"cs-block-title", style:"margin-top:10px;"}, "Worked example \u2014 same weir, tailwater "+fmt(H2demo,2)+" ft above crest"));
    b9.push(csTable([["H1",fmt(H1demo,2)+" ft"],["H2",fmt(H2demo,2)+" ft"],["Qfree",fmt(wFreeEx?wFreeEx.Q:0,3)+" cfs"]]));
    b9.push(csFormula(["Factor = [1 \u2212 ("+fmt(H2demo,2)+"/"+fmt(H1demo,2)+")\u00b9\u00b7\u2075]^0.385"]));
    b9.push(csResult("Submergence factor", fmt(wSubEx.factor,4)));
    b9.push(csFormula(["Qsub = "+fmt(wFreeEx?wFreeEx.Q:0,3)+" \u00d7 "+fmt(wSubEx.factor,4)]));
    b9.push(csResult("Q (submerged)", fmt(wSubEx.Q,3)+" cfs \u2014 "+fmt((1-wSubEx.Q/(wFreeEx?wFreeEx.Q:1))*100,1)+"% reduction vs free flow"));
  }
  body.push(csSection("9. Weir \u2014 Submerged Flow, Villemonte Correction (Outlet Structure tab)", el("div",{}, b9)));

  return sheetWrapper("formulas", "Formulas & Worked Examples", "Every governing equation used in this tool, with a live example computed from the current project", body);
}

function renderFormulas(){
  const c = document.getElementById("view-formulas");
  c.innerHTML = "";
  c.appendChild(el("h1",{},"Formulas & Examples"));
  c.appendChild(el("p",{class:"view-desc"},"Every equation used elsewhere in this tool, in one place, each with a worked numeric example computed live from your current project. Examples update automatically as you edit the underlying data."));
  const printBtn = el("button",{class:"btn btn-sm btn-primary", style:"margin-bottom:16px;", onclick:()=>printNodes([buildFormulasReferenceSheet()])}, "\u{1F5A8} Print this reference");
  c.appendChild(printBtn);
  const wrap = el("div",{style:"background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;"});
  wrap.appendChild(buildFormulasReferenceSheet());
  c.appendChild(wrap);
}

/* ---------------------------------------------------------------------
   Modal + print
--------------------------------------------------------------------- */
function openDetailModal(sheetNode){
  const overlay = document.getElementById("modalOverlay");
  const body = document.getElementById("modalBody");
  const title = document.getElementById("modalTitle");
  body.innerHTML = "";
  body.appendChild(sheetNode);
  title.textContent = sheetNode.querySelector(".cs-title") ? sheetNode.querySelector(".cs-title").textContent : "Detail";
  overlay.style.display = "flex";
  document.getElementById("modalPrintOne").onclick = ()=> printNodes([sheetNode.cloneNode(true)]);
  document.getElementById("modalPrintAll").onclick = ()=> printAllSheets();
}
function closeDetailModal(){
  document.getElementById("modalOverlay").style.display = "none";
}

/* =======================================================================
   TR-55 Time of Concentration modal - interactive, unlike the read-only
   Detail modal above (reuses the same overlay shell, different content).
======================================================================= */
function openTr55Modal(row){
  const overlay = document.getElementById("modalOverlay");
  document.getElementById("modalTitle").textContent = "TR-55 Time of Concentration \u2014 "+(row.structureId||row.id);
  renderTr55ModalBody(row);
  overlay.style.display = "flex";
  document.getElementById("modalPrintOne").onclick = ()=> printNodes([buildTr55Sheet(row)]);
  document.getElementById("modalPrintAll").onclick = ()=> printAllSheets();
}

function renderTr55ModalBody(row){
  const body = document.getElementById("modalBody");
  body.innerHTML = "";
  if(!row.tr55 || !row.tr55.segments) row.tr55 = {segments:[]};
  const segs = row.tr55.segments;
  const calc = computeTr55(row);
  row.tc = round2(calc.totalMin); // keep the direct-entry field in sync so switching back to "direct" starts from this value

  body.appendChild(el("p",{class:"view-desc", style:"margin-bottom:10px;"},
    "NRCS TR-55 segmental method: Tc = sum of travel times across every segment below, in order. Add as many segments as the flow path actually has \u2014 most watersheds have one sheet-flow reach followed by one or more shallow/channel reaches, but nothing here assumes that shape."));

  if(calc.warnings.length){
    calc.warnings.forEach(w=> body.appendChild(el("div",{class:"note warn"}, w)));
  }

  const addRow = el("div",{style:"display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;"});
  TR55_SEGMENT_TYPES.forEach(([v,l])=>{
    addRow.appendChild(el("button",{class:"btn btn-sm", onclick:()=>{
      segs.push(tr55DefaultSegment(v));
      withFocusPreserved(()=>renderTr55ModalBody(row));
      renderDrainage();
    }}, "+ Add "+l));
  });
  body.appendChild(addRow);

  if(segs.length===0){
    body.appendChild(el("p",{class:"hint"},"No segments yet \u2014 add at least one above."));
  }

  segs.forEach((seg,idx)=>{
    const r = calc.results[idx];
    const card = el("div",{class:"section"});
    const head = el("div",{class:"section-head"});
    head.appendChild(el("h2",{}, (idx+1)+". "+(TR55_SEGMENT_TYPES.find(t=>t[0]===seg.type)||["", "Segment"])[1]));
    const headBtns = el("div",{style:"display:flex;gap:6px;"});
    if(idx>0) headBtns.appendChild(el("button",{class:"btn btn-sm btn-ghost", title:"Move up", onclick:()=>{ [segs[idx-1],segs[idx]]=[segs[idx],segs[idx-1]]; renderTr55ModalBody(row); renderDrainage(); }}, "\u2191"));
    if(idx<segs.length-1) headBtns.appendChild(el("button",{class:"btn btn-sm btn-ghost", title:"Move down", onclick:()=>{ [segs[idx],segs[idx+1]]=[segs[idx+1],segs[idx]]; renderTr55ModalBody(row); renderDrainage(); }}, "\u2193"));
    headBtns.appendChild(delBtn(()=>{ segs.splice(idx,1); renderTr55ModalBody(row); renderDrainage(); }));
    head.appendChild(headBtns);
    card.appendChild(head);

    const g = el("div",{class:"junction-grid"});
    const c1 = el("div"), c2 = el("div");
    if(seg.type==="sheet"){
      c1.appendChild(tr55RefField(row, seg, "n", "Manning's roughness, n", TR55_SHEET_N, "e.g. 0.24 (dense grass)"));
      c1.appendChild(tr55Field(row, seg, "L", "Flow length, L (ft)", "typically \u2264 100 ft"));
      c2.appendChild(tr55Field(row, seg, "s", "Land slope, s (ft/ft)", "e.g. 0.01"));
      c2.appendChild(tr55Field(row, seg, "P2", "2-yr, 24-hr rainfall, P2 (in)", "from NOAA Atlas 14 or local IDF data"));
      const Lnum = parseFloat(seg.L);
      if(isFinite(Lnum) && Lnum>100){
        card.appendChild(el("div",{class:"note warn"},"Flow length exceeds 100 ft. The original 1986 TR-55 worksheet allows sheet flow up to 300 ft, but modern guidance (WinTR-55 and most current manuals) caps it at 100 ft \u2014 worth checking which your governing agency expects."));
      }
    } else if(seg.type==="shallow"){
      c1.appendChild(tr55Field(row, seg, "L", "Flow length, L (ft)", ""));
      c1.appendChild(tr55Field(row, seg, "s", "Watercourse slope, s (ft/ft)", ""));
      const surfField = el("div",{class:"field"});
      surfField.appendChild(el("label",{},"Surface"));
      const surfSel = el("select",{"data-focus-key":"tr55:"+row.id+":"+seg.id+":surface", onchange:(e)=>{ seg.surface=e.target.value; withFocusPreserved(()=>renderTr55ModalBody(row)); renderDrainage(); }});
      Object.keys(TR55_SHALLOW_CP).forEach(k=>{
        const o = el("option",{value:k}, TR55_SHALLOW_CP[k].label);
        if((seg.surface||"unpaved")===k) o.selected=true;
        surfSel.appendChild(o);
      });
      surfField.appendChild(surfSel);
      c2.appendChild(surfField);
    } else {
      c1.appendChild(tr55Field(row, seg, "L", "Flow length, L (ft)", ""));
      c1.appendChild(tr55Field(row, seg, "s", "Channel slope, s (ft/ft)", ""));
      c1.appendChild(tr55RefField(row, seg, "n", "Manning's n", TR55_CHANNEL_N, "typical reference values \u2014 verify for your channel"));
      c2.appendChild(tr55Field(row, seg, "area", "Cross-sectional flow area, a (sf)", "at bankfull / design depth"));
      c2.appendChild(tr55Field(row, seg, "wp", "Wetted perimeter, Pw (ft)", ""));
    }
    g.appendChild(c1); g.appendChild(c2);
    card.appendChild(g);

    const resultItems = [ el("div",{class:"result-item"},[el("span",{class:"k"},"Tt"), el("span",{class:"v"}, fmt(r.tt,4)+" hr")]) ];
    if(r.V!=null) resultItems.push(el("div",{class:"result-item"},[el("span",{class:"k"},"V"), el("span",{class:"v"}, fmt(r.V,3)+" fps")]));
    if(r.r!=null) resultItems.push(el("div",{class:"result-item"},[el("span",{class:"k"},"r = a/Pw"), el("span",{class:"v"}, fmt(r.r,3)+" ft")]));
    card.appendChild(el("div",{class:"result-grid", style:"margin-top:10px;"}, resultItems));
    body.appendChild(card);
  });

  const totalGrid = el("div",{class:"result-grid"});
  totalGrid.appendChild(el("div",{class:"result-item hero"},[el("span",{class:"k"},"Tc = \u03a3 Tt (all segments)"), el("span",{class:"v"}, fmt(calc.totalHr,4)+" hr = "+fmt(calc.totalMin,2)+" min")]));
  body.appendChild(totalGrid);

  body.appendChild(el("button",{class:"btn btn-sm btn-ghost", style:"margin-top:14px;", onclick:()=>{ row.tcMethod="direct"; renderDrainage(); closeDetailModal(); }}, "Switch to direct entry (keeps "+fmt(calc.totalMin,1)+" min as the starting value)"));

  function tr55Field(row, seg, field, label, hint){
    const wrap = el("div",{class:"field"});
    wrap.appendChild(el("label",{}, label));
    wrap.appendChild(el("input",{type:"text",inputmode:"decimal", value: seg[field]===undefined||seg[field]===null?"":seg[field], "data-focus-key":"tr55:"+row.id+":"+seg.id+":"+field,
      oninput:(e)=>{ seg[field]=e.target.value; withFocusPreserved(()=>renderTr55ModalBody(row)); renderDrainage(); }}));
    if(hint) wrap.appendChild(el("div",{class:"hint", style:"margin-top:3px;"}, hint));
    return wrap;
  }
  function tr55RefField(row, seg, field, label, refTable, hint){
    const wrap = el("div",{class:"field"});
    wrap.appendChild(el("label",{}, label));
    const inputRow = el("div",{style:"display:flex;gap:4px;"});
    inputRow.appendChild(el("input",{type:"text",inputmode:"decimal", style:"flex:1;", value: seg[field]===undefined||seg[field]===null?"":seg[field], "data-focus-key":"tr55:"+row.id+":"+seg.id+":"+field,
      oninput:(e)=>{ seg[field]=e.target.value; withFocusPreserved(()=>renderTr55ModalBody(row)); renderDrainage(); }}));
    const refSel = el("select",{style:"max-width:130px;", title:"Pick a typical value to fill the field \u2014 still editable after", onchange:(e)=>{
      if(e.target.value){ seg[field]=refTable[e.target.value].n; withFocusPreserved(()=>renderTr55ModalBody(row)); renderDrainage(); }
      e.target.value = "";
    }});
    refSel.appendChild(el("option",{value:""},"Reference\u2026"));
    Object.keys(refTable).forEach(k=> refSel.appendChild(el("option",{value:k}, refTable[k].label+" ("+refTable[k].n+")")));
    inputRow.appendChild(refSel);
    wrap.appendChild(inputRow);
    if(hint) wrap.appendChild(el("div",{class:"hint", style:"margin-top:3px;"}, hint));
    return wrap;
  }
}

function round2(v){ return isFinite(v) ? Math.round(v*100)/100 : v; }

function tr55SegmentLabel(seg){
  return (TR55_SEGMENT_TYPES.find(t=>t[0]===seg.type)||["","Segment"])[1];
}

function buildTr55Sheet(row){
  const calc = computeTr55(row);
  const segs = (row.tr55 && row.tr55.segments) || [];
  const body = [];
  if(calc.warnings.length){
    body.push(csSection("Warnings", el("div",{}, calc.warnings.map(w=>csWarn(w)))));
  }
  segs.forEach((seg,idx)=>{
    const r = calc.results[idx];
    const rows = [];
    if(seg.type==="sheet"){
      rows.push(["Manning's n", fmt(parseFloat(seg.n),3)]);
      rows.push(["Flow length, L", fmt(parseFloat(seg.L),1)+" ft"]);
      rows.push(["Land slope, s", fmt(parseFloat(seg.s),4)+" ft/ft"]);
      rows.push(["2-yr 24-hr rainfall, P2", fmt(parseFloat(seg.P2),2)+" in"]);
    } else if(seg.type==="shallow"){
      rows.push(["Surface", (TR55_SHALLOW_CP[seg.surface]||TR55_SHALLOW_CP.unpaved).label]);
      rows.push(["Flow length, L", fmt(parseFloat(seg.L),1)+" ft"]);
      rows.push(["Watercourse slope, s", fmt(parseFloat(seg.s),4)+" ft/ft"]);
    } else {
      rows.push(["Flow length, L", fmt(parseFloat(seg.L),1)+" ft"]);
      rows.push(["Channel slope, s", fmt(parseFloat(seg.s),4)+" ft/ft"]);
      rows.push(["Manning's n", fmt(parseFloat(seg.n),3)]);
      rows.push(["Cross-sectional area, a", fmt(parseFloat(seg.area),2)+" sf"]);
      rows.push(["Wetted perimeter, Pw", fmt(parseFloat(seg.wp),2)+" ft"]);
    }
    const formulaLines = seg.type==="sheet" ? ["Tt = 0.007(nL)^0.8 / (P2^0.5 \u00d7 s^0.4)"]
      : seg.type==="shallow" ? ["V = Cp \u00d7 \u221as", "Tt = L / (3600 \u00d7 V)"]
      : ["r = a / Pw", "V = (1.486/n) \u00d7 r^(2/3) \u00d7 s^0.5", "Tt = L / (3600 \u00d7 V)"];
    const resultsBody = [csTable(rows), csFormula(formulaLines)];
    if(r.r!=null) resultsBody.push(csResult("r", fmt(r.r,3)+" ft"));
    if(r.V!=null) resultsBody.push(csResult("V", fmt(r.V,3)+" fps"));
    resultsBody.push(csResult("Tt", fmt(r.tt,4)+" hr ("+fmt(r.tt*60,2)+" min)"));
    body.push(csSection((idx+1)+". "+tr55SegmentLabel(seg), el("div",{}, resultsBody)));
  });
  body.push(csSection("Total", csResult("Tc = \u03a3 Tt (all segments)", fmt(calc.totalHr,4)+" hr = "+fmt(calc.totalMin,2)+" min")));
  return sheetWrapper("tc55", "TR-55 Time of Concentration \u2014 "+(row.structureId||row.id), "NRCS TR-55 segmental method", body);
}

function buildInletSpacingSheet(row, comp, settings){
  if(!comp) comp = {};
  const f = (v,d)=> (v==null||!isFinite(v)) ? "\u2014" : fmt(v, d!=null?d:4);
  const isSump = comp.isSump;
  const S  = parseFloat(row.S);
  const Sx = parseFloat(row.Sx);
  const W  = parseFloat(row.W);
  const a  = parseFloat(row.a);
  const n  = parseFloat(row.n);
  const L  = parseFloat(row.L);
  const Q  = comp.Q || 0;
  const iVal = comp.i || 0;
  const localCA = (parseFloat(row.C)||0) * (parseFloat(row.area)||0);
  const bypassCAIn = (comp.totalCA||0) - localCA;

  const body = [];

  // 1. Inputs
  body.push(csSection("Inputs", csTable([
    ["Inlet label", row.label || "(unlabeled)"],
    ["Grate length, L", f(L,3)+" ft"],
    ["Gutter width, W", f(W,3)+" ft"],
    ["Gutter depression, a", f(a,4)+" ft"],
    ["Manning's n", f(n,3)],
    ["Tributary area, A", f(parseFloat(row.area),4)+" ac"],
    ["Runoff coefficient, C", f(parseFloat(row.C),2)],
    ["Local CA", f(localCA,5)+" ac"],
    ["Bypass CA in (from upstream)", f(bypassCAIn>0?bypassCAIn:0,5)+" ac"],
    ["Total CA", f(comp.totalCA,5)+" ac"],
    ["Time of concentration, Tc", row.tc ? row.tc+" min" : "\u2014"],
    ["Rainfall intensity, i", f(iVal,3)+" in/hr"+(row.iOverride!==""&&row.iOverride!=null?"\u00b9":"")],
    [isSump ? "Grade" : "Longitudinal slope, S", isSump ? "SUMP" : f(S,4)+" ft/ft"],
    [isSump ? "Cross-slope, Sx" : "Cross-slope, Sx", isSump ? "\u2014 (sump)" : f(Sx,4)+" ft/ft"],
    ["Allowable spread, T\u2090", ((row.allowableSpread||"")!==""?row.allowableSpread:settings.allowableSpread)+" ft"],
  ])));
  if(row.iOverride!==""&&row.iOverride!=null){
    body.push(el("div",{class:"cs-note"},
      "\u00b9 Rainfall intensity manually overridden. Auto (curve) value: "+f(comp.iComputed,3)+" in/hr."));
  }

  // 2. Total flow
  body.push(csSection("Total Flow (Q = total CA \u00d7 i)", el("div",{},[
    csFormula(["Q\u209c\u2092\u209c\u2090\u2097 = (C\u2097\u2092\u2063\u2090\u2097 \u00d7 A\u2097\u2092\u2063\u2090\u2097 + CA\u2099\u2095\u2093\u2090\u2099\u2090\u2099\u2093) \u00d7 i"]),
    csFormula(["Q = ("+f(localCA,5)+" + "+f(bypassCAIn>0?bypassCAIn:0,5)+") \u00d7 "+f(iVal,3)]),
    csResult("Q", f(Q,4)+" cfs"),
  ])));

  if(isSump){
    // Sump: 100% pickup, no spread or Lt calcs
    body.push(csSection("Sump Inlet", el("div",{},[
      el("div",{class:"cs-note"}, "Sump inlets intercept 100% of approaching flow (weir/orifice condition). No spread or length-of-flow calculation is performed."),
      csResult("Pickup efficiency, E", "100%"),
      csResult("Bypass CA out", "0"),
    ])));
  } else {
    // 3. Composite effective cross-slope (Sx_eff) \u2014 workbook cols V/W/X
    const VV = (a + Sx*W)/W;
    const Qw = (0.56/n) * Math.pow(VV,1.667) * Math.pow(S,0.5) * Math.pow(W,2.667);
    const Wratio = Qw>0&&Q>0 ? (a/(a+Sx*W)) * Math.min(Qw/Q,1.0) : 0;
    const SxEff = comp.SxEff;
    body.push(csSection("Effective Cross-Slope, S\u2093_\u2091\u2091\u2091 (composite gutter \u2014 workbook col X)", el("div",{},[
      el("div",{class:"cs-note"},"Accounts for gutter depression a and width W (HEC-22 \u00a74.2 composite gutter)."),
      csFormula(["V = (a + Sx\u00b7W) / W = ("+f(a,4)+" + "+f(Sx,4)+"\u00b7"+f(W,3)+") / "+f(W,3)+" = "+f(VV,4)]),
      csFormula(["Q\u1d20 = (0.56/n)\u00b7V\u00b9\u02b7\u2076\u2076\u2077\u00b7S\u2070\u02b7\u2075\u00b7W\u00b2\u02b7\u2076\u2076\u2077"]),
      csFormula(["Q\u1d20 = (0.56/"+f(n,3)+")\u00b7"+f(VV,4)+"\u00b9\u02b7\u2076\u2076\u2077\u00b7"+f(S,4)+"\u2070\u02b7\u2075\u00b7"+f(W,3)+"\u00b2\u02b7\u2076\u2076\u2077 = "+f(Qw,4)+" cfs"]),
      csFormula(["W_ratio = (a/(a+Sx\u00b7W))\u00b7(Q\u1d20/Q) = ("+f(a,4)+"/("+f(a,4)+"+"+f(Sx,4)+"\u00b7"+f(W,3)+"))\u00b7("+f(Qw,4)+"/"+f(Q,4)+") = "+f(Wratio,4)]),
      csFormula(["S\u2093_\u2091\u2091\u2091 = Sx + (a/W)\u00b7W_ratio = "+f(Sx,4)+" + ("+f(a,4)+"/"+f(W,3)+")\u00b7"+f(Wratio,4)]),
      csResult("S\u2093_\u2091\u2091\u2091", f(SxEff,4)),
    ])));

    // 4. On-grade spread T
    const T = comp.T;
    const allowT = comp.allowT;
    body.push(csSection("On-Grade Spread, T (HEC-22 Eq. 4-1)", el("div",{},[
      csFormula(["T = (Q\u00b7n / (0.56\u00b7S\u2093_\u2091\u2091\u2091\u00b9\u02b7\u2076\u2077\u00b7S\u2070\u02b7\u2075))\u2070\u02b7\u00b3\u2077\u2074\u2075"]),
      csFormula(["T = ("+f(Q,4)+"\u00b7"+f(n,3)+" / (0.56\u00b7"+f(SxEff,4)+"\u00b9\u02b7\u2076\u2077\u00b7"+f(S,4)+"\u2070\u02b7\u2075))\u2070\u02b7\u00b3\u2077\u2074\u2075"]),
      csResult("T", f(T,3)+" ft"),
      comp.warn
        ? csWarn("Computed spread "+f(T,2)+" ft exceeds allowable "+f(allowT,1)+" ft")
        : el("div",{class:"cs-note"}, "Spread \u2264 allowable ("+f(allowT,1)+" ft) \u2714"),
    ])));

    // 5. Length of flow Lt and efficiency E
    const k = a===0 ? 0.60 : (L>=15 ? 0.54 : 0.58);
    const Lt = comp.Lt;
    const E  = comp.E;
    body.push(csSection("Grate Length of Flow, L\u209c (HEC-22 Eq. 4-19)", el("div",{},[
      csFormula(["L\u209c = k\u00b7Q\u2070\u02b7\u2074\u00b2\u00b7S\u2070\u02b7\u00b3\u00b7(1/(n\u00b7S\u2093_\u2091\u2091\u2091))\u2070\u02b7\u2076"]),
      csFormula(["k = "+(a===0?"0.60 (no depression)":L>=15?"0.54 (L \u2265 15 ft)":"0.58 (L < 15 ft)")]),
      csFormula(["L\u209c = "+f(k,2)+"\u00b7"+f(Q,4)+"\u2070\u02b7\u2074\u00b2\u00b7"+f(S,4)+"\u2070\u02b7\u00b3\u00b7(1/("+f(n,3)+"\u00b7"+f(SxEff,4)+"))\u2070\u02b7\u2076"]),
      csResult("L\u209c", f(Lt,4)+" ft"),
    ])));

    body.push(csSection("Interception Efficiency, E (HEC-22 Eq. 4-20)", el("div",{},[
      L>=Lt
        ? csFormula(["L \u2265 L\u209c ("+f(L,1)+" \u2265 "+f(Lt,4)+") \u2192 E = 1.0 (100%)"])
        : el("div",{},[
            csFormula(["E = 1 \u2212 (1 \u2212 L/L\u209c)\u00b9\u02b7\u2078"]),
            csFormula(["E = 1 \u2212 (1 \u2212 "+f(L,1)+"/"+f(Lt,4)+")\u00b9\u02b7\u2078"]),
          ]),
      csResult("E", f(E,4)+" = "+f(E*100,2)+"%"),
    ])));

    // 6. Bypass
    const bypassCA = comp.bypassCA;
    const bypassQ  = comp.bypassQ;
    body.push(csSection("Bypass", el("div",{},[
      csFormula(["Bypass CA = total CA \u00d7 (1 \u2212 E) = "+f(comp.totalCA,5)+" \u00d7 (1 \u2212 "+f(E,4)+")"]),
      csResult("Bypass CA out", f(bypassCA,5)+" ac"),
      csResult("Bypass Q out", f(bypassQ,4)+" cfs"),
      row.bypassTo
        ? el("div",{class:"cs-note"}, "Routes to inlet: "+row.bypassTo)
        : el("div",{class:"cs-note"}, "No downstream bypass \u2014 flow leaves the gutter system."),
    ])));
  }

  const srcLabel = settings.rainfallSource==="noaa"
    ? (settings.county==="Fetched" && state.rainfall.fetchedNoaa ? "NOAA Atlas 14 — site-specific ("+String(state.rainfall.fetchedNoaa.displayName).slice(0,30)+")" : "NOAA Atlas 14 ("+settings.county+")")
    : settings.rainfallSource==="moco" ? "MoCo Agency Table" : "MDSHA Agency Table";
  return sheetWrapper("inlet", "Inlet Spacing \u2014 "+(row.label||row.id),
    "HEC-22 grate inlet \u2014 "+srcLabel+", "+settings.storm+", S="+(isSump?"SUMP":f(S,4)), body);
}

// printSize: falsy = letter portrait, "letter" = letter landscape, "tabloid" = 11×17 landscape
// ====== SECTION: Print ======
function printNodes(nodes, printSize){
  const pa = document.getElementById("printArea");
  pa.innerHTML = "";
  nodes.forEach(n=>pa.appendChild(n));
  if(printSize){
    const existing = document.getElementById("sdcLandscape");
    if(existing) existing.remove();
    const s = document.createElement("style");
    s.id = "sdcLandscape";
    if(printSize==="tabloid") s.textContent = "@media print { @page { size: 11in 17in landscape; } }";
    else s.textContent = "@media print { @page { size: letter landscape; } }";
    document.head.appendChild(s);
  }
  document.body.classList.add("print-mode");
  window.print();
}

function printAllSheets(){
  const nodes = [];
  state.drainage.forEach(r=>nodes.push(buildDrainageSheet(r)));
  state.structures.forEach(r=>nodes.push(buildStructureSheet(r.id)));
  state.pipes.forEach(r=>nodes.push(buildPipeSheet(r)));
  state.outletStructures.forEach(os=>{
    const { rows } = computeRatingCurve(os.id);
    rows.forEach(r=>nodes.push(buildOutletStageSheet(r, os)));
  });
  if(state.inletSpacing.length){
    const _is = state.inletSpacingSettings;
    const _rf = state.rainfall;
    const _isCtx = {
      street:          _is.street,
      allowableSpread: _is.allowableSpread,
      rainfallSource:  _rf.rainfallSource,
      county:          _rf.county,
      storm:           _rf.inletStorm,
      customNoaa:      _rf.customNoaa || {},
    };
    const isChain = computeInletChain(state.inletSpacing, _is);
    state.inletSpacing.forEach(r=>nodes.push(buildInletSpacingSheet(r, isChain.results[r.id], _isCtx)));
  }
  if(nodes.length===0){ toast("Nothing to print yet \u2014 add some rows first.", true); return; }
  printNodes(nodes);
}

function buildTablePrintSheet(viewId, title){
  const view = document.getElementById(viewId);
  if(!view) return null;
  const table = view.querySelector("table.data");
  if(!table) return null;
  const tbody = table.querySelector("tbody");
  if(!tbody || tbody.rows.length === 0) return null;

  // Capture select texts from live DOM before cloning —
  // cloneNode(true) copies attributes, not the programmatically-set .selected property,
  // so sel.selectedIndex on the clone is always 0 (the first/default option).
  const selectTexts = Array.from(table.querySelectorAll("select")).map(sel=>{
    const idx = sel.selectedIndex;
    return idx >= 0 && sel.options[idx] ? sel.options[idx].text : "";
  });

  const clone = table.cloneNode(true);
  clone.querySelectorAll("input:not([type=checkbox]), textarea").forEach(inp=>{
    inp.replaceWith(document.createTextNode(inp.value));
  });
  let _si = 0;
  clone.querySelectorAll("select").forEach(sel=>{
    sel.replaceWith(document.createTextNode(selectTexts[_si++]||""));
  });
  clone.querySelectorAll("button, input[type=checkbox]").forEach(b=>b.remove());

  const now = new Date();
  const pad = n=>String(n).padStart(2,"0");
  const dateStr = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());

  const sheet = el("div",{class:"calc-sheet cs-table-sheet"});
  sheet.appendChild(el("div",{class:"cs-header"},[
    el("div",{class:"cs-title"}, title),
    el("div",{class:"cs-sub"}, (state.project||"Untitled")+" — "+dateStr),
  ]));
  const wrap = el("div",{class:"table-wrap"});
  wrap.appendChild(clone);
  sheet.appendChild(wrap);
  sheet.appendChild(el("div",{class:"cs-footer"}, "Storm Drain Design Calculator — "+(state.project||"")));
  return sheet;
}

function buildOutletTablePrintSheet(){
  if(state.outletStructures.length===0) return [];
  const nodes = [];
  const now = new Date();
  const pad = n=>String(n).padStart(2,"0");
  const dateStr = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());

  state.outletStructures.forEach(os=>{
    const devices = devicesForOutlet(os.id);
    const { rows } = computeRatingCurve(os.id);
    if(!rows || rows.length===0) return;

    const table = el("table",{class:"data"});
    // Build header
    const headCells = [el("th",{},"Stage (ft)"), el("th",{},"TW (ft)")];
    devices.forEach(d=>headCells.push(el("th",{class:"computed"}, (d.label||d.id)+" Q (cfs)")));
    headCells.push(el("th",{class:"computed"},"Total Q (cfs)"));
    table.appendChild(el("thead",{},el("tr",{},headCells)));

    // Build body
    const tbody = el("tbody");
    rows.forEach(r=>{
      const cells = [
        el("td",{class:"out",style:"font-weight:700"}, fmt(r.stage,2)),
        el("td",{class:"out"}, r.tw!=null? fmt(r.tw,2) : "—"),
      ];
      r.devices.forEach(dr=>cells.push(el("td",{class:"out computed-cell"}, fmt(dr.Q,2))));
      cells.push(el("td",{class:"out computed-cell",style:"font-weight:700"}, fmt(r.total,2)));
      tbody.appendChild(el("tr",{},cells));
    });
    table.appendChild(tbody);

    const sheet = el("div",{class:"calc-sheet cs-table-sheet"});
    sheet.appendChild(el("div",{class:"cs-header"},[
      el("div",{class:"cs-title"}, "Outlet — "+(os.label||os.id)),
      el("div",{class:"cs-sub"}, (state.project||"Untitled")+" — "+dateStr),
    ]));
    const wrap = el("div",{class:"table-wrap"});
    wrap.appendChild(table);
    sheet.appendChild(wrap);
    sheet.appendChild(el("div",{class:"cs-footer"}, "Storm Drain Design Calculator — "+(state.project||"")));
    nodes.push(sheet);
  });
  return nodes;
}

function makeDetailSheet(title, heads, dataRows){
  if(!dataRows.length) return null;
  const now = new Date();
  const pad = n=>String(n).padStart(2,"0");
  const dateStr = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const table = el("table",{class:"data"});
  table.appendChild(el("thead",{},el("tr",{},heads)));
  const tbody = el("tbody");
  dataRows.forEach(cells=>tbody.appendChild(el("tr",{},cells)));
  table.appendChild(tbody);
  const sheet = el("div",{class:"calc-sheet cs-table-sheet"});
  sheet.appendChild(el("div",{class:"cs-header"},[
    el("div",{class:"cs-title"}, title),
    el("div",{class:"cs-sub"}, (state.project||"Untitled")+" — "+dateStr),
  ]));
  const wrap = el("div",{class:"table-wrap"});
  wrap.appendChild(table);
  sheet.appendChild(wrap);
  sheet.appendChild(el("div",{class:"cs-footer"}, "Storm Drain Design Calculator — "+(state.project||"")));
  return sheet;
}

function buildDrainageDetailSheet(){
  const rf = state.rainfall;
  const domStormEls = document.querySelectorAll("#view-drainage table.data thead th[data-storm]");
  const storms = domStormEls.length
    ? Array.from(domStormEls).map(th => th.dataset.storm)
    : visibleDaStorms(rf);
  const th = (t,c)=>el("th",c?{class:c}:{},t);
  const tdN = (v,d=2)=>el("td",{class:"out computed-cell"},fmt(v,d));
  const heads = [
    th("ID"), th("Description"), th("A (ac)"), th("C"), th("CA"), th("Cf"),
    th("Tc (min)"), th("Tc Method"),
  ];
  storms.forEach(s=>{
    heads.push(th("i "+s+"\n(in/hr)","computed"));
    heads.push(th("Q "+s+"\n(cfs)","computed"));
  });
  heads.push(th("Structure","computed"));
  const rows = state.drainage.map(row=>{
    const calc = calcDrainageRow(row);
    const tc = parseFloat(row.tc);
    const linked = state.structures.find(s=>s.drainageAreaId===row.id);
    const cells = [
      el("td",{},row.structureId||row.id), el("td",{},row.desc||""),
      tdN(calc.A,2), tdN(calc.C,3), tdN(calc.CA,3), tdN(calc.cf,2),
      el("td",{},isFinite(tc)?fmt(tc,1):"—"),
      el("td",{},row.tcMethod==="tr55"?"TR-55":"Direct"),
    ];
    storms.forEach(s=>{
      const i = (isFinite(tc)&&tc>0)
        ? lookupIntensity(tc, rf.rainfallSource, s, rf.county, rf.customNoaa||{}, rf.fetchedNoaa||null)
        : 0;
      cells.push(tdN(i>0?i:null,2));
      cells.push(tdN(calc.Qs[s],2));
    });
    cells.push(el("td",{class:"out computed-cell"}, linked?(linked.structureId||linked.id):"—"));
    return cells;
  });
  return makeDetailSheet("Drainage Area — Detail", heads, rows);
}

function buildStructuresDetailSheet(){
  const th = (t,c)=>el("th",c?{class:c}:{},t);

  const heads = [
    th("Structure ID"), th("Description"), th("Type"), th("DA"),
    th("Cap Q\n(cfs)","computed"), th("Inflow Q\n(cfs)","computed"),
    th("Total Q\n(cfs)","computed"), th("Out Pipe To"),
    th("Hf\n(ft)","computed"), th("Angle\n(°)"), th("Kb","computed"),
    th("Hb\n(ft)","computed"), th("U/S HGL\n(ft)","computed"),
    th("Pipe Crown\n(ft)","computed"), th("Crown Chk","computed"),
    th("Rim\n(ft)"),   th("Rim Chk","computed"),
  ];
  const rows = state.structures.map(row=>{
    const calc = computeStructureCalc(row.id);
    const typeLbl = (STRUCTURE_TYPES.find(t=>t[0]===row.type)||["",""])[1];
    const da = row.drainageAreaId ? findDrainage(row.drainageAreaId) : null;
    const outPipe = calc ? calc.outPipe : null;
    const toSt = outPipe ? findStructure(outPipe.toStructureId) : null;
    const inflow = calc ? calc.inflow.reduce((s,p)=>s+(isFinite(p.Q)?p.Q:0),0) : 0;
    const angle = outPipe ? parseFloat(outPipe.angle)||0 : 0;
    const compCrown = calc ? calc.crown : null;
    const crownAssumed = calc ? calc.crownAssumed : false;
    const rim = parseFloat(row.rim);
    const crownStyle = calc&&calc.crownPass===false ? "color:var(--fail);font-weight:700;" : "";
    const rimStyle   = calc&&calc.rimPass===false   ? "color:var(--fail);font-weight:700;" : "";
    return [
      el("td",{},row.structureId||row.id), el("td",{},row.desc||""),
      el("td",{},typeLbl),
      el("td",{},da?(da.structureId||da.id):"—"),
      tdN(calc?calc.captured:null,2), tdN(inflow,2),
      el("td",{class:"out computed-cell",style:"font-weight:700"},fmt(calc?calc.totalFlow:null,2)),
      el("td",{},toSt?(toSt.structureId||toSt.id):"—"),
      tdN(calc?calc.Hf:null,3),
      el("td",{},outPipe?fmt(angle,0)+"°":"—"),
      el("td",{class:"out computed-cell"},calc&&calc.kb!=null?fmt(calc.kb,2):"—"),
      tdN(calc?calc.Hb:null,3),
      el("td",{class:"out computed-cell",style:"font-weight:700"},fmt(calc?calc.elevation:null,2)),

        !calc||calc.rimPass===null?"—":calc.rimPass?"✓":"✗ FLOOD"),
