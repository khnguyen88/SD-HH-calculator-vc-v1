<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Drain Design Calculator</title>
<style>
:root{
  --bg:#0B1220;
  --panel:#121B2B;
  --panel-alt:#16202F;
  --panel-raise:#1B2740;
  --border:#26374D;
  --border-soft:#1E2C3F;
  --text:#E7EEF6;
  --muted:#8FA3BF;
  --muted-2:#5D7291;
  --accent:#38C6B4;
  --accent-dim:#2A9D8F;
  --accent-soft:rgba(56,198,180,0.12);
  --warn:#E5B94D;
  --fail:#E5484D;
  --fail-soft:rgba(229,72,77,0.12);
  --pass:#3DD68C;
  --pass-soft:rgba(61,214,140,0.12);
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  --radius:6px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns: 236px 1fr;
  min-height:100vh;
}

.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  gap:18px;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 6px 14px 6px;
  border-bottom:1px solid var(--border-soft);
}
.brand svg{ flex:0 0 auto; }
.brand-text{ display:flex; flex-direction:column; }
.brand-title{ font-weight:700; font-size:14.5px; letter-spacing:0.2px; }
.brand-sub{ font-size:10.5px; color:var(--muted-2); letter-spacing:0.6px; text-transform:uppercase; margin-top:2px;}

.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-btn{
  all:unset;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border-radius:var(--radius);
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  border:1px solid transparent;
}
.nav-btn:hover{ background:var(--panel-alt); color:var(--text); }
.nav-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:rgba(56,198,180,0.35); }
.nav-num{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--muted-2);
  width:16px;
}
.nav-btn.active .nav-num{ color:var(--accent); }

.sidebar-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
  font-size:11px;
  color:var(--muted-2);
}

/* ---------- Main ---------- */
.main{ display:flex; flex-direction:column; min-width:0; }

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(56,198,180,0.04), transparent);
}
.topbar-left{ display:flex; align-items:center; gap:12px; min-width:0; flex:1 1 auto; overflow:hidden; }
.project-name{
  background:transparent;
  border:1px solid transparent;
  color:var(--text);
  font-weight:600;
  font-size:15px;
  padding:5px 8px;
  border-radius:var(--radius);
  min-width:0;
  flex:1 1 auto;
  max-width:360px;
}
.project-name:hover, .project-name:focus{ border-color:var(--border); background:var(--panel-alt); outline:none;}
.tab-label{ color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.topbar-right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; flex-wrap:wrap; }

.btn{
  all:unset;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 13px;
  border-radius:var(--radius);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  border:1px solid var(--border);
  color:var(--text);
  background:var(--panel-alt);
  white-space:nowrap;
}
.btn:hover{ background:var(--panel-raise); border-color:var(--muted-2); }
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.btn-primary{ background:var(--accent); color:#04231F; border-color:var(--accent); }
.btn-primary:hover{ background:var(--accent-dim); border-color:var(--accent-dim); }
.btn:disabled{ opacity:0.45; cursor:not-allowed; pointer-events:none; }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:5px 9px; font-size:11.5px; }
.btn-danger{ color:var(--fail); }
.btn-danger:hover{ background:var(--fail-soft); border-color:var(--fail); }
.btn-active{ background:var(--accent-soft); color:var(--accent); border-color:rgba(56,198,180,0.35); }

.content{ padding:22px 26px 60px 26px; overflow-y:auto; }
.view{ display:none; max-width:1400px; }
.view.active{ display:block; }

h1{ font-size:19px; margin:0 0 4px 0; font-weight:700; }
h2{ font-size:15px; margin:0 0 2px 0; font-weight:700; }
.view-desc{ color:var(--muted); font-size:12.5px; margin:0 0 18px 0; max-width:760px; }

.section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px 18px 16px 18px;
  margin-bottom:18px;
}
.section-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;
}
.section-head p{ margin:2px 0 0 0; }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius:8px; }
table.data{
  border-collapse:collapse;
  width:100%;
  min-width:760px;
  font-size:12.5px;
}
table.data thead th{
  text-align:left;
  font-weight:600;
  color:var(--muted);
  background:var(--panel-alt);
  padding:9px 10px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  position:sticky; top:0;
}
table.data thead th.computed{ color:var(--accent); }
table.data tbody td{
  padding:6px 8px;
  border-bottom:1px solid var(--border-soft);
  vertical-align:middle;
  white-space:nowrap;
}
table.data tbody tr:hover{ background:rgba(255,255,255,0.02); }
table.data td.out{ font-family:var(--font-mono); color:var(--text); }
table.data td.computed-cell{ background:rgba(56,198,180,0.05); }

.cell-input{
  width:100%;
  min-width:64px;
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:5px;
  color:var(--text);
  padding:5px 7px;
  font-family:var(--font-mono);
  font-size:12.5px;
}
.cell-input:focus{ outline:none; border-color:var(--accent); background:var(--panel-raise); }
.cell-input.wide{ min-width:120px; }
.cell-input.txt{ font-family:var(--font-ui); }
select.cell-input{ font-family:var(--font-ui); }
.is-i-override { border-color:#e8a020 !important; }
.i-override input, .i-override { border-color: #f90 !important; }

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.3px;
  font-family:var(--font-mono);
}
.badge.pass{ background:var(--pass-soft); color:var(--pass); }
.badge.fail{ background:var(--fail-soft); color:var(--fail); }
.badge.neutral{ background:var(--panel-alt); color:var(--muted); }

.row-del{
  all:unset; cursor:pointer; color:var(--muted-2); padding:4px 6px; border-radius:5px; font-size:14px; line-height:1;
}
.row-del:hover{ color:var(--fail); background:var(--fail-soft); }

.add-row-btn{
  margin-top:10px;
}

/* ---------- Overview ---------- */
.flow-steps{ display:flex; flex-direction:column; gap:0; margin:18px 0; }
.flow-step{
  display:grid;
  grid-template-columns:34px 1fr;
  gap:14px;
  padding:14px 0;
  border-top:1px solid var(--border-soft);
}
.flow-step:first-child{ border-top:none; }
.flow-num{
  width:30px; height:30px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:13px;
}
.flow-title{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
.flow-body{ color:var(--muted); font-size:12.5px; max-width:760px; }
.flow-body code{ font-family:var(--font-mono); color:var(--accent); background:var(--accent-soft); padding:1px 5px; border-radius:4px; font-size:11.5px;}

.note{
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  background:var(--panel-alt);
  border-radius:0 8px 8px 0;
  padding:10px 14px;
  font-size:12px;
  color:var(--muted);
  margin:14px 0;
}
.note b{ color:var(--text); }
.note.warn{ border-left-color:var(--warn); }

/* ---------- Junction calculator ---------- */
.junction-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}
@media (max-width:920px){ .junction-grid{ grid-template-columns:1fr; } }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-weight:600; letter-spacing:0.2px;}
.field input, .field select{
  width:100%;
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px 10px;
  font-family:var(--font-mono);
}
.field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }

.pipe-input-row{ display:flex; gap:10px; }
.pipe-input-row .field{ flex:1; }

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 18px;
}
.result-item{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:8px 10px;
  background:var(--panel-alt);
  border-radius:6px;
  border:1px solid var(--border-soft);
}
.result-item .k{ color:var(--muted); font-size:11.5px; }
.result-item .v{ font-family:var(--font-mono); font-weight:700; font-size:13px; }
.result-item.hero{ grid-column:1 / -1; background:var(--accent-soft); border-color:rgba(56,198,180,0.35); }
.result-item.hero .v{ color:var(--accent); font-size:16px; }
.result-item.controls{ grid-column:1/-1; background:var(--pass-soft); border-color:rgba(61,214,140,0.35); }
.result-item.controls .v{ color:var(--pass); }

/* ---------- Reference table shading ---------- */
.ref-note{ color:var(--muted-2); font-style:italic; }

/* ---------- Footer helper text ---------- */
.hint{ font-size:11px; color:var(--muted-2); margin-top:8px; }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:var(--muted-2); }

/* Toast */
#toast{
  position:fixed; bottom:20px; right:20px;
  background:var(--panel-raise); border:1px solid var(--border);
  color:var(--text); padding:11px 16px; border-radius:8px;
  font-size:12.5px; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  opacity:0; transform:translateY(8px); transition:all .25s ease;
  pointer-events:none; z-index:50; max-width:360px;
}
#toast.show{ opacity:1; transform:translateY(0); }
#toast.err{ border-color:var(--fail); }
#toast.err b{ color:var(--fail); }

.saves-wrap{ position:relative; }
.saves-popover{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  z-index:200;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  min-width:320px;
  max-width:420px;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  padding:10px 0;
}
.saves-popover.open{ display:block; }
.saves-popover-header{
  padding:4px 14px 8px;
  font-size:11px;
  color:var(--muted);
  border-bottom:1px solid var(--border-soft);
  margin-bottom:6px;
}
.saves-empty{ padding:8px 14px; color:var(--muted); font-size:12.5px; }
.save-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 14px;
  cursor:pointer;
}
.save-row:hover{ background:rgba(255,255,255,0.03); }
.save-row-name{
  flex:1;
  font-size:12.5px;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:var(--font-mono);
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; }
}

input[type="file"]{ display:none; }

/* ---------------------------------------------------------------------
   Modal (detail preview)
--------------------------------------------------------------------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(4,8,14,0.72);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:26px;
}
.modal{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  width:min(760px, 100%);
  max-height:88vh;
  display:flex; flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,0.55);
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:14px 18px; border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.modal-title{ font-weight:700; font-size:14.5px; }
.modal-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.modal-body{ padding:20px 22px 26px 22px; overflow-y:auto; }

/* ---------------------------------------------------------------------
   Calculation sheet (shared by modal preview and print output)
--------------------------------------------------------------------- */
.calc-sheet{
  background:#fff; color:#111820;
  border-radius:8px; padding:22px 24px;
  font-size:12.5px;
}
.cs-header{ border-bottom:2px solid #111820; padding-bottom:10px; margin-bottom:16px; }
.cs-title{ font-size:17px; font-weight:800; color:#0B1220; }
.cs-sub{ font-size:12px; color:#4B5A6E; margin-top:2px; }
.cs-block{ margin-bottom:16px; }
.cs-block-title{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  color:#2A9D8F; margin-bottom:7px; padding-bottom:4px; border-bottom:1px solid #DCE4EC;
}
table.cs-kv{ border-collapse:collapse; width:100%; }
table.cs-kv td{ padding:4px 8px 4px 0; font-size:12.5px; vertical-align:top; }
table.cs-kv td.cs-k{ color:#4B5A6E; width:56%; }
table.cs-kv td.cs-v{ font-family:var(--font-mono); font-weight:600; color:#0B1220; }
.cs-formula-block{ margin:6px 0; }
.cs-formula-line{ font-family:var(--font-mono); font-size:12.5px; color:#1B2740; padding:2px 0; }
.cs-result{
  margin-top:8px; padding:8px 12px; background:#EFFAF7; border:1px solid #BEE9E0;
  border-radius:6px; font-size:13px; color:#0B1220;
}
.cs-result b{ font-family:var(--font-mono); color:#0F766E; font-size:14px; }
.cs-storm-q{ margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #E8ECF0; }
.cs-storm-q:last-child{ border-bottom:none; margin-bottom:0; }
.cs-storm-label{ font-weight:700; font-size:13px; color:#0B1220; margin-bottom:4px; }
.cs-note{ font-size:11.5px; color:#5D7291; font-style:italic; margin:4px 0; }
.cs-warn{
  font-size:12px; color:#8A4B00; background:#FFF4E0; border:1px solid #F3D28C;
  border-radius:6px; padding:7px 10px; margin:6px 0;
}
.cs-footer{ margin-top:18px; padding-top:10px; border-top:1px solid #DCE4EC; font-size:10.5px; color:#8A97A8; }

/* ---------------------------------------------------------------------
   Print
--------------------------------------------------------------------- */
#printArea{ display:none; }
body.print-mode .app{ display:none; }
body.print-mode #toast{ display:none; }
body.print-mode .modal-overlay{ display:none !important; }
body.print-mode #printArea{ display:block; background:#fff; }
body.print-mode #printArea .calc-sheet{
  border-radius:0; padding:0.4in; min-height:9.5in;
  page-break-after:always; break-after:page;
}
body.print-mode #printArea .calc-sheet:last-child{ page-break-after:auto; }

@media print{
  .app, #toast{ display:none !important; }
  #printArea{ display:block !important; }
  #printArea .calc-sheet{ page-break-after:always; break-after:page; }
  #printArea .calc-sheet:last-child{ page-break-after:auto; }
  @page{ margin:0.5in; }
}

/* Table printout sheets */
body.print-mode #printArea .cs-table-sheet{
  min-height:auto;
  padding:0.3in;
}
.cs-table-sheet table.data{
  font-size:9.5px;
  width:100%;
  table-layout:auto;
}
.cs-table-sheet table.data th,
.cs-table-sheet table.data td{
  padding:2px 5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:120px;
}
@media print{
  .cs-table-sheet table.data{ font-size:8.5px; }
  .cs-table-sheet table.data th,
  .cs-table-sheet table.data td{ max-width:90px; }
}

.topbar-center{
  display:none;
  align-items:center;
  flex:0 0 auto;
}
.mobile-nav-panel{
  display:none;
  flex-direction:column;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:8px;
  gap:2px;
}
.mobile-nav-panel.open{ display:flex; }
.tablet-nav{
  display:none;
  flex-direction:row;
  overflow-x:auto;
  scrollbar-width:none;
  align-items:center;
  gap:2px;
  flex:1 1 auto;
}
.tablet-nav::-webkit-scrollbar{ display:none; }

.carousel-btn{
  all:unset;
  display:none;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  width:28px;
  height:28px;
  border-radius:var(--radius);
  color:var(--muted);
  cursor:pointer;
  font-size:22px;
  line-height:1;
}
.carousel-btn:hover{ background:var(--panel-raise); color:var(--text); }
.carousel-btn:disabled{ opacity:0.2; cursor:default; pointer-events:none; }

/* Tablet (481px–1024px): sidebar hidden, three stacked topbar rows */
@media (min-width:481px) and (max-width:1024px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ display:none; }
  .topbar{ flex-direction:column; align-items:stretch; gap:0; padding:0; }
  .topbar-left{ padding:8px 14px; }
  .topbar-center{ display:flex; align-items:center; padding:4px 8px; gap:2px; background:var(--panel-alt); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
  .topbar-right{ padding:6px 14px; justify-content:flex-end; flex-wrap:wrap; }
  .tablet-nav{ display:flex; }
  .carousel-btn{ display:flex; }
  .hamburger-only{ display:none !important; }
  .mobile-nav-panel{ display:none !important; }
}

/* Mobile (≤480px): sidebar hidden, hamburger button only */
@media (max-width:480px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ display:none; }
  .topbar{ gap:6px; padding:8px 10px; }
  .topbar-center{ display:flex; }
  .mobile-hidden{ display:none !important; }
  .tab-label{ display:none; }
  .btn-label{ display:none; }
}

/* ---------------------------------------------------------------------
   Number input UX: no native spinner clutter, no accidental scroll-wheel
   changes while a field happens to be focused under the cursor.
--------------------------------------------------------------------- */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none; margin:0;
}
input[type="number"]{ -moz-appearance:textfield; }
input[inputmode="decimal"]:disabled{ opacity:0.55; cursor:not-allowed; }

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 8 H10 V16 H18 V11 H28" stroke="#38C6B4" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="2" cy="8" r="2" fill="#38C6B4"/>
        <circle cx="10" cy="16" r="2" fill="#38C6B4"/>
        <circle cx="18" cy="11" r="2" fill="#38C6B4"/>
        <circle cx="28" cy="11" r="2" fill="#38C6B4"/>
      </svg>
      <div class="brand-text">
        <div class="brand-title">Drainage Calc</div>
        <div class="brand-sub">Design &amp; HGL Tool</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">Runs entirely in your browser.<br>No data is uploaded or stored remotely.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <input id="projectName" class="project-name" type="text" value="Untitled Storm Drain Project" spellcheck="false" aria-label="Project name">
        <span class="tab-label" id="tabLabel"></span>
      </div>

// ====== SECTION: Hydrology / Rational Method ======
function interpolatePL(tc, breakpoints) {
  if (!breakpoints || breakpoints.length === 0) return 0;
  if (tc <= breakpoints[0][0]) return breakpoints[0][1];
  for (let j = 1; j < breakpoints.length; j++) {
    const [t0, i0] = breakpoints[j-1];
    const [t1, i1] = breakpoints[j];
    if (tc <= t1) return i0 + (i1-i0)*((tc-t0)/(t1-t0));
  }
  return breakpoints[breakpoints.length-1][1];
}

// Parse the NOAA Atlas 14 PFDS point API response (a JS/Python-ish text blob,
// not JSON — the quantiles array uses single-quoted strings) into the same
// { "1yr":{5,10,15,...,1440}, ..., "500yr":{...} } shape as NOAA_ATLAS14.
// 19 durations x 10 return periods; depths are inches. Rows 0-9 are:
//   5,10,15,30,60,120,180,360,720,1440 min (5-min through 24-hr).
// Columns: 1yr=0, 2yr=1, 5yr=2, 10yr=3, 25yr=4, 50yr=5, 100yr=6, 200yr=7, 500yr=8.
function parseNoaaResponse(text) {
  const m = text.match(/quantiles\s*=\s*(\[)/);
  if (!m) throw new Error("Unexpected NOAA response format.");
  const start = m.index + m[0].length - 1;
  let depth = 0, i = start;
  while (i < text.length) {
    if (text[i] === "[") depth++;
    else if (text[i] === "]") { depth--; if (depth === 0) break; }
    i++;
  }
  let quantiles;
  try {
    quantiles = JSON.parse(text.slice(start, i + 1).replace(/'/g, '"')).map(r => r.map(parseFloat));
  } catch (_) { throw new Error("Failed to parse NOAA data."); }
  if (!quantiles || quantiles.length < 10) throw new Error("Failed to parse NOAA data.");
  const durations = [5, 10, 15, 30, 60, 120, 180, 360, 720, 1440];
  const stormCols = { "1yr":0, "2yr":1, "5yr":2, "10yr":3, "25yr":4, "50yr":5, "100yr":6, "500yr":8 };
  const result = {};
  for (const [storm, col] of Object.entries(stormCols)) {
    result[storm] = {};
    durations.forEach((d, row) => {
      result[storm][d] = Math.round(quantiles[row][col] * (60 / d) * 100) / 100;
    });
  }
  return result;
}

function lookupIntensity(tc, source, storm, county, customNoaa, fetchedNoaa) {
  if (source === "noaa") {
    if (county === "Fetched" && fetchedNoaa && fetchedNoaa[storm]) {
      const pts = [5,10,15,30,60,120,180,360,720,1440].map(d => [d, fetchedNoaa[storm][d]]).filter(([,v]) => isFinite(v));
      return interpolatePL(tc, pts);
    }
    if (county === "Custom") {
      const pts = [[5,customNoaa[5]],[10,customNoaa[10]],[15,customNoaa[15]],[30,customNoaa[30]],[60,customNoaa[60]]]
        .filter(([,v]) => v !== "" && v != null && isFinite(Number(v)))
        .map(([t,v]) => [t, Number(v)]);
      return interpolatePL(tc, pts);
    }
    const entry = NOAA_ATLAS14[county];
    if (!entry) return 0;
    const stormData = entry[storm] || entry["10yr"];
    const pts = [5,10,15,30,60].map(d => [d, stormData[d]]);
    return interpolatePL(tc, pts);
  }
  if (source === "moco") {
    const curve = MOCO_INTENSITY[storm] || MOCO_INTENSITY["10yr"];
    return interpolatePL(tc, curve);
  }
  // default: "mdsha"
  const curve = MDSHA_INTENSITY[storm] || MDSHA_INTENSITY["10yr"];
  return interpolatePL(tc, curve);
}

function computeSxEff(Sx, a, W, Q, S, n) {
  if (!(Q > 0) || !(W > 0) || !(a > 0)) return Sx;
  const V    = (a + Sx * W) / W;
  const Qw   = (0.56 / n) * Math.pow(V, 1.667) * Math.pow(S, 0.5) * Math.pow(W, 2.667);
  const Wratio = (a / (a + Sx * W)) * (Qw / Q);
  return Sx + (a / W) * Wratio;
}

function computeSpread(Q, n, SxEff, S) {
  if (!(Q > 0) || !(SxEff > 0) || !(S > 0)) return 0;
  return Math.pow((Q * n) / (0.56 * Math.pow(SxEff, 1.67) * Math.pow(S, 0.5)), 0.3745);
}

function computeInterception(L, Q, S, n, SxEff, a) {
  if (!(Q > 0) || !(S > 0) || !(SxEff > 0)) return { Lt: 0, E: 1, bypass_frac: 0 };
  const k = (!(a > 0)) ? 0.60 : (L >= 15 ? 0.54 : 0.58);
  const Lt = k * Math.pow(Q, 0.42) * Math.pow(S, 0.3) * Math.pow(1 / (n * SxEff), 0.6);
  if (L >= Lt) return { Lt, E: 1, bypass_frac: 0 };
  const E = 1 - Math.pow(1 - L / Lt, 1.8);
  return { Lt, E, bypass_frac: 1 - E };
}

function resolvedInletFields(row) {
  const out = {
    area: row.area, C: row.C, tc: row.tc,
    areaFromDA: false, CFromDA: false, tcFromDA: false,
  };
  if (!row.linkedStructureId) return out;
  const st = state.structures.find(s => s.id === row.linkedStructureId);
  if (!st || !st.drainageAreaId) return out;
  const da = findDrainage(st.drainageAreaId);
  if (!da) return out;
  if (row.area === "" || row.area == null) { out.area = da.area; out.areaFromDA = true; }
  if (row.C   === "" || row.C   == null)  { out.C   = da.C;    out.CFromDA   = true; }
  if (row.tc  === "" || row.tc  == null)  { out.tc  = da.tc;   out.tcFromDA  = true; }
  return out;
}

function resolvedInletLabel(row) {
  if (!row.linkedStructureId) return row.label;
  const st = state.structures.find(s => s.id === row.linkedStructureId);
  return st ? (st.structureId || st.id) : row.label;
}

function computeInletRow(row, settings, bypassQIn, bypassCAIn) {
  const isSump = String(row.S).toUpperCase() === "SUMP";
  const rif  = resolvedInletFields(row);
  const tc   = Number(rif.tc);
  const area = Number(rif.area);
  const C    = Number(rif.C);
  const S    = isSump ? 0 : Number(row.S);
  const Sx   = Number(row.Sx);
  const W    = Number(row.W);
  const a    = Number(row.a);
  const n    = Number(row.n);
  const L    = Number(row.L);
  const allowT = Number(row.allowableSpread || settings.allowableSpread);

  const rf = state.rainfall;
  const iComputed = (isFinite(tc) && tc > 0)
    ? lookupIntensity(tc, rf.rainfallSource, rf.inletStorm, rf.county, rf.customNoaa || {}, rf.fetchedNoaa || null)
    : 0;
  const i = (row.iOverride !== "" && row.iOverride != null && isFinite(Number(row.iOverride)))
    ? Number(row.iOverride)
    : iComputed;

  const localCA = (isFinite(C) && isFinite(area)) ? C * area : 0;
  const localQ  = localCA * i;
  const Q       = localQ + (isFinite(bypassQIn) ? bypassQIn : 0);
  const totalCA = localCA + (isFinite(bypassCAIn) ? bypassCAIn : 0);

  if (isSump) {
    return { i, iComputed, Q, totalCA, isSump: true,
             SxEff: null, T: null, Lt: null, E: 1, bypassFrac: 0,
             bypassQ: 0, bypassCA: 0, pickupPct: 100, allowT,
             warn: false };
  }

  const SxEff = (isFinite(Sx) && Sx > 0 && isFinite(W) && W > 0)
    ? computeSxEff(Sx, a, W, Q, S, n)
    : (isFinite(Sx) ? Sx : 0);
  const T     = (Q > 0 && SxEff > 0 && S > 0) ? computeSpread(Q, n, SxEff, S) : 0;
  const { Lt, E, bypass_frac } = (Q > 0 && isFinite(L) && L > 0)
    ? computeInterception(L, Q, S, n, SxEff, a)
    : { Lt: 0, E: 1, bypass_frac: 0 };
  const bypassQ  = Q * bypass_frac;
  const bypassCA = totalCA * bypass_frac;

  return {
    i, iComputed, Q, totalCA, isSump: false,
    SxEff, T, Lt, E, bypassFrac: bypass_frac,
    bypassQ, bypassCA,
    pickupPct: E * 100,
    allowT,
    warn: allowT > 0 && T > allowT,
  };
}

// Bypass chain: computes all rows in topological order (upstream first).
// CRITICAL (workbook convention): bypass carries CA, not Q. A downstream
// inlet's Q = (local CA + bypass CA in) * its OWN intensity. We still pass
// bypassQIn for display, computed as bypassCA * the RECEIVING row's intensity.
// Returns { results: Map<rowId, comp>, order: [rowId...], cycles: [msg...], bypassCAIn: Map<rowId, number> }
function computeInletChain(rows, settings) {
  const byLabel = {};
  rows.forEach(r => { if (r.label) byLabel[r.label] = r; });

  const downstream = {};   // id -> downstream id | null
  rows.forEach(r => {
    const tgt = r.bypassTo && byLabel[r.bypassTo];
    downstream[r.id] = tgt ? tgt.id : null;
  });

  // Orphan check: bypassTo references a label that doesn't exist
  const orphans = [];
  rows.forEach(r => {
    if (r.bypassTo && !byLabel[r.bypassTo]) {
      orphans.push(`Inlet "${r.label || "(unlabeled)"}" bypasses to "${r.bypassTo}" which does not exist — treated as 0.`);
    }
  });

  // Kahn's topological sort
  const indegree = {};
  rows.forEach(r => indegree[r.id] = 0);
  rows.forEach(r => { const d = downstream[r.id]; if (d != null) indegree[d]++; });
  const queue = rows.filter(r => indegree[r.id] === 0).map(r => r.id);
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    const d = downstream[id];
    if (d != null) { indegree[d]--; if (indegree[d] === 0) queue.push(d); }
  }

  // Cycle detection: rows not reached are in cycles
  const inOrder = new Set(order);
  const cycles = [];
  const cyclicIds = new Set();
  rows.forEach(r => {
    if (!inOrder.has(r.id)) {
      cyclicIds.add(r.id);
      cycles.push(`Bypass chain cycle detected involving inlet "${r.label || r.id}" — circular references are ignored and those rows show no results.`);
    }
  });

  // Accumulate bypass CA in topological order
  const bypassCAIn = {};
  rows.forEach(r => bypassCAIn[r.id] = 0);
  const results = {};
  order.forEach(id => {
    const row = rows.find(r => r.id === id);
    if (!row) return;
    const caIn = bypassCAIn[id];
    // Receiving row's own intensity converts carried CA to Q (workbook convention)
    const bypassQIn = caIn * computeRowIntensity(row, settings);
    const comp = computeInletRow(row, settings, bypassQIn, caIn);
    results[id] = comp;
    const d = downstream[id];
    if (d != null) bypassCAIn[d] += comp.bypassCA;
  });

  // Cyclic rows get a zero placeholder so the UI doesn't crash
  rows.forEach(r => {
    if (!results[r.id]) {
      results[r.id] = { i:0, iComputed:0, Q:0, totalCA:0, isSump:false, SxEff:0, T:0,
                        Lt:0, E:0, bypassFrac:1, bypassQ:0, bypassCA:0, pickupPct:0,
                        allowT:0, warn:false, cycle:true };
    }
  });

  return { results, order, cycles, orphans, bypassCAIn };
}

// The intensity this row would use (for converting carried bypass CA to Q)
function computeRowIntensity(row, settings) {
  const tc = Number(row.tc);
  const rf = state.rainfall;
  const iComputed = (isFinite(tc) && tc > 0)
    ? lookupIntensity(tc, rf.rainfallSource, rf.inletStorm, rf.county, rf.customNoaa || {}, rf.fetchedNoaa || null)
    : 0;
  return (row.iOverride !== "" && row.iOverride != null && isFinite(Number(row.iOverride)))
    ? Number(row.iOverride) : iComputed;
}

/* ---------------------------------------------------------------------
   Geometry / Manning's helpers
--------------------------------------------------------------------- */
function circularAreaSf(diamIn){
  const d = diamIn/12;
  return Math.PI/4*d*d;
}

function ellipticalLookup(spanIn, riseIn){
  let best=null, bestDiff=Infinity;
  for(const row of TABLE46){
    if(row.espan==null) continue;
    const diff = Math.abs(row.espan-spanIn) + Math.abs(row.erise-riseIn);
    if(diff<bestDiff){ bestDiff=diff; best=row; }
  }
  return best;
}

function pipeGeometry(row){
  if(!row) return null;
  if(row.shape==="circular"){
    const d = parseFloat(row.size);
    if(!isFinite(d) || d<=0) return null;
    return { areaSf: circularAreaSf(d), equivDiamIn: d };
  } else {
    const parts = String(row.size||"").toLowerCase().split(/x/);
    const span = parseFloat(parts[0]), rise = parseFloat(parts[1]);
    if(!isFinite(span) || !isFinite(rise)) return null;
    const look = ellipticalLookup(span, rise);
    if(!look) return null;
    return { areaSf: look.earea, equivDiamIn: look.cdia };
  }
}

function manningFullFlow(n, areaSf, equivDiamIn, slope){
  const R = (equivDiamIn/12)/4;
  const V = (1.486/n) * Math.pow(R, 2/3) * Math.sqrt(Math.max(slope,0));
  const Qfull = V*areaSf;
  return {R, V, Qfull};
}

function pipeEffectiveN(row) {
  if (row.material) {
    const mat = state.pipeMaterials.find(m => m.id === row.material);
    if (mat) return parseFloat(mat.n) || 0;
  }
  return parseFloat(row.n) || 0;
}

function frictionSlope(Q, n, areaSf, R){
  if(areaSf<=0 || R<=0) return 0;
  const denom = 1.486*areaSf*Math.pow(R,2/3);
  if(denom<=0) return 0;
  return Math.pow((Q*n)/denom, 2);
}

function interpKb(columnKey, angleDeg){
  if(!columnKey) return 0;
  const rows = [...state.kb].filter(r=>isFinite(parseFloat(r.angle))).map(r=>({angle:parseFloat(r.angle), inlet:parseFloat(r.inlet)||0, manhole:parseFloat(r.manhole)||0, bend:parseFloat(r.bend)||0})).sort((a,b)=>a.angle-b.angle);
  if(rows.length===0) return 0;
  if(angleDeg<=rows[0].angle) return rows[0][columnKey];
  if(angleDeg>=rows[rows.length-1].angle) return rows[rows.length-1][columnKey];
  for(let i=0;i<rows.length-1;i++){
    const a=rows[i], b=rows[i+1];
    if(angleDeg>=a.angle && angleDeg<=b.angle){
      if(b.angle===a.angle) return a[columnKey];
      const t=(angleDeg-a.angle)/(b.angle-a.angle);
      return a[columnKey] + t*(b[columnKey]-a[columnKey]);
    }
  }
  return rows[rows.length-1][columnKey];
}

function kAhFromAngle(structureCategory, deflectionDeg) {
  const d = isFinite(parseFloat(deflectionDeg)) ? parseFloat(deflectionDeg) : 0;
  const theta = 180 - d;  // interior angle; 180 = straight through
  if (structureCategory === "inlet") {
    // HEC-22 Table 9.4: straight→0.50, 90°→1.50; linear between
    return 0.50 + (1.50 - 0.50) * ((180 - theta) / 90);
  }
  // access_hole (manhole / junction box): piecewise linear, HEC-22 Table 9.4
  const pts = [[180, 0.15], [157.5, 0.45], [135, 0.75], [120, 0.85], [90, 1.00]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [t1, k1] = pts[i], [t2, k2] = pts[i + 1];
    if (theta >= t2) {
      return k1 + (k2 - k1) * ((t1 - theta) / (t1 - t2));
    }
  }
  return 1.00;  // clamp for deflection > 90°
}

function resolveStructureCategory(s) {
  if (s.structureMode === "standard" && s.agency && s.standardStructureId) {
    const entry = (STRUCTURE_CATALOG[s.agency] || []).find(e => e.id === s.standardStructureId);
    return entry ? entry.category : "access_hole";
  }
  return s.structureCategory || "access_hole";
}

function calcDrainageRow(row) {
  const A  = parseFloat(row.area) || 0;
  const C  = parseFloat(row.C)    || 0;
  const cf = parseFloat(row.cf)   || 1;
  const tc = parseFloat(row.tc);
  const CA = C * A;
  const r  = state.rainfall;

  const iOverridden = row.iOverride !== "" && row.iOverride != null && isFinite(Number(row.iOverride));

  function intensityFor(storm) {
    if (iOverridden) return Number(row.iOverride);
    if (!isFinite(tc) || tc <= 0) return 0;
    return lookupIntensity(tc, r.rainfallSource, storm, r.county, r.customNoaa || {}, r.fetchedNoaa || null);
  }

  const storms = availableStorms(r.rainfallSource);
  const Qs = {};
  storms.forEach(s => { Qs[s] = cf * CA * intensityFor(s); });

  return { CA, cf, A, C, Qs, storms, designQ: Qs[r.pipeStorm] || 0, iOverridden };
}

/* =======================================================================
   TR-55 Segmental Time of Concentration
   NRCS TR-55 (1986), Chapter 3 / Worksheet 3. Tc = sum of travel times for
   any number of flow segments (sheet flow, shallow concentrated flow, and
   channel/pipe flow) in any order - matching the real worksheet, which
   labels an arbitrary chain of reaches AB, BC, CD, ... rather than assuming
   exactly one segment of each type. Every function returns 0 (not NaN) when
   its inputs are incomplete, so a partially-filled worksheet still shows a
   sensible running total instead of breaking.
======================================================================= */
const TR55_SHALLOW_CP = {
  paved: {cp:20.328, label:"Paved"},
  unpaved: {cp:16.1345, label:"Unpaved / grassed waterway (urban)"},
  bare: {cp:9.965, label:"Nearly bare and untilled"},
  cultivated: {cp:8.762, label:"Cultivated, straight row crops"},
  prairie: {cp:6.962, label:"Prairie, short-grass"},
  minTillage: {cp:5.032, label:"Minimum tillage cultivation / woodlands"},
  forest: {cp:2.516, label:"Forest, heavy ground litter"},
};
// TR-55 Table 3-1 - Roughness coefficients (Manning's n) for sheet flow.
const TR55_SHEET_N = {
  smooth: {n:0.011, label:"Smooth surfaces (concrete, asphalt, gravel, bare soil)"},
  fallow: {n:0.05, label:"Fallow (no residue)"},
  cultivatedLow: {n:0.06, label:"Cultivated soil, residue cover \u226420%"},
  cultivatedHigh: {n:0.17, label:"Cultivated soil, residue cover >20%"},
  shortGrass: {n:0.15, label:"Short grass prairie"},
  denseGrass: {n:0.24, label:"Dense grasses"},
  bermuda: {n:0.41, label:"Bermuda grass"},
  range: {n:0.13, label:"Range (natural)"},
  woodsLight: {n:0.40, label:"Woods, light underbrush"},
  woodsDense: {n:0.80, label:"Woods, dense underbrush"},
};
// Typical open-channel Manning's n - standard reference values (e.g. Chow),
// offered as editable starting points, not a substitute for site-specific
// judgment - verify against your project's actual channel condition.
const TR55_CHANNEL_N = {
  smoothPipe: {n:0.011, label:"Smooth pipe (PVC)"},
  concreteSmooth: {n:0.013, label:"Concrete, trowel finish / RCP"},
  corrugatedMetal: {n:0.024, label:"Corrugated metal pipe"},
  concreteRough: {n:0.017, label:"Concrete, unfinished"},
  earthClean: {n:0.022, label:"Earth channel, clean, straight"},
  riprap: {n:0.035, label:"Riprap lined"},
  earthGrass: {n:0.035, label:"Earth channel, grassed"},
  naturalClean: {n:0.030, label:"Natural stream, clean, straight"},
  naturalWeedy: {n:0.050, label:"Natural stream, weedy, winding"},
};
const TR55_SEGMENT_TYPES = [["sheet","Sheet flow"],["shallow","Shallow concentrated flow"],["channel","Channel / pipe flow"]];

// ====== SECTION: TR-55 Travel Time ======
function tr55SheetFlowTt(n, L, s, P2){
  if(![n,L,s,P2].every(v=>isFinite(v) && v>0)) return 0;
  return (0.007*Math.pow(n*L, 0.8)) / (Math.pow(P2,0.5) * Math.pow(s,0.4));
}
function tr55ShallowVelocity(surfaceKey, s){
  const entry = TR55_SHALLOW_CP[surfaceKey] || TR55_SHALLOW_CP.unpaved;
  if(!isFinite(s) || s<=0) return 0;
  return entry.cp * Math.sqrt(s);
}
function tr55TravelTime(L, V){
  if(!isFinite(L) || L<=0 || !isFinite(V) || V<=0) return 0;
  return L / (3600*V);
}
function tr55ChannelVelocity(n, area, wp, s){
  if(![n,area,wp,s].every(v=>isFinite(v) && v>0)) return 0;
  const r = area/wp;
  return (1.486/n) * Math.pow(r, 2/3) * Math.sqrt(s);
}

function tr55DefaultSegment(type){
  if(type==="sheet") return {id:nextId(), type, n:"", L:"", s:"", P2:""};
  if(type==="shallow") return {id:nextId(), type, L:"", s:"", surface:"unpaved"};
  return {id:nextId(), type:"channel", L:"", s:"", n:"", area:"", wp:""};
}

// Computes one segment's travel time and any intermediate values (velocity,
// hydraulic radius) worth showing in the UI/print sheet.
function tr55SegmentCalc(seg){
  if(seg.type==="sheet"){
    const tt = tr55SheetFlowTt(parseFloat(seg.n), parseFloat(seg.L), parseFloat(seg.s), parseFloat(seg.P2));
    return { tt, V:null, r:null };
  }
  if(seg.type==="shallow"){
    const V = tr55ShallowVelocity(seg.surface, parseFloat(seg.s));
    const tt = tr55TravelTime(parseFloat(seg.L), V);
    return { tt, V, r:null };
  }
  if(seg.type==="channel"){
    const area = parseFloat(seg.area), wp = parseFloat(seg.wp);
    const r = (isFinite(area) && isFinite(wp) && wp>0) ? area/wp : 0;
    const V = tr55ChannelVelocity(parseFloat(seg.n), area, wp, parseFloat(seg.s));
    const tt = tr55TravelTime(parseFloat(seg.L), V);
    return { tt, V, r };
  }
  return { tt:0, V:null, r:null };
}

function computeTr55(row){
  const segments = (row.tr55 && row.tr55.segments) || [];
  const results = segments.map(seg => Object.assign({segment:seg}, tr55SegmentCalc(seg)));
  const totalHr = results.reduce((a,b)=> a+(isFinite(b.tt)?b.tt:0), 0);
  const sheetCount = segments.filter(s=>s.type==="sheet").length;
  const firstNonSheetIdx = segments.findIndex(s=>s.type!=="sheet");
  const sheetAfterOtherIdx = segments.findIndex((s,i)=> s.type==="sheet" && firstNonSheetIdx>=0 && i>firstNonSheetIdx);
  const warnings = [];
  if(sheetCount>1) warnings.push("More than one sheet-flow segment is unusual \u2014 sheet flow normally occurs only once, at the very start of the flow path, before it concentrates.");
  if(sheetAfterOtherIdx>=0) warnings.push("A sheet-flow segment appears after a shallow/channel segment \u2014 flow doesn't typically revert to sheet flow once it has concentrated. Check the segment order.");
  return { results, totalHr, totalMin: totalHr*60, warnings };
}

/* ---------------------------------------------------------------------
   Network graph helpers
--------------------------------------------------------------------- */
// ====== SECTION: Network Graph / Flow ======
function findStructure(id){ return state.structures.find(s=>s.id===id) || null; }
function findDrainage(id){ return state.drainage.find(d=>d.id===id) || null; }
function findPipe(id){ return state.pipes.find(p=>p.id===id) || null; }

function getOutgoingPipes(structureId){ return state.pipes.filter(p=>p.fromStructureId===structureId); }
function getIncomingPipes(structureId){ return state.pipes.filter(p=>p.toStructureId===structureId); }
function getOutgoingPipe(structureId){ const list=getOutgoingPipes(structureId); return list.length? list[0] : null; }

function capturedQFor(structure, stormOverride){
  if(!structure || !structure.drainageAreaId) return 0;
  const da = findDrainage(structure.drainageAreaId);
  if(!da) return 0;
  const calc = calcDrainageRow(da);
  return stormOverride ? (calc.Qs[stormOverride] || 0) : calc.designQ;
}

// Given a splitter structure and the total flow arriving at it, returns how
// much goes to the Primary path vs the Secondary path.
function computeSplitterSplit(st, totalFlow){
  if(st.splitMethod === "ratio"){
    let ratio = parseFloat(st.splitRatio);
    if(!isFinite(ratio)) ratio = 0.5;
    ratio = Math.min(Math.max(ratio,0),1);
    const primaryQ = totalFlow*ratio;
    return { method:"ratio", ratio, cap:null, primaryQ, secondaryQ: totalFlow-primaryQ };
  }
  const cap = Math.max(parseFloat(st.splitCapacity)||0, 0);
  const primaryQ = Math.min(totalFlow, cap);
  return { method:"capacity", ratio:null, cap, primaryQ, secondaryQ: totalFlow-primaryQ };
}

// Total flow leaving a structure = its own captured runoff + the flow
// carried by every pipe that flows INTO it. Each inflow pipe's contribution
// is that pipe's own designQ (pipeDesignQ), which is normally the full total
// flow of its From structure -- unless that From structure is a Flow
// Splitter, in which case only the Primary or Secondary share applies.
function computeTotalFlow(structureId, seen, stormOverride){
  seen = seen || new Set();
  const st = findStructure(structureId);
  if(!st) return {Q:0, captured:0, inflow:[], error:null};
  if(seen.has(structureId)) return {Q:0, captured:0, inflow:[], error:"circular"};
  const nextSeen = new Set(seen);
  nextSeen.add(structureId);
  const captured = capturedQFor(st, stormOverride);
  const inflowPipes = getIncomingPipes(structureId);
  const inflow = inflowPipes.map(p=>{
    const q = pipeDesignQ(p, nextSeen, stormOverride);
    return { pipe:p, fromId:p.fromStructureId, Q: q, error:null };
  });
  const sum = inflow.reduce((a,b)=>a+(isFinite(b.Q)?b.Q:0), 0);
  return { Q: captured+sum, captured, inflow, error:null };
}

function computeContributingArea(structureId, seen){
  if(!structureId) return {sumA:0, sumCA:0, controlTc:0};
  seen = seen || new Set();
  if(seen.has(structureId)) return {sumA:0, sumCA:0, controlTc:0};
  const newSeen = new Set(seen);
  newSeen.add(structureId);
  const st = findStructure(structureId);
  if(!st) return {sumA:0, sumCA:0, controlTc:0};
  let sumA=0, sumCA=0, controlTc=0;
  if(st.drainageAreaId){
    const da = findDrainage(st.drainageAreaId);
    if(da){
      const A=parseFloat(da.area)||0, C=parseFloat(da.C)||0;
      sumA+=A; sumCA+=C*A;
      controlTc=Math.max(controlTc, parseFloat(da.tc)||0);
    }
  }
  getIncomingPipes(structureId).forEach(p=>{
    const up = computeContributingArea(p.fromStructureId, newSeen);
    sumA+=up.sumA; sumCA+=up.sumCA;
    controlTc=Math.max(controlTc, up.controlTc);
  });
  return {sumA, sumCA, controlTc};
}

function pipeDesignQ(pipeRow, seen, stormOverride){
  if(!pipeRow || !pipeRow.fromStructureId) return 0;
  const fromSt = findStructure(pipeRow.fromStructureId);
  const totalFlow = computeTotalFlow(pipeRow.fromStructureId, seen, stormOverride).Q;
  if(fromSt && fromSt.type === "splitter"){
    const split = computeSplitterSplit(fromSt, totalFlow);
    if(pipeRow.splitRole === "primary") return split.primaryQ;
    if(pipeRow.splitRole === "secondary") return split.secondaryQ;
    return 0; // role not assigned yet
  }
  return totalFlow;
}

// ====== SECTION: Pipe Hydraulics ======
function pipeInvertState(pipe) {
  const US = parseFloat(pipe.upstreamInvert);
  const DS = parseFloat(pipe.downstreamInvert);
  const L  = parseFloat(pipe.length);
  const hasUS = isFinite(US), hasDS = isFinite(DS), hasL = isFinite(L) && L > 0;
  if (hasUS && hasDS && hasL) return { usInvert: US, dsInvert: DS, slope: (US - DS) / L, assumed: false };
  if (!hasUS && hasDS && hasL) return { usInvert: DS + 0.1, dsInvert: DS, slope: 0.1 / L, assumed: true };
  return { usInvert: hasUS ? US : null, dsInvert: hasDS ? DS : null, slope: parseFloat(pipe.slope), assumed: false };
}

function pipeEffectiveSlope(pipe){
  return pipeInvertState(pipe).slope;
}

function calcPipeRow(row){
  const geo = pipeGeometry(row);
  const designQ = pipeDesignQ(row);
  if(!geo) return { areaSf:null, equivDiamIn:null, Qfull:null, V:null, pass:null, designQ };
  const n = pipeEffectiveN(row), S = pipeEffectiveSlope(row);
  const {V, Qfull} = manningFullFlow(n, geo.areaSf, geo.equivDiamIn, S);
  return {
    areaSf: geo.areaSf, equivDiamIn: geo.equivDiamIn,
    Qfull, V, designQ,
    pass: Qfull >= designQ,
  };
}

// Full structure-loss + hydraulic-grade-line calc for one structure.
// Recurses toward the outfall by pulling the downstream structure's
// already-solved elevation through this structure's PRIMARY outgoing pipe
// (for a Flow Splitter, the Secondary path is a separate branch that is
// resolved independently by its own downstream chain, but does not feed
// back into this structure's own elevation).
function computeStructureCalc(structureId, seen, stormOverride){
  seen = seen || new Set();
  const st = findStructure(structureId);
  const warnings = [];
  if(!st) return null;

  const totalFlowInfo = computeTotalFlow(structureId, null, stormOverride);
  const totalFlow = totalFlowInfo.Q;
  const isSplitter = st.type === "splitter";
  const splitInfo = isSplitter ? computeSplitterSplit(st, totalFlow) : null;

  const outPipes = getOutgoingPipes(structureId);
  let outPipe = null, outPipeFlow = totalFlow;
  if(isSplitter){
    const primary = outPipes.find(p=>p.splitRole==="primary");
    const secondary = outPipes.find(p=>p.splitRole==="secondary");
    if(!primary || !secondary) warnings.push("Flow splitter needs one Primary and one Secondary outgoing pipe (set Role on the Pipe Sizing & Capacity tab).");
    if(outPipes.length>2) warnings.push("More than 2 outgoing pipes found on a flow splitter \u2014 only Primary/Secondary are used.");
    outPipe = primary || outPipes[0] || null;
    outPipeFlow = splitInfo.primaryQ;
  } else {
    if(outPipes.length>1) warnings.push("More than one outgoing pipe found \u2014 only the first is used for friction/HGL.");
    outPipe = outPipes.length? outPipes[0] : null;
  }

  const isBase = st.forceElev || !outPipe;
  if(isBase){
    return {
      structure: st, totalFlow, captured: totalFlowInfo.captured, inflow: totalFlowInfo.inflow,
      outPipe, downstream:null, Sf:0, Hf:0, kbColumn:null, kb:0, Hb:0, Vout:0,
      inflowCount:0, controlling:null, elevation: parseFloat(st.startElev)||0,
      isBase:true, warnings, isSplitter, splitInfo,
      crown: null, crownAssumed: false,
      crownPass: null,
      rimPass: st.rim!==""&&st.rim!=null ? (parseFloat(st.startElev)||0) <= parseFloat(st.rim)-1.0 : null,
    };
  }

  if(seen.has(structureId)){
    warnings.push("Circular structure reference detected \u2014 elevation cannot be resolved.");
    return { structure:st, totalFlow, captured:totalFlowInfo.captured, inflow:totalFlowInfo.inflow, outPipe, downstream:null,
      Sf:0, Hf:0, kbColumn:null, kb:0, Hb:0, Vout:0, inflowCount:0, controlling:null, elevation:NaN, isBase:false, warnings, isSplitter, splitInfo,
      crown:null, crownAssumed:false, crownPass:null, rimPass:null };
  }
  seen.add(structureId);

  const downstream = computeStructureCalc(outPipe.toStructureId, seen, stormOverride);
  const downstreamElev = downstream ? downstream.elevation : 0;

  const geo = pipeGeometry(outPipe);
  let Sf=0, Hf=0, Vout=0;
  if(geo){
    const R = (geo.equivDiamIn/12)/4;
    Sf = frictionSlope(outPipeFlow, pipeEffectiveN(outPipe), geo.areaSf, R);
    Hf = Sf*(parseFloat(outPipe.length)||0);
    Vout = geo.areaSf>0 ? totalFlow/geo.areaSf : 0;
  } else {
    warnings.push("Outgoing pipe geometry is incomplete \u2014 friction loss not computed.");
  }

  const kbColumn = KB_COLUMN_FOR_TYPE[st.type] || "bend";
  const useCatalogKah = st.structureMode === "standard" || st.structureMode === "custom";
  function kbForAngle(angleDeg) {
    return useCatalogKah
      ? kAhFromAngle(resolveStructureCategory(st), angleDeg)
      : interpKb(kbColumn, angleDeg);
  }
  const inflowPipes = getIncomingPipes(structureId);
  let kb=0, Hb=0, controlling=null;
  if(inflowPipes.length===0){
    kb = kbForAngle(0);
  } else if(inflowPipes.length===1){
    const angle = parseFloat(inflowPipes[0].angle)||0;
    kb = kbForAngle(angle);
  } else if(inflowPipes.length===2){
    const [p1,p2] = inflowPipes;
    const a1 = parseFloat(p1.angle)||0, a2 = parseFloat(p2.angle)||0;
    const Q1 = pipeDesignQ(p1, null, stormOverride), Q2 = pipeDesignQ(p2, null, stormOverride);
    const A3 = geo ? geo.areaSf : 0;
    const V1_3 = A3>0? Q1/A3:0, V2_3 = A3>0? Q2/A3:0;
    const Kb1 = kbForAngle(a1), Kb2 = kbForAngle(a2);
    const Lv1 = Kb1*V1_3*V1_3/(2*G), Lv2 = Kb2*V2_3*V2_3/(2*G);
    const vc = Lv1>Lv2 ? a2 : a1;
    kb = kbForAngle(vc);
    controlling = { p1,p2,a1,a2,Q1,Q2,V1_3,V2_3,Kb1,Kb2,Lv1,Lv2,vc };
  } else {
    warnings.push(inflowPipes.length+" inflow pipes found \u2014 the controlling-angle method only supports up to 2. Hb not computed; verify manually.");
    kb = null;
  }
  Hb = (kb==null) ? 0 : kb*Vout*Vout/(2*G);

  const elevation = downstreamElev + Hf + Hb;
  const invSt = pipeInvertState(outPipe);
  const crownAssumed = invSt.assumed;
  const crown = (geo && invSt.usInvert !== null) ? invSt.usInvert + geo.equivDiamIn/12 : null;
  const rim = (st.rim!==""&&st.rim!=null) ? parseFloat(st.rim) : null;

  return {
    structure: st, totalFlow, captured: totalFlowInfo.captured, inflow: totalFlowInfo.inflow,
    outPipe, outPipeFlow, downstream, downstreamElev, Sf, Hf, kbColumn, kb, Hb, Vout,
    inflowCount: inflowPipes.length, inflowPipes, controlling, useCatalogKah,
    elevation, isBase:false, warnings, isSplitter, splitInfo,
    crown, crownAssumed,
    crownPass: crown!==null ? elevation<=crown+1.0 : null,
    rimPass: rim!==null ? elevation<=rim-1.0 : null,
  };
}

const fmt = (v,d=2)=> (v===null||v===undefined||!isFinite(v)) ? "\u2014" : Number(v).toFixed(d);

/* =======================================================================
   Outlet Control Structure hydraulics
   Orifice/Pipe: circular opening, three regimes -
     partial  - water surface below the top of the opening: uses the EXACT
                wetted circular-segment area and head to that area's own
                centroid (not the pipe centerline).
     full     - opening fully submerged on the headwater side, tailwater
                not a factor: standard orifice equation, head to center.
     submerged- opening fully submerged on BOTH sides: differential head,
                HW - TW.
   Weir: two regimes - free (unsubmerged) and submerged (Villemonte
   correction), for rectangular or V-notch weirs.
======================================================================= */
// ====== SECTION: Outlet Rating Curves ======
function circularSegment(h, r){
  // h = water depth above invert (0..2r), r = radius (ft). Returns wetted
  // area (sf) and the head from the water surface down to that area's
  // centroid (ft) - exact, via direct integration of the circular segment.
  // Also exposes the intermediate geometry (half-angle alpha, centroid
  // height above the invert) matching the standard closed-form notation:
  //   alpha = cos^-1(1 - h/r)
  //   A = r^2(2*alpha - sin(2*alpha))/2
  //   centroid above invert = r - 4r*sin^3(alpha)/(3*(2*alpha - sin(2*alpha)))
  h = Math.max(0, Math.min(h, 2*r));
  if(h<=0 || r<=0) return {A:0, hc:0, alpha:0, centroidAboveInvert:0};
  const ys = h - r;                          // water surface height rel. to circle center
  const w = Math.sqrt(Math.max(r*r - ys*ys, 0)); // half-width of the water-surface chord
  let arg = 1 - h/r; arg = Math.max(-1, Math.min(1, arg));
  const alpha = Math.acos(arg);
  const theta = 2*alpha;
  const A = (r*r/2)*(theta - Math.sin(theta));
  if(A<=0) return {A:0, hc:0, alpha, centroidAboveInvert:0};
  const hc = ys + (2/3)*Math.pow(w,3)/A;      // head from water surface to area centroid
  const centroidAboveInvert = h - hc;
  return { A, hc: Math.max(hc,0), alpha, centroidAboveInvert };
}

function orificeOrPipeQ(device, hw, tw, twMode){
  const invert = parseFloat(device.invert);
  const diamFt = (parseFloat(device.diameter)||0)/12;
  const r = diamFt/2;
  const cd = isFinite(parseFloat(device.cd)) ? parseFloat(device.cd) : 0.6;
  if(!isFinite(invert) || r<=0) return {Q:0, regime:"n/a", head:0, area:0, alpha:null, centroidAboveInvert:null};
  if(hw<=invert) return {Q:0, regime:"dry", head:0, area:0, alpha:null, centroidAboveInvert:null};
  const h = hw-invert;
  const top = invert + 2*r;
  const twActive = (twMode!=="none") && isFinite(tw);
  if(hw < top){
    const seg = circularSegment(h, r);
    const Q = cd*seg.A*Math.sqrt(2*G*seg.hc);
    return { Q, regime:"partial", head:seg.hc, area:seg.A, h, alpha:seg.alpha, centroidAboveInvert:seg.centroidAboveInvert };
  }
  const A = Math.PI*r*r;
  let head, regime;
  if(twActive && tw>top){
    head = Math.max(hw-tw, 0); regime = "submerged";
  } else {
    head = Math.max(hw-(invert+r), 0); regime = "full";
  }
  const Q = cd*A*Math.sqrt(2*G*head);
  return { Q, regime, head, area:A, h, alpha:null, centroidAboveInvert:r };
}

function weirQ(device, hw, tw, twMode){
  const crest = parseFloat(device.crest);
  const L = parseFloat(device.length)||0;
  const c = isFinite(parseFloat(device.coef)) ? parseFloat(device.coef) : (device.weirShape==="vnotch" ? 2.5 : 3.1);
  if(!isFinite(crest)) return {Q:0, regime:"n/a", head:0};
  if(hw<=crest) return {Q:0, regime:"dry", head:0};
  const H1 = hw-crest;
  const isVnotch = device.weirShape==="vnotch";
  const n = isVnotch ? 2.5 : 1.5;
  let Qfree;
  if(isVnotch){
    const angleRad = (parseFloat(device.notchAngle)||90)*Math.PI/180;
    Qfree = c*Math.tan(angleRad/2)*Math.pow(H1,2.5);
  } else {
    Qfree = c*L*Math.pow(H1,1.5);
  }
  const twActive = (twMode!=="none") && isFinite(tw);
  if(twActive && tw>crest){
    const H2 = Math.max(tw-crest,0);
    if(H2>=H1) return { Q:0, regime:"submerged (drowned)", head:H1, H2 };
    const ratio = H2/H1;
    const factor = Math.pow(1-Math.pow(ratio,n), 0.385);
    return { Q: Qfree*factor, regime:"submerged", head:H1, H2, factor };
  }
  return { Q: Qfree, regime:"free", head:H1 };
}

function deviceQ(device, hw, tw, twMode){
  return device.type==="weir" ? weirQ(device, hw, tw, twMode) : orificeOrPipeQ(device, hw, tw, twMode);
}

function findOutletStructure(id){ return state.outletStructures.find(o=>o.id===id) || null; }
function devicesForOutlet(osId){ return state.outletDevices.filter(d=>d.outletStructureId===osId); }

function resolveTailwater(os){
  if(!os) return null;
  if(os.twMode==="fixed"){
    const v = parseFloat(os.twFixed);
    return isFinite(v) ? v : null;
  }
  if(os.twMode==="linked" && os.twStructureId){
    const st = findStructure(os.twStructureId);
    if(!st) return null;
    const c = computeStructureCalc(st.id);
    return c && isFinite(c.elevation) ? c.elevation : null;
  }
  return null;
}

const MAX_STAGE_ROWS = 2000;
function deviceFineSettings(d, os){
  const defFine = Math.max(parseFloat(os.fineIncrement)||0.01, 0.0001);
  const defBand = Math.max(parseFloat(os.fineBand)||0, 0);
  // Facility-level "precision mode" gates whether ANY per-device override is
  // honored at all: "uniform" (default) applies the facility's fine
  // increment/band to every device's critical points; "individual" lets each
  // device opt in (via its own explicit fineOverrideEnabled checkbox) to its
  // own values instead.
  if((os.precisionMode||"uniform")!=="individual" || !d.fineOverrideEnabled){
    return { fine: defFine, band: defBand, active:false };
  }
  const fine = isFinite(parseFloat(d.fineIncrementOverride)) ? Math.max(parseFloat(d.fineIncrementOverride), 0.0001) : defFine;
  const band = isFinite(parseFloat(d.fineBandOverride)) ? Math.max(parseFloat(d.fineBandOverride), 0) : defBand;
  return { fine, band, active:true };
}

function generateStageList(os){
  if(!os) return { stages:[], truncated:false };
  const start = parseFloat(os.startElev), end = parseFloat(os.endElev);
  if(!isFinite(start) || !isFinite(end) || end<=start) return { stages:[], truncated:false };
  const coarse = Math.max(parseFloat(os.coarseIncrement)||0.1, 0.001);
  const defFine = Math.max(parseFloat(os.fineIncrement)||0.01, 0.0001);
  const defBand = Math.max(parseFloat(os.fineBand)||0, 0);
  const tw = resolveTailwater(os);
  const devices = devicesForOutlet(os.id);

  // Each critical elevation carries its OWN fine increment/band, taken from
  // that device's override if set, otherwise the facility-wide default -
  // so a small orifice can get much tighter resolution than a broad weir
  // without affecting anything else in the facility.
  const critical = [];
  devices.forEach(d=>{
    const {fine, band} = deviceFineSettings(d, os);
    if(d.type==="weir"){ critical.push({elev: parseFloat(d.crest), fine, band}); }
    else {
      const inv=parseFloat(d.invert), dia=(parseFloat(d.diameter)||0)/12;
      critical.push({elev: inv, fine, band});
      critical.push({elev: inv+dia, fine, band});
    }
  });
  if(tw!=null) critical.push({elev: tw, fine: defFine, band: defBand});

  const set = new Set();
  const round6 = v=>Math.round(v*1e6)/1e6;
  for(let v=start; v<=end+1e-9; v+=coarse) set.add(round6(v));
  set.add(round6(end));
  critical.filter(c=>isFinite(c.elev) && c.band>0).forEach(c=>{
    const lo = Math.max(start, c.elev-c.band), hi = Math.min(end, c.elev+c.band);
    for(let v=lo; v<=hi+1e-9; v+=c.fine) set.add(round6(v));
  });
  let stages = Array.from(set).filter(v=>v>=start-1e-9 && v<=end+1e-9).sort((a,b)=>a-b);
  let truncated = false;
  if(stages.length>MAX_STAGE_ROWS){
    const stride = Math.ceil(stages.length/MAX_STAGE_ROWS);
    stages = stages.filter((_,i)=>i%stride===0);
    truncated = true;
  }
  return { stages, truncated };
}

function computeRatingCurve(osId){
  const os = findOutletStructure(osId);
  if(!os) return { rows:[], truncated:false, tw:null, devices:[] };
  const devices = devicesForOutlet(os.id);
  const { stages, truncated } = generateStageList(os);
  const tw = resolveTailwater(os);
  const rows = stages.map(stage=>{
    const devResults = devices.map(d=>({ device:d, ...deviceQ(d, stage, tw, os.twMode) }));
    const total = devResults.reduce((a,b)=>a+(isFinite(b.Q)?b.Q:0),0);
    return { stage, tw, devices: devResults, total };
  });
  return { rows, truncated, tw, devices };
}

/* ---------------------------------------------------------------------
   DOM helpers
--------------------------------------------------------------------- */
// ====== SECTION: DOM Utilities ======
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    // null/undefined means "don't set this attribute" - e.g. checked/disabled
    // passed as `cond ? "checked" : null`. setAttribute(name, null) would
    // otherwise stringify to the literal text "null", which - for boolean
    // attributes like checked/disabled/selected - makes the attribute COUNT
    // AS PRESENT regardless of the intended condition, e.g. a checkbox that
    // renders permanently checked no matter what cond evaluates to.
    else if(v===null || v===undefined) { /* skip */ }
    else e.setAttribute(k, v);
  }
  if(children) (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild((c instanceof Node) ? c : document.createTextNode(String(c)));
  });
  return e;
}
function mkTxtInput(focusNs, getRenderFn) {
  return function(row, field, w) {
    return el("input", {class:"cell-input txt", type:"text", style:"width:"+w+"px",
      value: row[field]||"",
      "data-focus-key": focusNs+":"+row.id+":"+field,
      oninput: (e) => { row[field]=e.target.value; withFocusPreserved(getRenderFn(row)); }});
  };
}
function mkNumInput(focusNs, getRenderFn) {
  return function(row, field, w) {
    return el("input", {class:"cell-input", type:"text", inputmode:"decimal", step:"any",
      style:"width:"+w+"px",
      value: row[field]===undefined||row[field]===null?"":row[field],
      "data-focus-key": focusNs+":"+row.id+":"+field,
      oninput: (e) => { row[field]=e.target.value; withFocusPreserved(getRenderFn(row)); }});
  };
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Full-table re-renders on every keystroke would otherwise kick focus out to
// document.body. Wrap any such render call with this so the same logical field
// (matched by its data-focus-key) gets refocused, cursor position and all.
function withFocusPreserved(renderFn){
  const active = document.activeElement;
  let restore = null;
  if(active && active.dataset && active.dataset.focusKey){
    restore = { key: active.dataset.focusKey, start: active.selectionStart, end: active.selectionEnd };
  }
  renderFn();
  if(restore){
    const els = document.querySelectorAll('[data-focus-key]');
    for(const e of els){
      if(e.dataset.focusKey === restore.key){
        e.focus();
        if(typeof e.setSelectionRange === "function" && restore.start!=null){
          try{ e.setSelectionRange(restore.start, restore.end); }catch(err){}
        }
        break;
      }
    }
  }
}

function toast(msg, isErr){

  t.classList.add("show");

  toast._h = setTimeout(()=>t.classList.remove("show"), 3800);
}

const SAVES_KEY = "sdCalc_saves";
const SAVES_MAX = 5;

// ====== SECTION: State / Persistence ======
function getSaves(){
  try {
    const raw = localStorage.getItem(SAVES_KEY);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch(e) {
    return [];
  }
}

function setSaves(saves){
  try {
    localStorage.setItem(SAVES_KEY, JSON.stringify(saves));
    return true;
  } catch(e) {
    toast("Browser storage unavailable — save not written.", true);
    return false;
  }
}

function captureState(){
  const snap = JSON.parse(JSON.stringify({
    drainage: state.drainage,
    structures: state.structures,
    pipes: state.pipes,
    kb: state.kb,
    pipeMaterials: state.pipeMaterials,
    outletStructures: state.outletStructures,
    outletDevices: state.outletDevices,
    activeOutletId: state.activeOutletId,
    outletShowGeometryDetail: state.outletShowGeometryDetail,
    inletSpacing: state.inletSpacing,
    inletSpacingSettings: state.inletSpacingSettings,
    rainfall: state.rainfall,
  }));
  return snap;
}

function restoreState(snap, projectName){
  state.drainage = snap.drainage || [];
  state.structures = snap.structures || [];
  state.pipes = snap.pipes || [];
  state.kb = snap.kb || defaultKbRows();
  state.pipeMaterials = snap.pipeMaterials || defaultPipeMaterials();
  state.outletStructures = snap.outletStructures || [];
  state.outletDevices = snap.outletDevices || [];
  state.activeOutletId = snap.activeOutletId || "";
  state.outletShowGeometryDetail = snap.outletShowGeometryDetail !== undefined ? snap.outletShowGeometryDetail : true;
  state.inletSpacing = snap.inletSpacing || [];
  state.inletSpacingSettings = snap.inletSpacingSettings || defaultInletSpacingSettings();
  state.rainfall = snap.rainfall || defaultRainfallSettings();
  const restoredName = projectName || "Untitled Storm Drain Project";
  state.project = restoredName;
  document.getElementById("projectName").value = restoredName;
  renderAll();
}

function formatSaveTimestamp(ms){
  const d = new Date(ms);
  const pad = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}

function saveComp(){
  const saves = getSaves();
  if(saves.length >= SAVES_MAX){
    toast("Save limit reached — delete a save first.", true);
    return;
  }
  const projectName = document.getElementById("projectName").value || "Untitled";
  const now = Date.now();
  const entry = {
    id: "save_"+now+"_"+Math.random().toString(36).slice(2,7),
    name: projectName + " — " + formatSaveTimestamp(now),
    projectName: projectName,
    savedAt: now,
    state: captureState(),
  };
  saves.push(entry);
  if(!setSaves(saves)) return;
  updateSavesUI();
  toast("Saved <b>"+escapeHtml(entry.name)+"</b>.");
}

function loadComp(id){
  const saves = getSaves();
  const entry = saves.find(s => s.id === id);
  if(!entry) return;
  restoreState(entry.state, entry.projectName);
  closeSavesPopover();
  toast("Loaded <b>"+escapeHtml(entry.name)+"</b>.");
}

function deleteComp(id){
  const saves = getSaves().filter(s => s.id !== id);
  if(!setSaves(saves)) return;
  updateSavesUI();
  toast("Save deleted.");
}

function renderSavesPopover(){
  const saves = getSaves();
  const list = document.getElementById("savesList");
  list.innerHTML = "";
  if(saves.length === 0){
    list.appendChild(el("div",{class:"saves-empty"},"No saves yet."));
    return;
  }
  saves.slice().reverse().forEach(entry => {
    const row = el("div",{class:"save-row"});
    row.appendChild(el("span",{class:"save-row-name", title:entry.name}, entry.name));
    const loadBtn = el("button",{class:"btn btn-sm", onclick:()=>loadComp(entry.id)}, "Load");
    const delBtn2 = el("button",{class:"btn btn-sm", style:"color:var(--fail);", title:"Delete this save", onclick:()=>deleteComp(entry.id)}, "✕");
    row.appendChild(loadBtn);
    row.appendChild(delBtn2);
    list.appendChild(row);
  });
}

function updateSavesUI(){
  const saves = getSaves();
  document.getElementById("savesCount").textContent = saves.length;
  const saveBtn = document.getElementById("saveCompBtn");
  if(saves.length >= SAVES_MAX){
    saveBtn.disabled = true;
    saveBtn.title = "Save limit reached ("+SAVES_MAX+") — delete a save first";
  } else {
    saveBtn.disabled = false;
    saveBtn.title = "Save current project to browser storage";
  }
  renderSavesPopover();
}

function closeSavesPopover(){
  document.getElementById("savesPopover").classList.remove("open");
}

function delBtn(onClick){
  return el("button",{class:"row-del", title:"Delete row", onclick:onClick}, "\u2715");
}
function detailBtn(onClick){
  return el("button",{class:"btn btn-sm btn-ghost detail-btn", onclick:onClick, title:"Preview detailed calculation"}, "\u2921 Detail");
}

        return el("td",{}, numInput(row,"slope",75));
      })(),
      el("td",{}, numInput(row,"length",70)),

  }
  function roleSelect(row){
    const fromSt = findStructure(row.fromStructureId);
    const relevant = fromSt && fromSt.type==="splitter";
    const sel = el("select",{class:"cell-input",style:"width:90px","data-focus-key":"pipes:"+row.id+":splitRole", onchange:(e)=>{ row.splitRole=e.target.value; withFocusPreserved(renderAll); }});

    if(pass===null||pass===undefined) return el("span",{class:"badge neutral"},"\u2014");
    return el("span",{class:"badge "+(pass?"pass":"fail")}, pass?"PASS":"FAIL");
  }

      const o = el("option",{value:v},l);
      if(row.type===v) o.selected=true;
      sel.appendChild(o);
    });
    return sel;
  }
  function round4(v){ return Math.round(v*10000)/10000; }
  function diameterDisplay(row){
    const inches = parseFloat(row.diameter);
    if(!isFinite(inches)) return "";
    return round4(row.diameterUnit==="ft" ? inches/12 : inches);
  }
  function setDiameterFromDisplay(row, val){
    const v = parseFloat(val);
    row.diameter = !isFinite(v) ? "" : (row.diameterUnit==="ft" ? v*12 : v);
  }
  function lengthDisplay(row){
    const feet = parseFloat(row.length);
    if(!isFinite(feet)) return "";
    return round4(row.lengthUnit==="in" ? feet*12 : feet);
  }
  function setLengthFromDisplay(row, val){
    const v = parseFloat(val);
    row.length = !isFinite(v) ? "" : (row.lengthUnit==="in" ? v/12 : v);
  }
  function geomCell(row){
    if(row.type==="weir"){
      const wrap = el("div",{style:"display:flex;gap:4px;flex-wrap:wrap;align-items:center;"});

      const shapeSel = el("select",{class:"cell-input",style:"width:75px","data-focus-key":"outlet-dev:"+row.id+":weirShape", onchange:(e)=>{ row.weirShape=e.target.value; withFocusPreserved(renderOutlet); }});
      [["rect","Rect."],["vnotch","V-notch"]].forEach(([v,l])=>{

      });
      wrap.appendChild(shapeSel);
      if(row.weirShape==="vnotch"){
        wrap.appendChild(el("input",{class:"cell-input",type:"text",inputmode:"decimal",step:"any",style:"width:50px",title:"Notch angle (deg)",
          value: row.notchAngle===undefined||row.notchAngle===null?"":row.notchAngle, placeholder:"\u00b0","data-focus-key":"outlet-dev:"+row.id+":notchAngle",
          oninput:(e)=>{ row.notchAngle=e.target.value; withFocusPreserved(renderOutlet); }}));
      }
      return wrap;
    }
    const wrap = el("div",{style:"display:flex;gap:4px;align-items:center;"});
    wrap.appendChild(el("input",{class:"cell-input",type:"text",inputmode:"decimal",step:"any",style:"width:70px",title:"Diameter",
      value: diameterDisplay(row), placeholder: (row.diameterUnit||"in")==="ft"?"D (ft)":"D (in)","data-focus-key":"outlet-dev:"+row.id+":diameter",
      oninput:(e)=>{ setDiameterFromDisplay(row, e.target.value); withFocusPreserved(renderOutlet); }}));
    const diaUnitSel = el("select",{class:"cell-input",style:"width:52px",title:"Diameter unit","data-focus-key":"outlet-dev:"+row.id+":diameterUnit", onchange:(e)=>{ row.diameterUnit=e.target.value; withFocusPreserved(renderOutlet); }});
    [["in","in"],["ft","ft"]].forEach(([v,l])=>{
      const o = el("option",{value:v},l);
      if((row.diameterUnit||"in")===v) o.selected=true;
      diaUnitSel.appendChild(o);
    });
    wrap.appendChild(diaUnitSel);
    return wrap;
  }
  function coefCell(row){
    const isWeir = row.type==="weir";
    const raw = isWeir ? row.coef : row.cd;
    return el("input",{class:"cell-input",type:"text",inputmode:"decimal",step:"any",style:"width:60px",title: isWeir?"Weir coefficient C":"Discharge coefficient Cd",
      placeholder: isWeir? (row.weirShape==="vnotch"?"Cd\u22482.5":"C\u22483.1") : "Cd\u22480.6",
      value: (raw===undefined||raw===null) ? "" : raw,"data-focus-key":"outlet-dev:"+row.id+":coef",
      oninput:(e)=>{ if(isWeir) row.coef=e.target.value; else row.cd=e.target.value; withFocusPreserved(renderOutlet); }});
  }
  function overrideCell(row, os){
    const wrap = el("div",{style:"display:flex;flex-direction:column;gap:5px;min-width:175px;"});
    const chkRow = el("label",{style:"display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);cursor:pointer;"});
    chkRow.appendChild(el("input",{type:"checkbox", style:"width:14px;height:14px;", checked: row.fineOverrideEnabled?"checked":null,"data-focus-key":"outlet-dev:"+row.id+":fineOverrideEnabled",
      onchange:(e)=>{ row.fineOverrideEnabled=e.target.checked; withFocusPreserved(renderOutlet); }}));
    chkRow.appendChild(document.createTextNode("Custom"));
    wrap.appendChild(chkRow);

    const enabled = !!row.fineOverrideEnabled;
    const fieldsRow = el("div",{style:"display:flex;gap:4px;"});

    const incAttrs = {class:"cell-input",type:"text",inputmode:"decimal",step:"any",style:"width:68px",
      title:"Fine increment (ft) for this device", placeholder:"incr (ft)",
      value: enabled ? (row.fineIncrementOverride===undefined||row.fineIncrementOverride===null?"":row.fineIncrementOverride) : fmt(parseFloat(os.fineIncrement),3),
      "data-focus-key":"outlet-dev:"+row.id+":fineIncrementOverride",
      oninput:(e)=>{ row.fineIncrementOverride=e.target.value; withFocusPreserved(renderOutlet); }};
    if(!enabled) incAttrs.disabled = "disabled";
    fieldsRow.appendChild(el("input", incAttrs));

    const bandAttrs = {class:"cell-input",type:"text",inputmode:"decimal",step:"any",min:"0",style:"width:68px",
      title:"Fine band \u00b1 (ft) for this device \u2014 0 skips refinement here entirely", placeholder:"band (ft)",
      value: enabled ? (row.fineBandOverride===undefined||row.fineBandOverride===null?"":row.fineBandOverride) : fmt(parseFloat(os.fineBand),3),
      "data-focus-key":"outlet-dev:"+row.id+":fineBandOverride",
      oninput:(e)=>{ row.fineBandOverride=e.target.value; withFocusPreserved(renderOutlet); }};
    if(!enabled) bandAttrs.disabled = "disabled";
    fieldsRow.appendChild(el("input", bandAttrs));

    wrap.appendChild(fieldsRow);
    return wrap;
  }
  function settingField(label, key){
    const wrap = el("div",{class:"field"});
    wrap.appendChild(el("label",{}, label));
    wrap.appendChild(el("input",{type:"text",inputmode:"decimal", step:"any", value:os[key]===undefined||os[key]===null?"":os[key],"data-focus-key":"outlet-setting:"+os.id+":"+key,
      oninput:(e)=>{ os[key]=e.target.value; withFocusPreserved(renderOutlet); }}));
    return wrap;
  }
}

  const parsedTc = parseFloat(customTc);
  storms.forEach(s => {
    const isPipe  = s === r.pipeStorm;
    const isInlet = s === r.inletStorm;
    const accent  = isPipe ? pipeAccent : (isInlet ? inletAccent : "");
    const i = (isFinite(parsedTc) && parsedTc > 0)
      ? lookupIntensity(parsedTc, r.rainfallSource, s, r.county, r.customNoaa || {}, r.fetchedNoaa || null)
      : null;
    customTr.appendChild(el("td", {
      class:"out computed-cell",
      style: accent ? "background:"+accent+"11;" : ""
    }, i !== null ? i.toFixed(2) : "—"));
  });
  tbody.appendChild(customTr);

  tbl.appendChild(tbody);
  tableWrap.appendChild(tbl);
  idfSec.appendChild(tableWrap);
  c.appendChild(idfSec);
}

// Fetch status kept at module level so it survives the full re-render that
// follows a successful fetch (the status span re-populates from these).
let _noaaFetchMsg = "";
let _noaaFetchOk = null;   // null = no status yet, true = success, false = failure

// Site-specific NOAA Atlas 14 lookup: geocode the address via Nominatim (or
// parse "lat, lon" directly), then pull point rainfall from the NOAA PFDS
// API and store it as a pseudo-county ("Fetched"). Purely optional and
// online-only — on failure the built-in county tables remain fully usable.
async function doNoaaFetch(r, statusEl) {
  const inputStr = (r.noaaFetchInput || "").trim();
  if (!inputStr) { statusEl.textContent = "Enter an address or lat, lon."; return; }
  statusEl.style.color = "inherit";
  statusEl.textContent = "Fetching…";
  let lat, lon, displayName;
  try {
    const coord = /^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/.exec(inputStr);
    if (coord) {
      lat = parseFloat(coord[1]); lon = parseFloat(coord[2]);
      if (Math.abs(lat) > 90 || Math.abs(lon) > 180) throw new Error("Invalid coordinates.");
      displayName = lat.toFixed(4) + ", " + lon.toFixed(4);
    } else {
      const geoResp = await fetch("https://nominatim.openstreetmap.org/search?q=" +
        encodeURIComponent(inputStr) + "&format=json&limit=1");
      if (!geoResp.ok) throw new Error("Geocoding service unavailable.");
      const geoData = await geoResp.json();
      if (!geoData.length) throw new Error("Address not found — try more detail or use lat, lon.");
      lat = parseFloat(geoData[0].lat); lon = parseFloat(geoData[0].lon);
      displayName = geoData[0].display_name.split(",").slice(0, 3).join(",").trim();
    }
    // NOAA PFDS returns Cross-Origin-Resource-Policy: same-origin which blocks
    // all cross-origin loads (fetch AND <script> tag). A proxy that strips
    // that header and adds Access-Control-Allow-Origin: * is required.
    // Deploy workers/noaa-proxy.js as a Cloudflare Worker and paste the URL below.
    const proxyBase = (r.noaaProxyUrl || "").trim();
    if (!proxyBase) throw new Error("A proxy URL is required — see the Proxy URL field above.");
    const proxyUrl = proxyBase.replace(/\/$/, "") + "?lat=" + lat + "&lon=" + lon;
    const resp = await fetch(proxyUrl);
    if (!resp.ok) throw new Error("Proxy returned HTTP " + resp.status + ".");
    const text = await resp.text();
    if (!text || text.indexOf("quantiles") === -1) throw new Error("Proxy response missing NOAA data.");
    const storms = parseNoaaResponse(text);
    r.fetchedNoaa = { lat, lon, displayName, ...storms };
    r.county = "Fetched";
    _noaaFetchMsg = "Loaded site data: " + displayName;
    _noaaFetchOk = true;
    withFocusPreserved(renderAll);
  } catch (e) {
    _noaaFetchMsg = "Fetch failed: " + e.message + " — offline? County tables still available.";
    _noaaFetchOk = false;
    statusEl.style.color = "var(--fail)";
    statusEl.textContent = _noaaFetchMsg;
  }
}

function renderDaStormColCheckboxes(r) {
  const available = availableStorms(r.rainfallSource);
  const shortLbl = {"1yr":"1-yr","2yr":"2-yr","5yr":"5-yr","10yr":"10-yr",
                    "25yr":"25-yr","50yr":"50-yr","100yr":"100-yr","500yr":"500-yr"};
  const wrap = el("div", {style:"display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:6px 0;"});
  available.forEach(s => {
    const isPipe     = s === r.pipeStorm;
    const isInlet    = s === r.inletStorm;
    const is25forced = s === "25yr" && r.pipe25Check;
    const pinned     = isPipe || isInlet || is25forced;
    const isChecked  = pinned || (r.daStormCols || ["2yr","10yr"]).includes(s);
    const tip = isPipe     ? "Always shown — pipe design storm"
              : isInlet    ? "Always shown — inlet design storm"
              : is25forced ? "Always shown — 25-yr check enabled"
              : "";
    const chkEl = el("input", {
      type: "checkbox",
      "data-focus-key": "rf:daStormCols:" + s,
      title: tip,
      disabled: pinned ? "disabled" : null,
      onchange: pinned ? null : (e) => {
        const cols = new Set(r.daStormCols || ["2yr","10yr"]);
        if (e.target.checked) cols.add(s); else cols.delete(s);
        r.daStormCols = [...cols];
        withFocusPreserved(renderAll);
      }
    });
    chkEl.checked = isChecked;
    wrap.appendChild(
      el("label", {style:"display:flex;gap:5px;align-items:center;font-size:0.85em;"
                        + (pinned ? "opacity:0.55;cursor:default;" : "cursor:pointer;")},
        [chkEl, shortLbl[s] || s])
    );
  });
  return wrap;
}

        pass===null ? "—" : pass ? "✓" : "✗ OVER"),

    el("th",{class:"computed"},"Kb"),
    el("th",{class:"computed"},"Hb\n(ft)"),
