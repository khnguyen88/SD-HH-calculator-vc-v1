  });
  return makeDetailSheet("Junction Structures — Detail", heads, rows);
}

function buildPipesDetailSheet(stormOverride){
  const storm = stormOverride || state.rainfall.pipeStorm;
  const rf = state.rainfall;
  const th = (t,c)=>el("th",c?{class:c}:{},t);
  const tdN = (v,d=2)=>el("td",{class:"out computed-cell"},fmt(v,d));
  const heads = [
    th("From"), th("To"),
    th("ΣA\n(ac)","computed"), th("ΣCA","computed"),
    th("Tc\n(min)","computed"), th("i\n(in/hr)","computed"),
    th("Q design\n(cfs)","computed"),
    th("Size\n(in)"), th("Type"), th("n"), th("So\n(%)"), th("L\n(ft)"),
    th("A\n(sf)","computed"), th("R\n(ft)","computed"),
    th("V design\n(fps)","computed"), th("V full\n(fps)","computed"),
    th("Q full\n(cfs)","computed"), th("t pipe\n(min)","computed"),
    th("Hf\n(ft)","computed"), th("Status","computed"),
  ];
  const rows = state.pipes.map(pipe=>{
    const fromSt = findStructure(pipe.fromStructureId);
    const toSt   = findStructure(pipe.toStructureId);
    const fromId = fromSt?(fromSt.structureId||fromSt.id):(pipe.fromStructureId||"—");
    const toId   = toSt  ?(toSt.structureId  ||toSt.id)  :(pipe.toStructureId  ||"—");
    const ca = computeContributingArea(pipe.fromStructureId);
    const i  = ca.controlTc>0
      ? lookupIntensity(ca.controlTc, rf.rainfallSource, storm, rf.county, rf.customNoaa||{}, rf.fetchedNoaa||null)
      : 0;
    const designQ = pipeDesignQ(pipe, null, stormOverride);
    const geo = pipeGeometry(pipe);
    const n = pipeEffectiveN(pipe), S = pipeEffectiveSlope(pipe), L = parseFloat(pipe.length);
    const front = [
      el("td",{},fromId), el("td",{},toId),
      tdN(ca.sumA,2), tdN(ca.sumCA,3),
      el("td",{class:"out computed-cell"},ca.controlTc>0?fmt(ca.controlTc,1):"—"),
      el("td",{class:"out computed-cell"},i>0?fmt(i,2):"—"),
      tdN(designQ,2),
      el("td",{},pipe.size||"—"),
      el("td",{},pipe.shape==="circular"?"Circular":"Elliptical"),
      el("td",{},isFinite(n)?fmt(n,3):"—"),
      el("td",{},isFinite(S)?fmt(S*100,3):"—"),
      el("td",{},isFinite(L)?fmt(L,0):"—"),
    ];
    if(!geo||!isFinite(n)||!isFinite(S)||S<=0){
      return front.concat([
        el("td",{},"—"),el("td",{},"—"),el("td",{},"—"),el("td",{},"—"),
        el("td",{},"—"),el("td",{},"—"),el("td",{},"—"),
        el("td",{class:"out computed-cell"},"—"),
      ]);
    }
    const {R, V:Vfull, Qfull} = manningFullFlow(n, geo.areaSf, geo.equivDiamIn, S);
    const Vdesign = geo.areaSf>0 ? designQ/geo.areaSf : 0;
    const SfD = frictionSlope(designQ, n, geo.areaSf, R);
    const HfD = SfD*(isFinite(L)?L:0);
    const tPipe = (isFinite(L)&&Vdesign>0) ? (L/Vdesign)/60 : null;
    const pass = Qfull>=designQ;
    return front.concat([
      tdN(geo.areaSf,3), tdN(R,3), tdN(Vdesign,2), tdN(Vfull,2),
      tdN(Qfull,2),
      el("td",{class:"out computed-cell"}, tPipe!=null?fmt(tPipe,2):"—"),
      tdN(HfD,3),
      el("td",{class:"out computed-cell",style:pass?"":"color:var(--fail);font-weight:700;"},
        pass?"PASS":"FAIL"),
    ]);
  });
  const title = stormOverride==="25yr"
    ? "Pipe Sizing & Capacity — 25-yr Detail"
    : "Pipe Sizing & Capacity — Detail";
  return makeDetailSheet(title, heads, rows);
}

function buildHglDetailSheet(stormOverride){
  if(!state.pipes.length) return null;
  const th = (t,c)=>el("th",c?{class:c}:{},t);
  const tdN = (v,d=2)=>el("td",{class:"out computed-cell"},fmt(v,d));
  const heads = [
    th("From"), th("To"),
    th("Q design\n(cfs)","computed"), th("Q full\n(cfs)","computed"),
    th("Size\n(in)"), th("Type"), th("n"),
    th("A\n(sf)","computed"), th("R\n(ft)","computed"),
    th("So\n(ft/ft)"),
    th("Sf design\n(ft/ft)","computed"), th("Sf full\n(ft/ft)","computed"),
    th("V design\n(fps)","computed"), th("V full\n(fps)","computed"),
    th("L\n(ft)"),
    th("Hf design\n(ft)","computed"), th("Hf full\n(ft)","computed"),
    th("Angle\n(°)"), th("Kb","computed"), th("Hb\n(ft)","computed"),
    th("D/S HGL\n(ft)","computed"), th("U/S HGL\n(ft)","computed"),
    th("Pipe Crown\n(ft)","computed"), th("Crown Chk","computed"),
    th("Rim\n(ft)"),   th("Rim Chk","computed"),
  ];
  const rows = state.pipes.map(pipe=>{
    const fromSt = findStructure(pipe.fromStructureId);
    const toSt   = findStructure(pipe.toStructureId);
    const calcFrom = computeStructureCalc(pipe.fromStructureId, null, stormOverride);
    const calcTo   = computeStructureCalc(pipe.toStructureId,   null, stormOverride);
    const geo = pipeGeometry(pipe);
    const designQ = pipeDesignQ(pipe, null, stormOverride);
    const fromId = fromSt?(fromSt.structureId||fromSt.id):(pipe.fromStructureId||"—");
    const toId   = toSt  ?(toSt.structureId  ||toSt.id)  :(pipe.toStructureId  ||"—");
    const S = pipeEffectiveSlope(pipe), n = pipeEffectiveN(pipe), L = parseFloat(pipe.length);
    const angle = parseFloat(pipe.angle)||0;
    const dsHGL = calcTo   ? calcTo.elevation   : null;
    const usHGL = calcFrom ? calcFrom.elevation  : null;
    const compCrown = calcFrom ? calcFrom.crown : null;
    const crownAssumed = calcFrom ? calcFrom.crownAssumed : false;
    const rim   = parseFloat(fromSt ? fromSt.rim   : "");
    const crownPass = (isFinite(usHGL)&&compCrown!==null) ? usHGL<=compCrown+1.0 : null;
    const rimPass   = (isFinite(usHGL)&&isFinite(rim))    ? usHGL<=rim-1.0       : null;
    const crownStyle = crownPass===false ? "color:var(--fail);font-weight:700;" : "";
    const rimStyle   = rimPass  ===false ? "color:var(--fail);font-weight:700;" : "";

    if(!geo||!isFinite(n)||!isFinite(S)||S<=0){
      return [
        el("td",{},fromId), el("td",{},toId),
        tdN(designQ,2), el("td",{},"—"),
        el("td",{},pipe.size||"—"),
        el("td",{},pipe.shape==="circular"?"Circular":"Elliptical"),
        el("td",{},isFinite(n)?fmt(n,3):"—"),
        el("td",{},"—"), el("td",{},"—"),
        el("td",{},isFinite(S)?fmt(S,4):"—"),
        el("td",{},"—"), el("td",{},"—"), el("td",{},"—"), el("td",{},"—"),
        el("td",{},isFinite(L)?fmt(L,0):"—"),
        el("td",{},"—"), el("td",{},"—"),
        el("td",{},fmt(angle,0)),
        el("td",{},"—"), el("td",{},"—"),
        tdN(dsHGL,2), tdN(usHGL,2),
        el("td",{class:"out computed-cell",style:compCrown!==null&&crownAssumed?"color:var(--warn);":""},
          compCrown!==null?fmt(compCrown,2)+(crownAssumed?" *":""):"—"),
        el("td",{class:"out computed-cell",style:crownStyle},crownPass===null?"—":crownPass?"✓":"✗"),
        el("td",{},isFinite(rim)?fmt(rim,2):"—"),
        el("td",{class:"out computed-cell",style:rimStyle},rimPass===null?"—":rimPass?"✓":"✗ FLOOD"),
      ];
    }

    const {R, V:Vfull, Qfull} = manningFullFlow(n, geo.areaSf, geo.equivDiamIn, S);
    const Vdesign = geo.areaSf>0 ? designQ/geo.areaSf : 0;
    const SfD = frictionSlope(designQ, n, geo.areaSf, R);
    const SfF = frictionSlope(Qfull,   n, geo.areaSf, R);
    const HfD = SfD*(isFinite(L)?L:0), HfF = SfF*(isFinite(L)?L:0);
    const kb = calcFrom ? calcFrom.kb  : null;
    const Hb = calcFrom ? calcFrom.Hb  : 0;

    return [
      el("td",{},fromId), el("td",{},toId),
      tdN(designQ,2), tdN(Qfull,2),
      el("td",{},pipe.size||"—"),
      el("td",{},pipe.shape==="circular"?"Circular":"Elliptical"),
      el("td",{},fmt(n,3)),
      tdN(geo.areaSf,3), tdN(R,3),
      el("td",{},isFinite(S)?fmt(S,4):"—"),
      el("td",{class:"out computed-cell"},fmt(SfD,5)),
      el("td",{class:"out computed-cell"},fmt(SfF,5)),
      tdN(Vdesign,2), tdN(Vfull,2),
      el("td",{},isFinite(L)?fmt(L,0):"—"),
      el("td",{class:"out computed-cell"},fmt(HfD,3)),
      el("td",{class:"out computed-cell"},fmt(HfF,3)),
      el("td",{},fmt(angle,0)),
      el("td",{class:"out computed-cell"},kb!=null?fmt(kb,2):"—"),
      tdN(Hb,3),
      tdN(dsHGL,2), tdN(usHGL,2),
      el("td",{class:"out computed-cell",style:compCrown!==null&&crownAssumed?"color:var(--warn);":""},
        compCrown!==null?fmt(compCrown,2)+(crownAssumed?" *":""):"—"),
      el("td",{class:"out computed-cell",style:crownStyle},crownPass===null?"—":crownPass?"✓":"✗"),
      el("td",{},isFinite(rim)?fmt(rim,2):"—"),
      el("td",{class:"out computed-cell",style:rimStyle},rimPass===null?"—":rimPass?"✓":"✗ FLOOD"),
    ];
  });
  const title = stormOverride==="25yr"
    ? "HGL — 25-yr Detail"
    : "HGL — Primary Design Storm Detail";
  return makeDetailSheet(title, heads, rows);
}

function num(v,def){ const n=parseFloat(v); return isFinite(n)?n:(def!==undefined?def:0); }
function colLetter(n){ let s=""; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function round(v,d){ if(!isFinite(v)) return 0; const p=Math.pow(10,d); return Math.round(v*p)/p; }
function setFormula(ws, addr, formula, value){
  const isStr = typeof value === "string";
  ws[addr] = { t: isStr?"s":"n", f: formula.replace(/^=/,""), v: isStr ? value : (isFinite(value)?value:0) };
}
function setCellNum(ws, addr, v){ ws[addr] = { t:"n", v: (v===""||v==null||!isFinite(v))?0:v }; }

    ["   Hf/Hb/Upstream HGL chain automatically to the outfall through the pipe network. A Flow"],
    ["   Splitter type divides its Total Flow between a Primary and Secondary outgoing pipe,"],
    ["   either capacity-limited (Primary = MIN(Total,Capacity)) or by a fixed ratio."],
    ["3. Pipe Sizing - Pick From/To structure IDs (must match Junction Structure sheet IDs) and"],
    ["   an angle. Design Q is looked up live from the From structure's Total Flow (or its"],
    ["   Primary/Secondary split share, via the Split Role column, when From is a Flow Splitter)."],
    ["4. Outlet Structures - One row per BMP/SWM/ESD facility (its own stage range & tailwater"],
    ["   config). Outlet Devices lists every Orifice/Weir/Pipe, tagged by which facility it"],
    ["   belongs to. Each facility gets its own \"Rating - <label>\" sheet with every device's flow"],
    ["   and the combined total at every stage - facilities never mix. Tailwater can link to a"],
    ["   Junction Structure's live Upstream HGL."],
    ["5. Table 4-6 Reference / 6. Kb Coefficients - supporting reference data (Kb is editable;"],
    ["   Load MoCo Preset button on the Kb Coefficients tab to load MoCo agency values)."],
    ["7. TR-55 Segments - optional TC calculation. 8. Inlet Spacing - HEC-22 grate-inlet on-grade"],
    ["   spacing with bypass carryover. Each inlet's Q = (local CA + bypass CA in) x i, where"],
    ["   carried bypass is CA (not Q) - the receiving inlet applies its own intensity. SUMP inlets"],
    ["   capture 100%. Global settings: rainfall source (NOAA Atlas 14 per county / MDSHA / MoCo),"],
    ["   storm frequency, and default allowable spread. Per-inlet: L, W, a, n, S, Sx, i override."],
    [],
    ["Note: Kb, structure-loss (Hb), and Rating sheet device flows are computed by the app"],
    ["(controlling-angle method; exact circular-segment orifice math; Villemonte weir submergence)"],
    ["and written as values you can override, while Total Flow, Design Q, Hf, split shares, and"],
    ["Upstream HGL remain live formulas that recalc as you edit inputs."],
  ];
  const wsOv = XLSX.utils.aoa_to_sheet(ov);
  wsOv["!cols"] = [{wch:100}];
  XLSX.utils.book_append_sheet(wb, wsOv, "Overview");

  // ---- Rainfall Settings ----
  const rf = state.rainfall;
  const rfAoa = [
    ["Rainfall Source",          rf.rainfallSource||"noaa"],
    ["County",                   rf.county||"Montgomery"],
    ["Pipe & HGL Design Storm",  rf.pipeStorm||"10yr"],
    ["25-yr Check",              rf.pipe25Check ? "TRUE" : "FALSE"],
    ["Inlet Design Storm",       rf.inletStorm||"2yr"],
    ["Custom NOAA 5-min (in/hr)",  (rf.customNoaa&&rf.customNoaa[5]!=null&&rf.customNoaa[5]!=="")?rf.customNoaa[5]:""],
    ["Custom NOAA 10-min (in/hr)", (rf.customNoaa&&rf.customNoaa[10]!=null&&rf.customNoaa[10]!=="")?rf.customNoaa[10]:""],
    ["Custom NOAA 15-min (in/hr)", (rf.customNoaa&&rf.customNoaa[15]!=null&&rf.customNoaa[15]!=="")?rf.customNoaa[15]:""],
    ["Custom NOAA 30-min (in/hr)", (rf.customNoaa&&rf.customNoaa[30]!=null&&rf.customNoaa[30]!=="")?rf.customNoaa[30]:""],
    ["Custom NOAA 60-min (in/hr)", (rf.customNoaa&&rf.customNoaa[60]!=null&&rf.customNoaa[60]!=="")?rf.customNoaa[60]:""],
  ];
  if (rf.fetchedNoaa) {
    const fn = rf.fetchedNoaa;
    rfAoa.push(
      ["Fetched NOAA Lat",  fn.lat],
      ["Fetched NOAA Lon",  fn.lon],
      ["Fetched NOAA Name", fn.displayName || ""]
    );
    const stormLabels = {"1yr":"1-yr","2yr":"2-yr","5yr":"5-yr","10yr":"10-yr","25yr":"25-yr",
                         "50yr":"50-yr","100yr":"100-yr","500yr":"500-yr"};
    for (const storm of ["1yr","2yr","5yr","10yr","25yr","50yr","100yr","500yr"]) {
      for (const d of [5,10,15,30,60]) {
        rfAoa.push(["Fetched " + stormLabels[storm] + " " + d + "-min (in/hr)",
                    (fn[storm] && fn[storm][d] != null) ? fn[storm][d] : ""]);
      }
    }
  }
  const wsRf = XLSX.utils.aoa_to_sheet(rfAoa);
  wsRf["!cols"] = [{wch:30},{wch:20}];
  XLSX.utils.book_append_sheet(wb, wsRf, "Rainfall Settings");

  // ---- Drainage Area ----
  const rfSrc    = state.rainfall.rainfallSource;
  const daStorms = availableStorms(rfSrc);
  const daQHdrs  = daStorms.map(s => "Q_" + s + " (cfs)");
  const daHeader = ["ID","Description","Area A (ac)","C","CA","i Override (in/hr)","Tc (min)","Cf","Tc Method","Structure", ...daQHdrs];
  const daRows   = [daHeader];
  state.drainage.forEach(r => {
    const calc = calcDrainageRow(r);
    const qVals = daStorms.map(s => round(calc.Qs[s] || 0, 3));
    daRows.push([
      r.structureId||r.id, r.desc||"",
      num(r.area), num(r.C),
      round(calc.CA, 3),
      (r.iOverride !== "" && r.iOverride != null) ? num(r.iOverride) : "",
      num(r.tc), num(r.cf, 1),
      r.tcMethod||"direct",
      (()=>{
        const linked = state.structures.find(s => s.drainageAreaId === r.id);
        return linked ? (linked.structureId || "") : "";
      })(),
      ...qVals
    ]);
  });
  const wsDa = XLSX.utils.aoa_to_sheet(daRows);
  wsDa["!cols"] = [{wch:12},{wch:26},{wch:11},{wch:8},{wch:8},{wch:14},{wch:9},{wch:7},{wch:11},{wch:12},
    ...daStorms.map(()=>({wch:10}))];
  XLSX.utils.book_append_sheet(wb, wsDa, "Drainage Area");

  // ---- TR-55 Segments (variable-length list per Drainage Area, so it gets
  // its own flat sheet tagged by Drainage Area, same pattern as Outlet
  // Devices being tagged by Outlet Structure) ----
  const tr55Header = ["Drainage Area","Order","Type","n","L (ft)","s (ft/ft)","P2 (in)","Surface","Area a (sf)","Wetted Perimeter Pw (ft)"];
  const tr55Rows = [tr55Header];
  state.drainage.forEach(r=>{
    const segs = (r.tr55 && r.tr55.segments) || [];
    segs.forEach((seg,i)=>{
      tr55Rows.push([r.structureId||r.id, i+1, seg.type,
        (seg.type==="sheet"||seg.type==="channel") ? (seg.n===""||seg.n==null?"":num(seg.n)) : "",
        seg.L===""||seg.L==null?"":num(seg.L),
        seg.s===""||seg.s==null?"":num(seg.s),
        seg.type==="sheet" ? (seg.P2===""||seg.P2==null?"":num(seg.P2)) : "",
        seg.type==="shallow" ? (seg.surface||"unpaved") : "",
        seg.type==="channel" ? (seg.area===""||seg.area==null?"":num(seg.area)) : "",
        seg.type==="channel" ? (seg.wp===""||seg.wp==null?"":num(seg.wp)) : "",
      ]);
    });
  });
  const wsTr55 = XLSX.utils.aoa_to_sheet(tr55Rows);
  wsTr55["!cols"] = [{wch:14},{wch:8},{wch:10},{wch:9},{wch:9},{wch:11},{wch:9},{wch:14},{wch:11},{wch:15}];
  XLSX.utils.book_append_sheet(wb, wsTr55, "TR-55 Segments");

  // ---- Pipe Sizing (build first so Structure sheet formulas can reference it; sheet order doesn't matter for formulas though) ----
  const pipeHeader = ["ID","From Structure","To Structure","Angle (deg)","Shape","Size (in or SPANxRISE)","n","US Invert (ft)","DS Invert (ft)","Slope (ft-ft)","Length (ft)","Design Q (cfs)","Area (sf)","Qfull (cfs)","Velocity (fps)","Status","Split Role","From|Role Key"];
  const pipeAoa = [pipeHeader];
  state.pipes.forEach(p=>{
    const fromLabel = (findStructure(p.fromStructureId)||{}).structureId || p.fromStructureId || "";
    const toLabel = (findStructure(p.toStructureId)||{}).structureId || p.toStructureId || "";
    pipeAoa.push([p.id, fromLabel, toLabel, num(p.angle,0), p.shape, p.size||"", num(pipeEffectiveN(p),3),
        (p.upstreamInvert===""||p.upstreamInvert==null)?"":parseFloat(p.upstreamInvert),
        (p.downstreamInvert===""||p.downstreamInvert==null)?"":parseFloat(p.downstreamInvert),
        num(p.slope,4), num(p.length), null, null, null, null, null, p.splitRole||"", null]);
  });
  const wsPipe = XLSX.utils.aoa_to_sheet(pipeAoa);

  // ---- Junction Structure ----
  const stHeader = ["Structure ID","Description","Drainage Area ID","Type","Force Fixed","Fixed-Start Elev (ft)","Pipe Crown (ft)","Rim-Grate Elev (ft)",
    "Captured Q (cfs)","Q from Pipes (cfs)","Total Flow (cfs)","Outgoing Pipe ID","Hf (ft)","Kb","Hb (ft)","Vout (fps)","Upstream HGL (ft)","Downstream Structure ID","Crown Check","Rim Check",
    "Split Method","Split Capacity (cfs)","Split Ratio (0-1)",
    "Structure Mode","Agency","Catalog ID","Category","Shape","Inner Dia (ft)","Inner W (ft)","Inner L (ft)"];
  const stAoa = [stHeader];
  state.structures.forEach(s=>{
    const daLabel = s.drainageAreaId ? ((findDrainage(s.drainageAreaId)||{}).structureId || s.drainageAreaId) : "";
    const calcForCrown = computeStructureCalc(s.id);
    stAoa.push([s.structureId||s.id, s.desc||"", daLabel, s.type, s.forceElev?"TRUE":"FALSE", (s.startElev===""||s.startElev==null)?"":num(s.startElev),
      (calcForCrown&&calcForCrown.crown!==null)?num(calcForCrown.crown):"", (s.rim===""||s.rim==null)?"":num(s.rim),
      null,null,null,null,null,null,null,null,null,null,null,null,
      s.type==="splitter"?(s.splitMethod||"capacity"):"", s.type==="splitter"?num(s.splitCapacity):"", s.type==="splitter"?num(s.splitRatio,0.5):"",
      s.structureMode||"", s.agency||"", s.standardStructureId||"", s.structureCategory||"", s.shape||"",
      (s.innerDiameter===""||s.innerDiameter==null)?"":num(s.innerDiameter),
      (s.innerWidth===""||s.innerWidth==null)?"":num(s.innerWidth),
      (s.innerLength===""||s.innerLength==null)?"":num(s.innerLength)]);
  });
  const wsSt = XLSX.utils.aoa_to_sheet(stAoa);

  // Now fill live formulas. Column letters:
  // Drainage Area: A id B desc C area D C E CA F iOverride G tc H cf I tcMethod J+ Q per storm (static values)
  // Pipe Sizing:   A id B from C to D angle E shape F size G n H usInv I dsInv J slope K len L designQ M area N qfull O vel P status Q splitRole R from|role key
  // Structure:     A id B desc C daId D type E force F startElev G pipeCrown(computed) H rim
  //                I capturedQ J qFromPipes K totalFlow L outPipeId M Hf N Kb O Hb P Vout Q upstreamHGL R downstreamId S crownChk T rimChk
  //                U splitMethod V splitCapacity W splitRatio
  //                X structureMode Y agency Z catalogId AA category AB shape AC innerDia AD innerW AE innerL

  // Helper-key lookups (built once per pipe row, reused by both sheets):
  // P{row} = From label & "|" & role (blank role defaults to "primary" so ordinary
  // single-outlet pipes are found the same way a splitter's Primary pipe is).
  state.pipes.forEach((p,i)=>{
    const row=i+2;
    const fromLabel = (findStructure(p.fromStructureId)||{}).structureId || p.fromStructureId || "";
    const roleForKey = p.splitRole || "primary";
    setFormula(wsPipe, "R"+row, "=B"+row+"&\"|\"&IF(Q"+row+"=\"\",\"primary\",Q"+row+")", fromLabel+"|"+roleForKey);
  });

  function xlFromType(fromLabelExpr){ return "IFERROR(INDEX('Junction Structure'!D:D,MATCH("+fromLabelExpr+",'Junction Structure'!A:A,0)),\"\")"; }
  function xlFromTotal(fromLabelExpr){ return "IFERROR(INDEX('Junction Structure'!K:K,MATCH("+fromLabelExpr+",'Junction Structure'!A:A,0)),0)"; }
  function xlFromMethod(fromLabelExpr){ return "IFERROR(INDEX('Junction Structure'!U:U,MATCH("+fromLabelExpr+",'Junction Structure'!A:A,0)),\"capacity\")"; }
  function xlFromCap(fromLabelExpr){ return "IFERROR(INDEX('Junction Structure'!V:V,MATCH("+fromLabelExpr+",'Junction Structure'!A:A,0)),0)"; }
  function xlFromRatio(fromLabelExpr){ return "IFERROR(INDEX('Junction Structure'!W:W,MATCH("+fromLabelExpr+",'Junction Structure'!A:A,0)),0.5)"; }

  state.structures.forEach((s,i)=>{
    const row = i+2;
    const calc = computeStructureCalc(s.id);
    // Captured Q
    setFormula(wsSt, "I"+row, "=IF(C"+row+"=\"\",0,IFERROR(INDEX('Drainage Area'!H:H,MATCH(C"+row+",'Drainage Area'!A:A,0)),0))", round(calc.captured,4));
    // Q from pipes
    setFormula(wsSt, "J"+row, "=SUMIF('Pipe Sizing'!C:C,A"+row+",'Pipe Sizing'!L:L)", round(calc.totalFlow-calc.captured,4));
    // Total flow
    setFormula(wsSt, "K"+row, "=I"+row+"+J"+row, round(calc.totalFlow,4));
    // Outgoing (Primary, or sole) pipe id -- via the From|Role helper key so a
    // splitter's Primary pipe is found reliably regardless of row order.
    setFormula(wsSt, "L"+row, "=IFERROR(INDEX('Pipe Sizing'!A:A,MATCH(A"+row+"&\"|primary\",'Pipe Sizing'!R:R,0)),\"\")", calc.outPipe? calc.outPipe.id : "");
    if(calc.isBase){
      setFormula(wsSt, "M"+row, "=0", 0);
      setFormula(wsSt, "O"+row, "=0", 0);
      setFormula(wsSt, "P"+row, "=0", 0);
      wsSt["N"+row] = { t:"n", v: 0 };
      setFormula(wsSt, "Q"+row, "=F"+row, round(calc.elevation,3));
      setFormula(wsSt, "R"+row, "=\"\"", "");
    } else {
      // Area & equivalent diameter of the outgoing (Primary) pipe, via INDEX/MATCH
      const areaLookup = "IFERROR(INDEX('Pipe Sizing'!M:M,MATCH(L"+row+",'Pipe Sizing'!A:A,0)),0)";
      const nLookup = "IFERROR(INDEX('Pipe Sizing'!G:G,MATCH(L"+row+",'Pipe Sizing'!A:A,0)),0.013)";
      const lenLookup = "IFERROR(INDEX('Pipe Sizing'!K:K,MATCH(L"+row+",'Pipe Sizing'!A:A,0)),0)";
      const outFlowLookup = "IFERROR(INDEX('Pipe Sizing'!L:L,MATCH(L"+row+",'Pipe Sizing'!A:A,0)),0)"; // this pipe's own carried Q (handles splitter Primary share)
      // R (ft) for a circle of the same area = sqrt(area/pi)/2 (equals D/4 for a true circular
      // pipe, and matches our elliptical-pipe approximation since its "area" column already
      // holds the Table 4-6 circular-equivalent area).
      const Rexpr = "((("+areaLookup+")/PI())^0.5)/2";
      setFormula(wsSt, "M"+row, "=IF("+areaLookup+"=0,0,((("+outFlowLookup+")*"+nLookup+")/(1.486*("+areaLookup+")*(("+Rexpr+")^(2/3))))^2*"+lenLookup+"", round(calc.Hf,4));
      wsSt["N"+row] = { t:"n", v: round(calc.kb==null?0:calc.kb,3) }; // Kb - editable override
      setFormula(wsSt, "P"+row, "=IF("+areaLookup+"=0,0,K"+row+"/("+areaLookup+"))", round(calc.Vout,3));
      setFormula(wsSt, "O"+row, "=N"+row+"*P"+row+"^2/(2*32.2)", round(calc.Hb,4));
      setFormula(wsSt, "R"+row, "=IFERROR(INDEX('Pipe Sizing'!C:C,MATCH(L"+row+",'Pipe Sizing'!A:A,0)),\"\")", (findStructure(calc.outPipe.toStructureId)||{}).structureId || "");
      setFormula(wsSt, "Q"+row, "=IF(OR(E"+row+"=\"TRUE\",R"+row+"=\"\"),F"+row+",IFERROR(INDEX(Q:Q,MATCH(R"+row+",A:A,0)),F"+row+")+M"+row+"+O"+row+")", round(calc.elevation,3));
    }
    setFormula(wsSt, "S"+row, "=IF(G"+row+"=\"\",\"\",IF(Q"+row+"<=G"+row+"+1,\"OK\",\"EXCEEDS\"))", calc.crownPass===null?"":(calc.crownPass?"OK":"EXCEEDS"));
    setFormula(wsSt, "T"+row, "=IF(H"+row+"=\"\",\"\",IF(Q"+row+"<=H"+row+"-1,\"OK\",\"EXCEEDS\"))", calc.rimPass===null?"":(calc.rimPass?"OK":"EXCEEDS"));
  });
  wsSt["!cols"] = Array(31).fill({wch:13});
  XLSX.utils.book_append_sheet(wb, wsSt, "Junction Structure");

  // Fill Pipe Sizing live formulas now that Structure sheet exists
  state.pipes.forEach((p,i)=>{
    const row = i+2;
    const geo = pipeGeometry(p);
    const calc = calcPipeRow(p);
    const primaryExpr = "IF("+xlFromMethod("B"+row)+"=\"ratio\","+xlFromTotal("B"+row)+"*"+xlFromRatio("B"+row)+",MIN("+xlFromTotal("B"+row)+","+xlFromCap("B"+row)+"))";
    const designQFormula = "IF(B"+row+"=\"\",0,IF("+xlFromType("B"+row)+"=\"splitter\",IF(Q"+row+"=\"primary\","+primaryExpr+",IF(Q"+row+"=\"secondary\","+xlFromTotal("B"+row)+"-("+primaryExpr+"),0)),"+xlFromTotal("B"+row)+"))";
    setFormula(wsPipe, "L"+row, designQFormula, round(calc.designQ,4));
    if(p.shape==="circular"){
      setFormula(wsPipe, "M"+row, "=PI()/4*(F"+row+"/12)^2", geo?round(geo.areaSf,5):0);
      setFormula(wsPipe, "O"+row, "=(1.486/G"+row+")*M"+row+"*((F"+row+"/12/4)^(2/3))*SQRT(J"+row+")", calc.V!=null?round(calc.V,3):0);
    } else {
      setCellNum(wsPipe, "M"+row, geo?round(geo.areaSf,5):0);
      const equivD = geo?geo.equivDiamIn:0;
      setFormula(wsPipe, "O"+row, "=(1.486/G"+row+")*M"+row+"*((" + equivD + "/12/4)^(2/3))*SQRT(J"+row+")", calc.V!=null?round(calc.V,3):0);
    }
    setFormula(wsPipe, "N"+row, "=O"+row+"*M"+row, calc.Qfull!=null?round(calc.Qfull,3):0);
    setFormula(wsPipe, "P"+row, "=IF(N"+row+">=L"+row+",\"PASS\",\"FAIL\")", calc.pass?"PASS":(calc.pass===false?"FAIL":""));
  });
  wsPipe["!cols"] = [{wch:10},{wch:12},{wch:12},{wch:10},{wch:10},{wch:20},{wch:8},{wch:10},{wch:10},{wch:12},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:9},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsPipe, "Pipe Sizing");

  // ---- Outlet Structures (facility list: id/label/desc + each one's stage range & tailwater config) ----
  const osHeader = ["Outlet Structure ID","Label","Description","Precision Mode","Start Elevation (ft)","End Elevation (ft)","Coarse Increment (ft)","Fine Increment (ft)","Fine Band +/- (ft)","Tailwater Mode","Tailwater Fixed Elevation (ft)","Tailwater Linked Structure ID"];
  const osAoa = [osHeader];
  state.outletStructures.forEach(os=>{
    osAoa.push([os.label||os.id, os.label||"", os.desc||"", os.precisionMode||"uniform", num(os.startElev), num(os.endElev), num(os.coarseIncrement,0.5), num(os.fineIncrement,0.05), num(os.fineBand,0.3),
      os.twMode||"none", os.twFixed===""||os.twFixed==null?"":num(os.twFixed),
      os.twStructureId ? ((findStructure(os.twStructureId)||{}).structureId||"") : ""]);
  });
  const wsOs = XLSX.utils.aoa_to_sheet(osAoa);
  wsOs["!cols"] = [{wch:20},{wch:20},{wch:26},{wch:13},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsOs, "Outlet Structures");

  // ---- Outlet Devices (all facilities, flat table with a grouping column) ----
  const devHeader = ["Device ID","Outlet Structure","Label","Type","Invert (ft)","Crest (ft)","Diameter (in)","Diameter Unit","Length (ft)","Length Unit","Weir Shape","Notch Angle (deg)","Coefficient","Fine Override Enabled","Fine Increment Override (ft)","Fine Band Override (ft)","Notes"];
  const devAoa = [devHeader];
  state.outletDevices.forEach(d=>{
    const osLabel = ((findOutletStructure(d.outletStructureId)||{}).label) || "";
    devAoa.push([d.id, osLabel, d.label||"", d.type,
      d.type!=="weir" ? num(d.invert) : "",
      d.type==="weir" ? num(d.crest) : "",
      d.type!=="weir" ? num(d.diameter) : "",
      d.type!=="weir" ? (d.diameterUnit||"in") : "",
      d.type==="weir" ? num(d.length) : "",
      d.type==="weir" ? (d.lengthUnit||"ft") : "",
      d.type==="weir" ? (d.weirShape||"rect") : "",
      (d.type==="weir" && d.weirShape==="vnotch") ? num(d.notchAngle,90) : "",
      d.type==="weir" ? num(d.coef) : num(d.cd),
      d.fineOverrideEnabled ? "TRUE" : "FALSE",
      (d.fineIncrementOverride===""||d.fineIncrementOverride==null)?"":num(d.fineIncrementOverride),
      (d.fineBandOverride===""||d.fineBandOverride==null)?"":num(d.fineBandOverride),
      d.notes||""]);
  });
  const wsDev = XLSX.utils.aoa_to_sheet(devAoa);
  wsDev["!cols"] = [{wch:10},{wch:20},{wch:18},{wch:10},{wch:10},{wch:10},{wch:12},{wch:9},{wch:10},{wch:9},{wch:10},{wch:12},{wch:11},{wch:13},{wch:14},{wch:14},{wch:26}];
  XLSX.utils.book_append_sheet(wb, wsDev, "Outlet Devices");

  // ---- One Rating Curve sheet per outlet structure ----
  const usedSheetNames = new Set(wb.SheetNames);
  function safeSheetName(base){
    let name = String(base).replace(/[\\\/\?\*\[\]:]/g,"").trim().slice(0,26) || "Outlet";
    let candidate = "Rating - "+name;
    if(candidate.length>31) candidate = candidate.slice(0,31);
    let n=2;
    while(usedSheetNames.has(candidate)){
      const suffix = "~"+n;
      candidate = ("Rating - "+name).slice(0, 31-suffix.length)+suffix;
      n++;
    }
    usedSheetNames.add(candidate);
    return candidate;
  }

  state.outletStructures.forEach(os=>{
    const devices = devicesForOutlet(os.id);
    const ratingHeader = ["Stage (ft)","Tailwater (ft)"];
    devices.forEach(d=>{
      const label = d.label||d.id;
      ratingHeader.push(label+" alpha (deg)");
      ratingHeader.push(label+" A (sf)");
      ratingHeader.push(label+" Centroid abv invert (ft)");
      ratingHeader.push(label+" Head to centroid (ft)");
      ratingHeader.push(label+" Regime");
      ratingHeader.push(label+" Q (cfs)");
    });
    ratingHeader.push("Total Q (cfs)");
    const { rows: curveRows } = computeRatingCurve(os.id);
    const twLinked = os.twMode==="linked" && os.twStructureId;
    const twStructLabel = twLinked ? ((findStructure(os.twStructureId)||{}).structureId||"") : "";
    const ratingAoa = [ratingHeader];
    curveRows.forEach(r=>{
      const row = [num(r.stage), null];
      r.devices.forEach(dr=>{
        row.push(dr.alpha!=null ? round(dr.alpha*180/Math.PI,3) : "");
        row.push(dr.area!=null ? round(dr.area,4) : "");
        row.push(dr.centroidAboveInvert!=null ? round(dr.centroidAboveInvert,4) : "");
        row.push(dr.head!=null ? round(dr.head,4) : "");
        row.push(dr.regime||"");
        row.push(round(dr.Q,4));
      });
      row.push(null);
      ratingAoa.push(row);
    });
    const wsRating = XLSX.utils.aoa_to_sheet(ratingAoa);
    const nDev = devices.length;
    curveRows.forEach((r,i)=>{
      const row = i+2;
      if(os.twMode==="fixed"){
        setFormula(wsRating, "B"+row, "="+num(os.twFixed), r.tw!=null?round(r.tw,3):0);
      } else if(twLinked){
        setFormula(wsRating, "B"+row, "=IFERROR(INDEX('Junction Structure'!Q:Q,MATCH(\""+twStructLabel+"\",'Junction Structure'!A:A,0)),\"\")", r.tw!=null?round(r.tw,3):"");
      } else {
        wsRating["B"+row] = { t:"s", v:"" };
      }
      // Q is the 6th column within each device's 6-column block (0-indexed offset 5).
      const qCols = [];
      for(let d=0; d<nDev; d++){ qCols.push(colLetter(3+d*6+5)+row); }
      const totalCol = colLetter(3+nDev*6);
      setFormula(wsRating, totalCol+row, "="+qCols.join("+"), round(r.total,4));
    });
    // Column widths + hide state: alpha/A/centroid/head start hidden if you
    // currently have "Show full geometry detail" unchecked in the app (matches
    // what you're looking at when you export), otherwise visible. Either way,
    // Excel's own Format > Hide & Unhide Columns reveals them any time you need
    // them - a plain "hidden" column is universally supported, unlike Excel's
    // outline/grouping XML which some strict readers reject.
    const detailHidden = !state.outletShowGeometryDetail;
    const cols = [{wch:11},{wch:11}];
    devices.forEach(()=>{
      cols.push({wch:10, hidden:detailHidden});
      cols.push({wch:10, hidden:detailHidden});
      cols.push({wch:15, hidden:detailHidden});
      cols.push({wch:13, hidden:detailHidden});
      cols.push({wch:12});
      cols.push({wch:10});
    });
    cols.push({wch:12});
    wsRating["!cols"] = cols;
    XLSX.utils.book_append_sheet(wb, wsRating, safeSheetName(os.label||os.id));
  });

  // ---- Table 4-6 ----
  const t46 = [["Circular Diameter (in)","Circular Area (sf)","Elliptical Span x Rise (in)","Elliptical Area (sf)"]];
  TABLE46.forEach(row=> t46.push([row.cdia, row.carea, row.espan? (row.espan+"x"+row.erise) : "", row.espan? row.earea : ""]));
  const wsT46 = XLSX.utils.aoa_to_sheet(t46);
  wsT46["!cols"] = [{wch:18},{wch:16},{wch:22},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsT46, "Table 4-6 Reference");

  // ---- Kb ----
  const kbRows = [["Angle (deg)","Kb - Inlet","Kb - Manhole","Kb - Bend"]];
  state.kb.forEach(r=>kbRows.push([num(r.angle,0), num(r.inlet,3), num(r.manhole,3), num(r.bend,3)]));
  const wsKb = XLSX.utils.aoa_to_sheet(kbRows);
  wsKb["!cols"] = [{wch:12},{wch:12},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsKb, "Kb Coefficients");

  // ---- Inlet Spacing ----
  const is = state.inletSpacingSettings;
  const isChain = computeInletChain(state.inletSpacing, is);
  const isAoa = [
    ["Street", is.street||""],
    ["Default Allowable Spread (ft)", is.allowableSpread!=null?is.allowableSpread:""],
    [],
    ["Linked Structure","Label","L (ft)","Area (ac)","C","Tc (min)","i Override (in/hr)",
     "S","Sx","W (ft)","a (ft)","n","Allowable Spread (ft)","Bypass To",
     "Q (cfs)","Spread T (ft)","Pickup (%)","Bypass CA out"],
  ];
  state.inletSpacing.forEach(r=>{
    const cc = isChain.results[r.id]||{};
    isAoa.push([
      (()=>{
        if (!r.linkedStructureId) return "";
        const st = state.structures.find(s => s.id === r.linkedStructureId);
        return st ? (st.structureId || "") : "";
      })(),
      r.label||"",
      r.L!==""&&r.L!=null?num(r.L):r.L,
      r.area!==""&&r.area!=null?num(r.area):r.area,
      r.C!==""&&r.C!=null?num(r.C):r.C,
      r.tc!==""&&r.tc!=null?num(r.tc):r.tc,
      r.iOverride!==""&&r.iOverride!=null?num(r.iOverride):"",
      r.S||"", r.Sx!==""&&r.Sx!=null?num(r.Sx):r.Sx,
      r.W!==""&&r.W!=null?num(r.W):r.W,
      r.a!==""&&r.a!=null?num(r.a):r.a,
      r.n!==""&&r.n!=null?num(r.n):r.n,
      r.allowableSpread!==""&&r.allowableSpread!=null?r.allowableSpread:"",
      r.bypassTo||"",
      cc.Q!=null?round(cc.Q,4):"",
      cc.isSump?"SUMP":(cc.T!=null&&isFinite(cc.T)?round(cc.T,3):""),
      cc.pickupPct!=null?round(cc.pickupPct,2):"",
      cc.bypassCA!=null?round(cc.bypassCA,6):"",
    ]);
  });
  const wsIs = XLSX.utils.aoa_to_sheet(isAoa);
  wsIs["!cols"] = [{wch:14},{wch:14},{wch:8},{wch:10},{wch:7},{wch:9},{wch:16},
                   {wch:9},{wch:8},{wch:8},{wch:8},{wch:7},{wch:16},{wch:12},
                   {wch:10},{wch:12},{wch:11},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsIs, "Inlet Spacing");

  return wb;
}

function exportExcel(){
  try{
    const wb = buildWorkbook();
    const name = (state.project||"storm-drain-project").replace(/[^a-z0-9\-_ ]/gi,"").trim().replace(/\s+/g,"-") || "storm-drain-project";
    XLSX.writeFile(wb, name + ".xlsx", { bookSST: true });
    toast("Exported <b>"+escapeHtml(name)+".xlsx</b>");
  }catch(err){
    console.error(err);
    toast("Export failed: "+escapeHtml(err.message), true);
  }
}

// ====== SECTION: Excel Import ======
function sheetToRows(wb, name){
  const ws = wb.Sheets[name];
  if(!ws) return null;
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
  if(aoa.length<1) return [];
  const header = aoa[0].map(h=>String(h).trim());
  return aoa.slice(1).filter(r=>r.some(v=>v!==""&&v!=null)).map(r=>{
    const obj = {};
    header.forEach((h,i)=> obj[h]=r[i]);
    return obj;
  });
}

function importExcel(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array", cellFormula:false});

      // ---- Rainfall Settings ----
      const rfWs = wb.Sheets["Rainfall Settings"];
      if (rfWs) {
        const rfAoaRaw = XLSX.utils.sheet_to_json(rfWs, {header:1, raw:false, defval:""});
        const rfMap = {};
        rfAoaRaw.forEach(r => { if (r[0]) rfMap[String(r[0]).trim()] = r[1]; });
        const newRf = defaultRainfallSettings();
        if (rfMap["Rainfall Source"])         newRf.rainfallSource = rfMap["Rainfall Source"];
        if (rfMap["County"])                  newRf.county         = rfMap["County"];
        if (rfMap["Pipe & HGL Design Storm"]) newRf.pipeStorm      = rfMap["Pipe & HGL Design Storm"];
        if (rfMap["25-yr Check"])             newRf.pipe25Check    = rfMap["25-yr Check"] === "TRUE";
        if (rfMap["Inlet Design Storm"])      newRf.inletStorm     = rfMap["Inlet Design Storm"];
        [5,10,15,30,60].forEach(d => {
          const v = rfMap["Custom NOAA "+d+"-min (in/hr)"];
          if (v !== "" && v != null) newRf.customNoaa[d] = String(v);
        });
        const fLat = parseFloat(rfMap["Fetched NOAA Lat"]);
        const fLon = parseFloat(rfMap["Fetched NOAA Lon"]);
        if (isFinite(fLat) && isFinite(fLon)) {
          const fData = { lat: fLat, lon: fLon, displayName: rfMap["Fetched NOAA Name"] || "" };
          const stormLabels = {"1yr":"1-yr","2yr":"2-yr","5yr":"5-yr","10yr":"10-yr","25yr":"25-yr",
                               "50yr":"50-yr","100yr":"100-yr","500yr":"500-yr"};
          for (const s of ["1yr","2yr","5yr","10yr","25yr","50yr","100yr","500yr"]) {
            fData[s] = {};
            for (const d of [5,10,15,30,60]) {
              const v = parseFloat(rfMap["Fetched " + stormLabels[s] + " " + d + "-min (in/hr)"]);
              fData[s][d] = isFinite(v) ? v : "";
            }
          }
          newRf.fetchedNoaa = fData;
        }
        // Old file with county "Fetched" but no fetched data rows — fall back
        // to a real county so lookupIntensity doesn't return zeros.
        if (newRf.county === "Fetched" && !newRf.fetchedNoaa) newRf.county = "Montgomery";
        state.rainfall = newRf;
      }

      const da = sheetToRows(wb, "Drainage Area");
      const daIdMap = {}; // label -> new internal id
      if(da){
        state.drainage = da.map(r=>{
          const id = nextId();
          const label = r["ID"]||"";
          if(label) daIdMap[label]=id;
          return {
            id, structureId: label, desc:r["Description"]||"", area:r["Area A (ac)"]||"", C:r["C"]||"",
            iOverride: (()=>{
              const override = r["i Override (in/hr)"];
              if (override !== "" && override != null && isFinite(Number(override))) return String(override);
              // Migration: old exports had 'i (in/hr)' — treat as iOverride
              const oldI = r["i (in/hr)"];
              if (oldI !== "" && oldI != null && isFinite(Number(oldI))) return String(oldI);
              return "";
            })(),
            tc:r["Tc (min)"]||"", cf: r["Cf"]===""||r["Cf"]==null?1:r["Cf"],
            tcMethod: r["Tc Method"]==="tr55" ? "tr55" : "direct",
            tr55: { segments: [] },
          };
        });
      }

      const tr55Rows = sheetToRows(wb, "TR-55 Segments");
      if(tr55Rows){
        // Rows are already in worksheet order; group by Drainage Area label, which
        // preserves segment order without needing to sort on the "Order" column.
        tr55Rows.forEach(r=>{
          const daLabel = r["Drainage Area"]||"";
          const targetId = daIdMap[daLabel];
          if(!targetId) return;
          const row = state.drainage.find(d=>d.id===targetId);
          if(!row) return;
          const type = r["Type"]||"sheet";
          const seg = { id: nextId(), type };
          if(type==="sheet"){
            seg.n = r["n"]===""||r["n"]==null?"":r["n"];
            seg.L = r["L (ft)"]===""||r["L (ft)"]==null?"":r["L (ft)"];
            seg.s = r["s (ft/ft)"]===""||r["s (ft/ft)"]==null?"":r["s (ft/ft)"];
            seg.P2 = r["P2 (in)"]===""||r["P2 (in)"]==null?"":r["P2 (in)"];
          } else if(type==="shallow"){
            seg.L = r["L (ft)"]===""||r["L (ft)"]==null?"":r["L (ft)"];
            seg.s = r["s (ft/ft)"]===""||r["s (ft/ft)"]==null?"":r["s (ft/ft)"];
            seg.surface = r["Surface"]||"unpaved";
          } else {
            seg.L = r["L (ft)"]===""||r["L (ft)"]==null?"":r["L (ft)"];
            seg.s = r["s (ft/ft)"]===""||r["s (ft/ft)"]==null?"":r["s (ft/ft)"];
            seg.n = r["n"]===""||r["n"]==null?"":r["n"];
            seg.area = r["Area a (sf)"]===""||r["Area a (sf)"]==null?"":r["Area a (sf)"];
            seg.wp = r["Wetted Perimeter Pw (ft)"]===""||r["Wetted Perimeter Pw (ft)"]==null?"":r["Wetted Perimeter Pw (ft)"];
          }
          row.tr55.segments.push(seg);
        });
      }

      const st = sheetToRows(wb, "Junction Structure");
      const stIdMap = {};
      if(st){
        state.structures = st.map(r=>{
          const id = nextId();
          const label = r["Structure ID"]||"";
          if(label) stIdMap[label]=id;
          const daLabel = r["Drainage Area ID"]||"";
          return {
            id, structureId: label, desc:r["Description"]||"",
            drainageAreaId: daLabel && daIdMap[daLabel] ? daIdMap[daLabel] : "",
            type: r["Type"]||"manhole",
            forceElev: String(r["Force Fixed"]).toUpperCase()==="TRUE",
            startElev: r["Fixed-Start Elev (ft)"]===""?"":r["Fixed-Start Elev (ft)"],
            rim: r["Rim-Grate Elev (ft)"]===""?"":r["Rim-Grate Elev (ft)"],
            splitMethod: r["Split Method"]||"capacity",
            splitCapacity: r["Split Capacity (cfs)"]===""?"":r["Split Capacity (cfs)"],
            splitRatio: r["Split Ratio (0-1)"]===""||r["Split Ratio (0-1)"]==null?0.5:r["Split Ratio (0-1)"],
            structureMode: r["Structure Mode"]||"",
            agency: r["Agency"]||"",
            standardStructureId: r["Catalog ID"]||"",
            structureCategory: r["Category"]||"",
            shape: r["Shape"]||"",
            innerDiameter: r["Inner Dia (ft)"]===""||r["Inner Dia (ft)"]==null?"":String(r["Inner Dia (ft)"]),
            innerWidth: r["Inner W (ft)"]===""||r["Inner W (ft)"]==null?"":String(r["Inner W (ft)"]),
            innerLength: r["Inner L (ft)"]===""||r["Inner L (ft)"]==null?"":String(r["Inner L (ft)"]),
          };
        });
      }

      const pipes = sheetToRows(wb, "Pipe Sizing");
      if(pipes){
        state.pipes = pipes.map(r=>{
          const fromLabel = r["From Structure"]||"", toLabel = r["To Structure"]||"";
          return {
            id: nextId(),
            fromStructureId: stIdMap[fromLabel] || "",
            toStructureId: stIdMap[toLabel] || "",
            angle: r["Angle (deg)"]||0,
            shape: (r["Shape"]||"circular").toLowerCase()==="elliptical"?"elliptical":"circular",
            size: r["Size (in or SPANxRISE)"]||"",
            n: r["n"]===""||r["n"]==null?0.013:r["n"],
            material: "",
            upstreamInvert: r["US Invert (ft)"]===""||r["US Invert (ft)"]==null?"":r["US Invert (ft)"],
            downstreamInvert: r["DS Invert (ft)"]===""||r["DS Invert (ft)"]==null?"":r["DS Invert (ft)"],
            slope: r["Slope (ft-ft)"]||"",
            length: r["Length (ft)"]||"",
            splitRole: r["Split Role"]||"",
          };
        });
      }

      const osRows = sheetToRows(wb, "Outlet Structures");
      const osIdMap = {};
      if(osRows){
        state.outletStructures = osRows.map(r=>{
          const id = nextId();
          const label = r["Label"] || r["Outlet Structure ID"] || "";
          const key = r["Outlet Structure ID"] || label;
          if(key) osIdMap[key] = id;
          const linkedLabel = r["Tailwater Linked Structure ID"]||"";
          return Object.assign({id, label, desc: r["Description"]||""}, {
            startElev: r["Start Elevation (ft)"]===""||r["Start Elevation (ft)"]==null?"":r["Start Elevation (ft)"],
            endElev: r["End Elevation (ft)"]===""||r["End Elevation (ft)"]==null?"":r["End Elevation (ft)"],
            coarseIncrement: r["Coarse Increment (ft)"]===""||r["Coarse Increment (ft)"]==null?0.5:r["Coarse Increment (ft)"],
            fineIncrement: r["Fine Increment (ft)"]===""||r["Fine Increment (ft)"]==null?0.05:r["Fine Increment (ft)"],
            fineBand: r["Fine Band +/- (ft)"]===""||r["Fine Band +/- (ft)"]==null?0.3:r["Fine Band +/- (ft)"],
            twMode: r["Tailwater Mode"]||"none",
            twFixed: r["Tailwater Fixed Elevation (ft)"]===""||r["Tailwater Fixed Elevation (ft)"]==null?"":r["Tailwater Fixed Elevation (ft)"],
            twStructureId: linkedLabel && stIdMap[linkedLabel] ? stIdMap[linkedLabel] : "",
            precisionMode: r["Precision Mode"]==="individual" ? "individual" : "uniform",
          });
        });
        state.activeOutletId = state.outletStructures.length ? state.outletStructures[0].id : "";
      }

      const devs = sheetToRows(wb, "Outlet Devices");
      if(devs){
        state.outletDevices = devs.map(r=>{
          const osLabel = r["Outlet Structure"]||"";
          return {
            id: nextId(),
            outletStructureId: osLabel && osIdMap[osLabel] ? osIdMap[osLabel] : state.activeOutletId,
            label: r["Label"]||"", type: r["Type"]||"orifice",
            invert: r["Invert (ft)"]===""?"":r["Invert (ft)"],
            crest: r["Crest (ft)"]===""?"":r["Crest (ft)"],
            diameter: r["Diameter (in)"]===""?"":r["Diameter (in)"],
            diameterUnit: r["Diameter Unit"]==="ft" ? "ft" : "in",
            length: r["Length (ft)"]===""?"":r["Length (ft)"],
            lengthUnit: r["Length Unit"]==="in" ? "in" : "ft",
            weirShape: r["Weir Shape"]||"rect",
            notchAngle: r["Notch Angle (deg)"]===""?90:r["Notch Angle (deg)"],
            cd: r["Type"]!=="weir" ? (r["Coefficient"]===""?0.6:r["Coefficient"]) : 0.6,
            coef: r["Type"]==="weir" ? (r["Coefficient"]===""?3.1:r["Coefficient"]) : 3.1,
            fineOverrideEnabled: String(r["Fine Override Enabled"]).toUpperCase()==="TRUE",
            fineIncrementOverride: r["Fine Increment Override (ft)"]===""||r["Fine Increment Override (ft)"]==null?"":r["Fine Increment Override (ft)"],
            fineBandOverride: r["Fine Band Override (ft)"]===""||r["Fine Band Override (ft)"]==null?"":r["Fine Band Override (ft)"],
            notes: r["Notes"]||"",
          };
        });
      }

      const kb = sheetToRows(wb, "Kb Coefficients");
      if(kb && kb.length){
        state.kb = kb.map(r=>({angle:r["Angle (deg)"], inlet:r["Kb - Inlet"], manhole:r["Kb - Manhole"], bend:r["Kb - Bend"]}));
      }

      const ov = wb.Sheets["Overview"];
      if(ov){
        const aoa = XLSX.utils.sheet_to_json(ov, {header:1});
        if(aoa[1] && aoa[1][1]) state.project = String(aoa[1][1]);
      }

      const isWs = wb.Sheets["Inlet Spacing"];
      if(isWs){
        const isAoa = XLSX.utils.sheet_to_json(isWs, {header:1, raw:true, defval:""});
        const newSettings = defaultInletSpacingSettings();
        // Rows 0-9 are settings key/value pairs; find data header row by sentinel "Label" in col 0
        let dataHeaderIdx = -1;
        isAoa.forEach((row,i)=>{
          const k = String(row[0]||"").trim();
          const v = row[1];
          if(k==="Street") newSettings.street=String(v||"");
          else if(k==="Default Allowable Spread (ft)") newSettings.allowableSpread=(v!==""&&v!=null)?v:8;
          else if(k==="Label" || k==="Linked Structure") dataHeaderIdx=i;
        });
        if(dataHeaderIdx>=0){
          const headers = isAoa[dataHeaderIdx].map(h=>String(h).trim());
          const hIdx = h => headers.indexOf(h);
          state.inletSpacing = isAoa.slice(dataHeaderIdx+1)
            .filter(r=>r.some(v=>v!==""&&v!=null))
            .map(r=>{
              const g = (h)=>{ const i=hIdx(h); return i>=0?(r[i]!=null?r[i]:""):""; };
              const row = defaultInletSpacingRow();
              row.label = String(g("Label")||"");
              row.L   = g("L (ft)")!==""?String(g("L (ft)")):row.L;
              row.area= g("Area (ac)")!==""?String(g("Area (ac)")):row.area;
              row.C   = g("C")!==""?String(g("C")):row.C;
              row.tc  = g("Tc (min)")!==""?String(g("Tc (min)")):row.tc;
              row.iOverride = g("i Override (in/hr)")!==""?String(g("i Override (in/hr)")):"";
              row.S   = g("S")!==""?String(g("S")):row.S;
              row.Sx  = g("Sx")!==""?String(g("Sx")):row.Sx;
              row.W   = g("W (ft)")!==""?String(g("W (ft)")):row.W;
              row.a   = g("a (ft)")!==""?String(g("a (ft)")):row.a;
              row.n   = g("n")!==""?String(g("n")):row.n;
              row.allowableSpread = g("Allowable Spread (ft)")!==""?String(g("Allowable Spread (ft)")):"";
              row.bypassTo = String(g("Bypass To")||"");
              const linkedStructName = String(g("Linked Structure")||"").trim();
              if (linkedStructName) {
                const matchSt = state.structures.find(s => (s.structureId||"") === linkedStructName);
                row.linkedStructureId = matchSt ? matchSt.id : "";
              } else {
                row.linkedStructureId = "";
              }
              return row;
            });
        }
        state.inletSpacingSettings = newSettings;
      }

      renderAll();
      updateSavesUI();
      toast("Imported <b>"+escapeHtml(file.name)+"</b>.");
    }catch(err){
      console.error(err);
      toast("Import failed: "+escapeHtml(err.message)+" \u2014 make sure this file was exported from this tool.", true);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ====== SECTION: Init ======
function init(){
  seedExample();
  renderAll();

  document.getElementById("projectName").value = state.project;
  document.getElementById("projectName").addEventListener("input", (e)=>{ state.project = e.target.value; });

  updateSavesUI();

  document.getElementById("printAllTablesBtn").addEventListener("click", printAllTableSheets);
  document.getElementById("printAllDetailBtn").addEventListener("click", printAllDetailSheets);

  document.getElementById("saveCompBtn").addEventListener("click", saveComp);

  document.getElementById("savesMenuBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    const pop = document.getElementById("savesPopover");
    const isOpen = pop.classList.contains("open");
    if(!isOpen) renderSavesPopover();
    pop.classList.toggle("open", !isOpen);
  });

  document.addEventListener("click", (e)=>{
    const pop = document.getElementById("savesPopover");
    const btn = document.getElementById("savesMenuBtn");
    if(pop.classList.contains("open") && !pop.contains(e.target) && !btn.contains(e.target)){
      closeSavesPopover();
    }
  });

  document.getElementById("exportBtn").addEventListener("click", exportExcel);
  const fileInput = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", ()=> fileInput.click());

  document.getElementById("hamburgerBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("mobileNavPanel").classList.toggle("open");
  });
  document.addEventListener("click", () => closeMobileNav());

  (function initCarousel(){
    const nav = document.getElementById("tabletNav");
    const prev = document.getElementById("tabCarouselPrev");
    const next = document.getElementById("tabCarouselNext");
    function sync(){
      prev.disabled = nav.scrollLeft <= 1;
      next.disabled = nav.scrollLeft >= nav.scrollWidth - nav.clientWidth - 1;
    }
    prev.addEventListener("click", () => { nav.scrollBy({ left:-200, behavior:"smooth" }); });
    next.addEventListener("click", () => { nav.scrollBy({ left:200, behavior:"smooth" }); });
    nav.addEventListener("scroll", sync, { passive:true });
    new ResizeObserver(sync).observe(nav);
    sync();
  })();
  fileInput.addEventListener("change", (e)=>{
    const f = e.target.files[0];
    if(f) importExcel(f);
    fileInput.value = "";
  });

  document.getElementById("modalCloseBtn").addEventListener("click", closeDetailModal);
  document.getElementById("modalOverlay").addEventListener("click", (e)=>{ if(e.target.id==="modalOverlay") closeDetailModal(); });
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeDetailModal(); });

  // A focused number input under the mouse shouldn't silently change value
  // when the page is scrolled - blur it first so the scroll just scrolls.
  document.addEventListener("wheel", (e)=>{
    if(e.target && e.target.tagName==="INPUT" && e.target.type==="number" && document.activeElement===e.target){
      e.target.blur();
    }
  }, {passive:true});
}
