      const fields = state.overrides.byId[elementId];
      for (const field of Object.keys(fields)) {
        const el = state.imported
          ? (state.imported.structures.find((s) => s.id === elementId)
             || state.imported.pipes.find((p) => p.id === elementId))
          : null;
        out.push({
          elementId, field,
          newValue: fields[field],
          originalValue: el ? el[field] : null
        });
      }
    }
    return out;
  }

  function syncModeButton() {
    const btn = document.getElementById("modeToggle");
    if (btn) btn.textContent = state.ui.mode === "edit" ? "▸ edit" : "▸ explore";
  }

  // Mode toggle (E hotkey + toolbar button are handled in task-24 for completeness).
  function setMode(mode) {
    if (mode !== "explore" && mode !== "edit") return;
    state.ui.mode = mode;
    renderAll();
  }

  // --- Editable field helpers (task-24) ---

  // A monospace numeric input bound to an override. Uses data-focus-key per main spec §A.2.
  function editableNumber(elementId, field, imported, overrides, opts) {
    opts = opts || {};
    const currentVal = resolveField(elementId, field, imported, overrides);
    const originalEl = (imported.structures.find((s) => s.id === elementId)
                     || imported.pipes.find((p) => p.id === elementId));
    const original = originalEl ? originalEl[field] : null;
    const isOverridden = overrides.byId[elementId] && Object.prototype.hasOwnProperty.call(overrides.byId[elementId], field);

    // text + inputmode rather than type=number: a number input reports "" for
    // in-progress text like "0." so decimals cannot be typed reliably.
    const input = el("input", {
      type: "text",
      inputmode: "decimal",
      value: currentVal != null ? currentVal : "",
      placeholder: original != null ? String(original) : "",
      style: "width:90px; font-family:ui-monospace,monospace; "
           + (isOverridden ? "font-weight:bold; color:#ffd60a;" : "color:#1a1a1a;"),
      "data-focus-key": "edit:" + elementId + ":" + field,
      oninput: (ev) => {
        const raw = ev.target.value;
        if (raw.trim() === "") { revertOverride(elementId, field); withFocusPreserved(renderAll); return; }
        const n = Number(raw);
        if (!isFinite(n)) return; // partial ("-", "1e", ".") — keep the text, store nothing
        const cur = resolveField(elementId, field, imported, overrides);
        if (cur === n) return;    // no semantic change yet; preserves "0.0" / "1.50"
        setOverride(elementId, field, n);
        withFocusPreserved(renderAll);
      }
    });
    return input;
  }

  function editableSelect(elementId, field, imported, overrides, options) {
    const currentVal = resolveField(elementId, field, imported, overrides);
    const originalEl = (imported.structures.find((s) => s.id === elementId)
                     || imported.pipes.find((p) => p.id === elementId));
    const original = originalEl ? originalEl[field] : null;
    const isOverridden = overrides.byId[elementId] && Object.prototype.hasOwnProperty.call(overrides.byId[elementId], field);
    const sel = el("select", {
      style: "font-family:ui-monospace,monospace; " + (isOverridden ? "font-weight:bold; color:#ffd60a;" : ""),
      "data-focus-key": "edit:" + elementId + ":" + field,
      onchange: (ev) => {
        const v = ev.target.value;
        // Picking the original value is a revert, not an override.
        if (original != null && String(v) === String(original)) revertOverride(elementId, field);
        else setOverride(elementId, field, v);
        withFocusPreserved(renderAll);
      }
    });
    for (const opt of options) {
      const o = el("option", { value: opt, selected: (String(opt) === String(currentVal)) ? "selected" : null }, opt);
      sel.appendChild(o);
    }
    return sel;
  }

  // E hotkey
  document.addEventListener("keydown", (ev) => {
    if (isTypingTarget(ev)) return;
    if (ev.shiftKey) return;
    if (isBranchPopupOpen()) return;
    if (document.getElementById("overridePanel")) return;
    if (ev.key === "e" || ev.key === "E") {
      ev.preventDefault();
      setMode(state.ui.mode === "edit" ? "explore" : "edit");
    }
  });

  // Toolbar button
  const modeBtn = document.getElementById("modeToggle");
  if (modeBtn) modeBtn.addEventListener("click", () => setMode(state.ui.mode === "edit" ? "explore" : "edit"));

  // --- Override badge + reset panel (task-25) ---

  function renderOverrideBadge() {
    let badge = document.getElementById("overrideBadge");
    const count = listOverrides().length;
    if (!badge) {
      const topbar = document.querySelector(".topbar");
      if (!topbar) return;
      badge = el("button", { id: "overrideBadge", type: "button", style: "display:none;" });
      badge.addEventListener("click", openOverridePanel);
      topbar.appendChild(badge);
    }
    if (count === 0) {
      badge.style.display = "none";
    } else {
      badge.textContent = count + " fields overridden";
      badge.style.cssText = "background:#ffd60a; color:#1a1a1a; border:none; padding:4px 10px; border-radius:4px; font-weight:600;";
    }
  }

  function closeOverridePanel() {
    const p = document.getElementById("overridePanel");
    if (p) p.remove();
  }

  function openOverridePanel() {
    closeOverridePanel();
    const ovs = listOverrides();
    const panel = el("div", {
      id: "overridePanel",
      style: "position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); "
           + "background:#161b22; color:#e6edf3; padding:16px 20px; border:1px solid #30363d; "
           + "border-radius:6px; font-family:system-ui,sans-serif; min-width:420px; max-height:70vh; overflow:auto; z-index:1000;"
    });
    panel.appendChild(el("div", { style: "font-weight:600; margin-bottom:10px;" }, "Active overrides (" + ovs.length + ")"));
    if (ovs.length === 0) {
      panel.appendChild(el("div", { style: "color:#8b949e;" }, "No overrides. Edits in the ledger will appear here."));
    } else {
      const table = el("table", { style: "width:100%; border-collapse:collapse; font-family:ui-monospace,monospace; font-size:12px;" });
      const head = el("tr", { style: "border-bottom:1px solid #30363d;" }, [
        el("th", { style: "text-align:left; padding:4px;" }, "Element"),
        el("th", { style: "text-align:left; padding:4px;" }, "Field"),
        el("th", { style: "text-align:right; padding:4px;" }, "Original"),
        el("th", { style: "text-align:right; padding:4px;" }, "New"),
        el("th", { style: "padding:4px;" }, "")
      ]);
      table.appendChild(head);
      for (const o of ovs) {
        const revertBtn = el("button", {
          type: "button",
          style: "padding:2px 8px;",
          onclick: () => {
            revertOverride(o.elementId, o.field);
            renderAll();
            // Nothing left to show — dismissing the panel is the honest state.
            if (listOverrides().length === 0) closeOverridePanel();
            else openOverridePanel();
          }
        }, "Revert");
        const row = el("tr", { style: "border-bottom:1px solid #21262d;" }, [
          el("td", { style: "padding:4px;" }, o.elementId),
          el("td", { style: "padding:4px;" }, o.field),
          el("td", { style: "padding:4px; text-align:right;" }, String(o.originalValue)),
          el("td", { style: "padding:4px; text-align:right; color:#ffd60a;" }, String(o.newValue)),
          el("td", { style: "padding:4px;" }, revertBtn)
        ]);
        table.appendChild(row);
      }
      panel.appendChild(table);
    }

    const footer = el("div", { style: "margin-top:12px; display:flex; gap:8px; justify-content:flex-end;" }, [
      el("button", { type: "button",
        onclick: () => { resetAllOverrides(); renderAll(); closeOverridePanel(); }
      }, "Reset all"),
      el("button", { type: "button", onclick: closeOverridePanel }, "Close")
    ]);
    panel.appendChild(footer);

    document.body.appendChild(panel);
  }

  // Esc closes the panel. Capture phase + stopImmediatePropagation so the walk
  // handlers (registered earlier, bubble phase) don't also run resetWalk.
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && document.getElementById("overridePanel")) {
      ev.preventDefault();
      ev.stopImmediatePropagation();
      closeOverridePanel();
    }
  }, true);

  // --- Tweaked JSON export (task-26) ---

  function buildTweakedJsonExport() {
    if (!state.imported) throw new Error("no imported data to export");
    const ovs = listOverrides();

    // Merge overrides into element fields for output
    const mergeField = (el) => {
      const ov = state.overrides.byId[el.id];
      if (!ov) return Object.assign({}, el);
      return Object.assign({}, el, ov);
    };
    const structures = state.imported.structures.map(mergeField);
    const pipes = state.imported.pipes.map(mergeField);

    return {
      schemaVersion: 1,
      exportedAt: new Date().toISOString(),
      sourceApp: "storm-drain-hgl-visualizer",
      basedOn: {
        sourceApp: state.imported.config && state.imported.config.sourceApp || "unknown",
        exportedAt: state.imported.config && state.imported.config.exportedAt || null
      },
      config: Object.assign({}, state.imported.config || {}, { hglMethod: state.ui.hglMethod }),
      structures, pipes,
      outfall: Object.assign({}, state.imported.outfall),
      kbTable: state.imported.kbTable || null,
      drainageAreas: (state.imported.drainageAreas || []).map((o) => Object.assign({}, o)),
      tr55Segments:  (state.imported.tr55Segments || []).map((o) => Object.assign({}, o)),
      _overrides: ovs
    };
  }

  function downloadTweakedJson() {
    const obj = buildTweakedJsonExport();
    const text = JSON.stringify(obj, null, 2);
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const stamp = new Date().toISOString().slice(0, 10);
    a.download = "visualizer-tweaked-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Wire a toolbar button
  (function () {
    const topbar = document.querySelector(".topbar");
    if (!topbar) return;
    const btn = el("button", {
      type: "button",
      id: "exportTweakedBtn",
      style: "margin-left:4px;",
      onclick: () => {
        try { downloadTweakedJson(); }
        catch (e) { alert("Export failed: " + e.message); }
      }
    }, "export tweaked");
    topbar.appendChild(btn);
  })();
  // ==== edit-mode: end ====

  // ==== ledger-render: begin ====
  // Sentinel id that never matches a real row → effectively collapses every row.
  const LEDGER_COLLAPSED = "(collapsed)";
  // --- Calc-sheet helpers (task-27) ---

  function csSection(label, children) {
    return el("div", { class: "cs-section", style: "margin:4px 0 8px 0;" }, [
      el("div", { style: "font-weight:600; font-size:11px; color:#444; text-transform:uppercase; margin-bottom:4px;" }, label),
      el("div", null, children)
    ]);
  }

  function csFormula(symbolic, substituted, result, unit) {
    return el("div", { style: "font-family:ui-monospace,monospace; font-size:12px; margin:2px 0;" }, [
      el("span", { style: "color:#555;" }, symbolic + " = "),
      substituted != null ? el("span", { style: "color:#222;" }, substituted + " = ") : null,
      el("span", { style: "font-weight:600;" }, String(result)),
      unit ? el("span", { style: "color:#555;" }, " " + unit) : null
    ]);
  }

  function csResult(label, value, unit) {
    return el("div", { style: "margin:6px 0; padding:4px 8px; background:#eceae2; font-family:ui-monospace,monospace;" }, [
      el("span", { style: "color:#444;" }, label + " = "),
      el("span", { style: "font-weight:700;" }, String(value)),
      unit ? el("span", { style: "color:#444;" }, " " + unit) : null
    ]);
  }

  function csWarn(text) {
    return el("div", {
      style: "margin:6px 0; padding:6px 10px; background:#fff4e5; color:#8a3a00; border-left:3px solid #ff8c00; font-size:12px;"
    }, text);
  }

  function fmtNum(v, decimals) {
    const d = (typeof decimals === "number") ? decimals : 3;
    if (typeof v !== "number" || !isFinite(v)) return String(v);
    return v.toFixed(d);
  }

  // Top-level ledger container — invoked by renderAll (task-17 wiring).
  function renderLedger() {
    const host = document.getElementById("ledger");
    if (!host) return;
    while (host.firstChild) host.removeChild(host.firstChild);
    if (!state.imported) {
      host.appendChild(el("div", { style: "color:#666;" }, "No data imported."));
      return;
    }
    const outfallId = state.imported.outfall && state.imported.outfall.structureId;
    const path = (state.cursor && state.cursor.pathStack && state.cursor.pathStack.length)
      ? state.cursor.pathStack
      : (outfallId ? [outfallId] : []);
    const rows = buildLedger(path, state, state.imported.kbTable, state.ui.hglMethod);
    const annotated = annotateLedgerHgl(rows, state, state.ui.hglMethod);

    // Header line
    host.appendChild(el("div", { style: "font-weight:700; margin-bottom:8px;" },
      "Energy ledger (" + (state.ui.freeRoam ? "free-roam" : "upstream walk") + ") — HGL method: " + state.ui.hglMethod));

    // One row per ledger entry. The synthetic end row reuses the last element's
    // id, so it must never be treated as the cursor target (that would expand
    // both the real row and the summary).
    const cursorId = state.cursor && state.cursor.id;
    // Auto-follow: whenever the cursor moves, re-expand the (new) current row.
    if (state.ui.lastCursorId !== cursorId) {
      state.ui.expandedRowId = null;
      state.ui.lastCursorId = cursorId;
    }
    for (const row of annotated) {
      const isCurrent = row.kind !== "end" && row.id === cursorId;
      const isExpanded = state.ui.expandedRowId === null
        ? isCurrent
        : (row.kind !== "end" && row.id === state.ui.expandedRowId);
      const isEnd = row.kind === "end";
      const rowAttrs = {
        style: "padding:3px 6px; font-family:ui-monospace,monospace; "
             + (isEnd ? "" : "cursor:pointer; ")
             + (isCurrent ? "background:#ffeaa7;" : ""),
        "aria-expanded": isExpanded ? "true" : "false"
      };
      if (!isEnd) {
        rowAttrs.onclick = () => {
          // Click the row currently shown expanded to collapse it; any other row locks it open.
          const shownExpanded = state.ui.expandedRowId === null
            ? (row.kind !== "end" && row.id === cursorId)
            : state.ui.expandedRowId === row.id;
          state.ui.expandedRowId = shownExpanded ? LEDGER_COLLAPSED : row.id;
          renderLedger();
        };
      }
      const collapsed = el("div", rowAttrs, oneLineForRow(row));
      host.appendChild(collapsed);
      if (isExpanded) {
        const details = el("div", { style: "padding:4px 20px;" }, renderExpandedRow(row));
        host.appendChild(details);
      }
    }
  }

  // --- Enter key expand/collapse (task-43) ---
  document.addEventListener("keydown", (ev) => {
    if (ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey || ev.repeat) return;
    if (ev.key !== "Enter") return;
    if (typeof isTypingTarget === "function" && isTypingTarget(ev)) return;
    if (typeof isBranchPopupOpen === "function" && isBranchPopupOpen()) return;
    if (document.getElementById("overridePanel")) return;      // a modal owns the keyboard
    const t = ev.target;
    // Don't hijack Enter on interactive controls (buttons/links/selects).
    if (t && (t.tagName === "BUTTON" || t.tagName === "A" || t.tagName === "SELECT")) return;

    const cursorId = state.cursor && state.cursor.id;
    if (!cursorId) return;
    ev.preventDefault();

    const cursorRowIsExpanded = state.ui.expandedRowId === null
      || state.ui.expandedRowId === cursorId;
    state.ui.expandedRowId = cursorRowIsExpanded ? LEDGER_COLLAPSED : null;
    if (typeof renderLedger === "function") renderLedger();
  });

  function oneLineForRow(row) {
    const arrow = " → ";
    const after = fmtNum(row.after, 2);
    if (row.kind === "start") {
      const reason = (row.detail && row.detail.boundaryReason) || "tailwater";
      return "Start: " + row.label + "   EGL = " + after + " ft (" + reason + ")";
    }
    if (row.kind === "hf")     return "+Hf " + row.label + "   +" + fmtNum(row.delta, 3) + arrow + after;
    if (row.kind === "hb")     return "+Hb " + row.label + "   +" + fmtNum(row.delta, 3) + arrow + after;
    if (row.kind === "end")    return "End: " + row.label + "   total rise = " + fmtNum(row.detail.totalRise, 3) + " ft";
    return JSON.stringify(row);
  }

  // --- Hf row expanded render (task-28) ---

  function renderHfRow(row) {
    const d = row.detail;
    const isEdit = state.ui.mode === "edit";
    const q = (typeof d.designQ === "number" && isFinite(d.designQ)) ? d.designQ : 0;
    const inp = (field, step) => isEdit
      ? editableNumber(row.id, field, state.imported, state.overrides, { step })
      : el("span", { style: "font-family:ui-monospace,monospace;" }, fmtNum(resolveField(row.id, field, state.imported, state.overrides), 3));
    // Elliptical sizes are "SPANxRISE" keys from Table 4-6; a free numeric input
    // would commit a value pipeAreaElliptical cannot resolve. Offer the table.
    const sizeControl = () => {
      if (!isEdit) return String(d.size);
      if (d.shape === "elliptical") {
        const sizes = TABLE_4_6.map((r) => r.span_rise).filter((v) => v != null);
        return editableSelect(row.id, "size", state.imported, state.overrides, sizes);
      }
      return editableNumber(row.id, "size", state.imported, state.overrides, { step: 3 });
    };

    return el("div", null, [
      csSection("inputs", el("table", { style: "font-family:ui-monospace,monospace; font-size:12px;" }, [
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "Q (cfs)"), el("td", null, fmtNum(q, 2))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "n"), el("td", null, inp("n", "0.001"))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "slope (ft/ft)"), el("td", null, inp("slope", "0.0001"))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "length (ft)"), el("td", null, inp("length", "0.1"))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "shape"), el("td", null, d.shape)]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "size"), el("td", null, sizeControl())])
      ])),
      csSection("hydraulics", el("div", null, [
        csFormula("A", fmtNum(d.A, 4), fmtNum(d.A, 4), "ft²"),
        csFormula("R", fmtNum(d.R, 4), fmtNum(d.R, 4), "ft")
      ])),
      csSection("friction slope", csFormula(
        "Sf = (Q·n / (1.486·A·R^(2/3)))²",
        "(" + fmtNum(q, 2) + "·" + fmtNum(d.n, 3) + " / (1.486·" + fmtNum(d.A, 3) + "·" + fmtNum(d.R, 3) + "^(2/3)))²",
        fmtNum(d.Sf, 6),
        "ft/ft"
      )),
      csSection("friction loss", csFormula(
        "Hf = Sf · L",
        fmtNum(d.Sf, 6) + " · " + fmtNum(d.length, 2),
        fmtNum(d.Hf, 3),
        "ft"
      )),
      csResult("EGL_up = EGL_dn + Hf = " + fmtNum(row.before, 3) + " + " + fmtNum(d.Hf, 3), fmtNum(row.after, 3), "ft")
    ]);
  }

  // --- Hb row expanded render (task-29) ---

  function renderHbRow(row) {
    const d = row.detail;
    const res = d.result;
    const isEdit = state.ui.mode === "edit";
    const typeSelect = isEdit
      ? editableSelect(row.id, "type", state.imported, state.overrides, ["inlet", "manhole", "bend", "junction", "splitter", "outfall"])
      : el("span", { style: "font-family:ui-monospace,monospace;" }, d.structureType);

    const header = el("div", null, [
      csSection("structure", el("table", { style: "font-family:ui-monospace,monospace; font-size:12px;" }, [
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "Type"), el("td", null, typeSelect)]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "Total Q (cfs)"), el("td", null, fmtNum(d.Qtotal, 2))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "Outflow pipe A_out (sf)"), el("td", null, fmtNum(d.Aout, 3))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "Vout (ft/s)"),
          el("td", null, fmtNum(d.Aout > 0 ? d.Qtotal / d.Aout : 0, 3))]),
        el("tr", null, [el("td", { style: "padding:2px 8px;" }, "V²/(2g) (ft)"),
          el("td", null, fmtNum(velocityHead(d.Aout > 0 ? d.Qtotal / d.Aout : 0), 4))])
      ]))
    ]);

    if (res && res.error === "too-many-inflows") {
      return el("div", null, [
        header,
        csWarn(d.inflows.length + " inflows at structure " + row.id + "; controlling-angle method supports ≤2. No Hb computed.")
      ]);
    }

    const n = d.inflows.length;
    if (n === 0) {
      return el("div", null, [
        header,
        csSection("zero inflows (headwater)", el("div", { style: "font-size:12px; color:#444;" },
          "Nominal entrance condition: Kb evaluated at 0° for a " + d.structureType + ".")),
        csFormula("Kb(0°, " + d.structureType + ")", fmtNum(res.kbUsed, 3), fmtNum(res.kbUsed, 3), ""),
        csFormula("Hb = Kb · V²/(2g)",
          fmtNum(res.kbUsed, 3) + " · " + fmtNum(velocityHead(d.Aout > 0 ? d.Qtotal / d.Aout : 0), 4),
          fmtNum(res.Hb, 4), "ft"),
        csResult("Hb", fmtNum(res.Hb, 4), "ft")
      ]);
    }
    if (n === 1) {
      const a = d.inflows[0];
      return el("div", null, [
        header,
        csSection("one inflow", el("div", { style: "font-size:12px; color:#444;" },
          "Pipe " + a.pipeId + " enters at " + fmtNum(a.angleDeg, 1) + "°; Kb read at that angle.")),
        csFormula("Kb(" + fmtNum(a.angleDeg, 1) + "°, " + d.structureType + ")", null, fmtNum(res.kbUsed, 3), ""),
        csFormula("Hb = Kb · V²/(2g)",
          fmtNum(res.kbUsed, 3) + " · " + fmtNum(velocityHead(d.Aout > 0 ? d.Qtotal / d.Aout : 0), 4),
          fmtNum(res.Hb, 4), "ft"),
        csResult("Hb", fmtNum(res.Hb, 4), "ft")
      ]);
    }
    // n === 2 — defer to task-30
    if (typeof renderTwoInflowDetail === "function") {
      return el("div", null, [header, renderTwoInflowDetail(row)]);
    }
    return el("div", null, [header,
      csFormula("Hb (2-inflow controlling)", null, fmtNum(res.Hb, 4), "ft (detail in task-30)")]);
  }

  // Default expanded renderer — replaced by task-28/29 per row kind.
  function renderExpandedRow(row) {
    if (typeof renderHfRow === "function" && row.kind === "hf")   return renderHfRow(row);
    if (typeof renderHbRow === "function" && row.kind === "hb")   return renderHbRow(row);
    if (row.kind === "start") {
      const reason = row.detail.boundaryReason || "tailwater";
      const label = reason === "fixed elevation" ? "Fixed start elevation"
                  : reason === "crown boundary" ? "Crown boundary elevation"
                  : reason === "rim boundary" ? "Rim boundary elevation"
                  : reason === "zero boundary" ? "Boundary elevation"
                  : "Tailwater elevation";
      return csResult(label, fmtNum(row.detail.boundaryEGL, 2), "ft");
    }
    if (row.kind === "end")   return csResult("Total rise over walked path", fmtNum(row.detail.totalRise, 3), "ft");
    return el("div", null, "(no detail)");
  }
  // --- Two-inflow detail (task-30) ---

  function renderTwoInflowDetail(row) {
    const d = row.detail;
    const res = d.result;
    const cands = res.candidateLosses || [];
    if (cands.length !== 2) return csWarn("Expected 2 candidate losses, got " + cands.length);

    const candTable = el("table", { style: "font-family:ui-monospace,monospace; font-size:12px; border-collapse:collapse;" }, [
      el("tr", { style: "border-bottom:1px solid #999;" }, [
        el("th", { style: "padding:3px 10px; text-align:left;" }, "angle"),
        el("th", { style: "padding:3px 10px; text-align:right;" }, "V_i/3"),
        el("th", { style: "padding:3px 10px; text-align:right;" }, "Kb(angle)"),
        el("th", { style: "padding:3px 10px; text-align:right;" }, "Lv = Kb·V²/(2g)"),
        el("th", { style: "padding:3px 10px;" }, "")
      ])
    ]);
    // Derive the marker from the loss itself, not `isControlling`: when both
    // inflows share an angle the engine marks both true, which would label the
    // larger loss "smaller".
    const minLv = Math.min(cands[0].Lv, cands[1].Lv);
    for (const c of cands) {
      const marker = c.Lv === minLv
        ? el("span", { style: "color:#0a7a0a; font-weight:700;" }, "← controls (smaller)")
        : el("span", { style: "color:#999;" }, "(not used)");
      candTable.appendChild(el("tr", { style: "border-bottom:1px dotted #ccc;" }, [
        el("td", { style: "padding:3px 10px;" }, fmtNum(c.angle, 1) + "°"),
        el("td", { style: "padding:3px 10px; text-align:right;" }, fmtNum(c.V, 3)),
        el("td", { style: "padding:3px 10px; text-align:right;" }, fmtNum(c.Kb, 3)),
        el("td", { style: "padding:3px 10px; text-align:right;" }, fmtNum(c.Lv, 4)),
        el("td", { style: "padding:3px 10px;" }, marker)
      ]));
    }

    return el("div", null, [
      csSection("two inflows — controlling-angle method", el("div", { style: "font-size:12px; color:#444; margin-bottom:6px;" }, [
        "Compute Lv = Kb·V²/(2g) for each inflow using that inflow's partial velocity (V_i/3 = Q_i / A_out). ",
        el("b", null, "The SMALLER of the two Lv's picks the controlling angle θc."),
        " (The counter-intuitive detail: smaller Lv → θc, not larger. Per main spec §1.4.)"
      ])),
      candTable,
      csSection("controlling angle", csFormula(
        "θc  (angle giving the SMALLER Lv)",
        null,
        fmtNum(res.thetaControlling, 1), "°"
      )),
      csSection("Hb at the structure", csFormula(
        "Hb = Kb(θc) · V_out²/(2g)",
        fmtNum(res.kbUsed, 3) + " · " + fmtNum(velocityHead(d.Aout > 0 ? d.Qtotal / d.Aout : 0), 4),
        fmtNum(res.Hb, 4), "ft"
      )),
      csResult("Hb", fmtNum(res.Hb, 4), "ft")
    ]);
  }
  // ==== ledger-render: end ====

  // ==== print: begin ====
  // --- Print the current walked path (v81.7, design §4.8) ---

  // Build a detached #printArea for the current annotated ledger path: a header
  // block plus one .calc-sheet per ledger row, reusing the ledger detail renderers
  // (which are built on csSection / csFormula).
  function buildPrintArea() {
    const area = el("div", { id: "printArea" });
    if (!state.imported) return area;

    const startId = (typeof resolveWalkStart === "function"
      ? resolveWalkStart(state.imported, state.ui) : null)
      || state.ui.walkStartId
      || (state.imported.outfall && state.imported.outfall.structureId) || "—";
    area.appendChild(el("div", { class: "print-header",
      style: "margin-bottom:12px; border-bottom:2px solid #000; padding-bottom:8px;" }, [
      el("div", { style: "font-size:16px; font-weight:700; margin-bottom:4px;" },
        "Storm Drain HGL/EGL Visualizer — Energy Ledger"),
      el("div", { style: "font-size:12px;" },
        "File: " + (state.ui.fileName || "(none)")
        + "   ·   HGL method: " + state.ui.hglMethod
        + "   ·   Walk start: " + startId
        + "   ·   " + new Date().toLocaleDateString())
    ]));

    const path = (state.cursor && state.cursor.pathStack && state.cursor.pathStack.length)
      ? state.cursor.pathStack
      : (state.imported.outfall && state.imported.outfall.structureId
          ? [state.imported.outfall.structureId] : []);
    if (!path.length) return area;

    const rows = buildLedger(path, state, state.imported.kbTable, state.ui.hglMethod);
    const annotated = annotateLedgerHgl(rows, state, state.ui.hglMethod);

    // Render details statically even if the app is in edit mode (no form controls).
    const prevMode = state.ui.mode;
    state.ui.mode = "explore";
    try {
      for (const row of annotated) {
        area.appendChild(el("div", { class: "calc-sheet", "data-kind": "print-sheet", "data-id": String(row.id) }, [
          el("div", { style: "font-weight:700; font-size:13px; margin-bottom:6px; font-family:ui-monospace,monospace;" },
            oneLineForRow(row)),
          renderExpandedRow(row)
        ]));
      }
    } finally {
      state.ui.mode = prevMode;
    }
    return area;
  }

  // Build the print area, enter print mode, and open the browser print dialog.
  function printLedger() {
    const notice = document.getElementById("printNotice");
    if (!state.imported) {
      if (notice) {
        notice.textContent = "Load a network before printing.";
        notice.style.display = "inline";
        setTimeout(() => { notice.style.display = "none"; }, 2500);
      }
      return;
    }

    // Remove any stale area from a previous invocation before building a new one.
    const stale = document.getElementById("printArea");
    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);

    const area = buildPrintArea();
    document.body.appendChild(area);
    document.body.classList.add("print-mode");

    // Register cleanup BEFORE printing so a synchronous afterprint is not missed.
    // Idempotent, and scoped to THIS area (not a global id lookup).
    let cleaned = false;
    const cleanup = () => {
      if (cleaned) return;
      cleaned = true;
      document.body.classList.remove("print-mode");
      if (area.parentNode) area.parentNode.removeChild(area);
    };
    window.addEventListener("afterprint", cleanup, { once: true });
    setTimeout(cleanup, 1500);   // fallback: some environments never fire afterprint
    try {
      if (typeof window.print === "function") window.print();
    } catch (e) {
      cleanup();
    }
  }

  // Toolbar print button + a small non-blocking notice span.
  (function wirePrintButton() {
    const topbar = document.querySelector(".topbar");
    if (!topbar) return;
    const notice = el("span", { id: "printNotice",
      style: "display:none; font-size:12px; color:#ffd60a;" }, "");
    const btn = el("button", { id: "printBtn", type: "button",
      style: "background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px; padding:2px 8px; font-size:12px; cursor:pointer;" },
      "Print");
    btn.addEventListener("click", () => printLedger());
    topbar.appendChild(notice);
    topbar.appendChild(btn);
  })();

  // ==== warning-banner: begin ====
  // v81.2 (design §4.1, §4.4) — unified amber banner below the topbar.
  // Renders splitter detection and missing-Design-Q warnings from state.analysis.

  // Details disclosure is UI-only; kept out of `state` (not persisted/exported).
  let warningDetailsOpen = false;
  // Signature of the last full render; lets renderAll skip unchanged rebuilds.
  let warningSignature = null;

  // Called by both importers: a new import clears dismissal and collapses details.
  function resetWarningUi() {
    state.ui.warningsDismissed = false;
    warningDetailsOpen = false;
    warningSignature = null; // force a rebuild on the next render
  }

  function renderWarningBanner() {
    const host = document.getElementById("warningBanner");
    if (!host) return;

    const a = state.analysis;
    const splitterIds = (a && Array.isArray(a.splitterIds)) ? a.splitterIds : [];
    const missingQ = (a && Array.isArray(a.missingDesignQ)) ? a.missingDesignQ : [];
    const hasWarning = !!(a && !state.ui.warningsDismissed && (splitterIds.length || missingQ.length));

    // Skip rebuilding when nothing that affects the banner changed (renderAll runs often).
    const sig = hasWarning
      ? JSON.stringify([splitterIds, missingQ, warningDetailsOpen, state.ui.warningsDismissed])
      : "hidden";
    if (sig === warningSignature) return;
    warningSignature = sig;

    host.innerHTML = "";
    if (!hasWarning) { host.style.display = "none"; return; }
    host.style.display = "block";

    const pipes = (state.imported && Array.isArray(state.imported.pipes)) ? state.imported.pipes : [];

    // --- summary rows ---
    const summary = el("div", { style: "flex:1; display:flex; flex-direction:column; gap:2px;" });
    for (const sid of splitterIds) {
      const primaryId = a.primaryPipeByStructureId ? a.primaryPipeByStructureId[sid] : null;
      const p = pipes.find((x) => x.id === primaryId);
      const hasPrimaryRole = p && String(p.splitRole || "").toLowerCase() === "primary";
      summary.appendChild(el("div", null,
        "Flow splitter " + sid + " — following primary path only"
        + (hasPrimaryRole ? "" : " (no primary role; using first outgoing pipe)")));
    }
    if (missingQ.length > 0) {
      summary.appendChild(el("div", null,
        "No Design Q: " + missingQ.join(", ") + " — friction shown as 0.000 ft"));
    }

    // --- controls ---
    const detailsBtn = el("button", {
      id: "warningBannerDetailsBtn",
      type: "button",
      style: "background:transparent; border:none; cursor:pointer; font-weight:600; font-family:inherit; font-size:12px;",
      "aria-expanded": warningDetailsOpen ? "true" : "false",
      "aria-controls": "warningBannerDetails",
      onclick: () => {
        // Mutate in place (no rebuild) so keyboard focus is preserved.
        warningDetailsOpen = !warningDetailsOpen;
        const d = document.getElementById("warningBannerDetails");
        if (d) d.style.display = warningDetailsOpen ? "block" : "none";
        const btn = document.getElementById("warningBannerDetailsBtn");
        if (btn) {
          btn.textContent = warningDetailsOpen ? "details ▴" : "details ▾";
          btn.setAttribute("aria-expanded", warningDetailsOpen ? "true" : "false");
        }
        warningSignature = null; // details visibility changed; allow a later rebuild
      }
    }, warningDetailsOpen ? "details ▴" : "details ▾");

    const dismissBtn = el("button", {
      type: "button",
      style: "background:transparent; border:none; cursor:pointer; font-size:14px; font-family:inherit;",
      "aria-label": "Dismiss",
      onclick: () => { state.ui.warningsDismissed = true; renderWarningBanner(); }
    }, "×");

    const controls = el("span", { style: "margin-left:auto; display:flex; gap:6px; align-items:baseline;" },
      [detailsBtn, dismissBtn]);

    host.appendChild(el("div", { style: "display:flex; gap:8px; align-items:baseline;" },
      [summary, controls]));

    // --- details (always built; visibility toggled in place) ---
    const details = el("div", {
      id: "warningBannerDetails",
      style: "margin-top:4px; font-size:11px; line-height:1.5; display:" + (warningDetailsOpen ? "block" : "none") + ";"
    });
    for (const sid of splitterIds) {
      const outs = pipes.filter((p) => p.fromId === sid).map((p) => p.id);
      details.appendChild(el("div", null,
        "Splitter " + sid + " downstream pipes: " + (outs.length ? outs.join(", ") : "(none)")));
    }
    for (const pid of missingQ) {
      details.appendChild(el("div", null, "Pipe " + pid + ": no Design Q (friction 0.000 ft)"));
    }
    host.appendChild(details);
  }
  // ==== warning-banner: end ====

  // ==== walk-from: begin ====
  // v81.3 (design §4.2) — "Walk from" switcher, grouped outfalls-first.

  let walkFromSig = null;

  function renderWalkFromSelect() {
    const topbar = document.querySelector(".topbar");
    if (!topbar) return;

    let wrap = document.getElementById("walkFromWrap");
    let sel = document.getElementById("walkFromSelect");
    if (!wrap) {
      sel = el("select", {
        id: "walkFromSelect",
        style: "font-family:var(--mono);font-size:12px;background:var(--bg-elev);" +
               "color:var(--fg);border:1px solid #30363d;border-radius:3px;padding:2px 4px;",
        onchange: (ev) => {
          const id = ev.target.value;
          state.ui.walkStartId = id;
          state.cursor = { kind: "structure", id: id, pathStack: [id] };
          state.ui.branchChoices = { byStructureId: {} };
          withFocusPreserved(renderAll);
        }
      });
      wrap = el("span", { id: "walkFromWrap", style: "display:none; align-items:baseline; gap:4px; margin-left:8px;" }, [
        el("label", {
          for: "walkFromSelect",
          style: "font-size:12px;color:var(--fg-dim);font-family:var(--mono);white-space:nowrap;"
        }, "Walk from:"),
        sel
      ]);
      topbar.appendChild(wrap);
    }

    const starts = (state.analysis && Array.isArray(state.analysis.walkStarts)) ? state.analysis.walkStarts : [];
    const sig = JSON.stringify(starts.map((s) => [s.id, s.label || "", s.group || "", s.type || ""]));
    if (sig !== walkFromSig) {
      walkFromSig = sig;
      sel.innerHTML = "";
      const addGroup = (label, arr) => {
        if (arr.length === 0) return;
        sel.appendChild(el("optgroup", { label }, arr.map((s) => el("option", { value: s.id }, s.label || s.id))));
      };
      addGroup("Outfalls", starts.filter((s) => s.group === "outfall"));
      addGroup("Structures", starts.filter((s) => s.group !== "outfall"));
    }

    const want = state.ui.walkStartId;
    const has = (v) => Array.from(sel.options).some((o) => o.value === v);
    if (want != null && has(want)) {
      sel.value = want;
    } else if (sel.options.length > 0) {
      sel.value = sel.options[0].value;
      // Keep UI state consistent when the current id is absent from the options.
      if (state.ui.walkStartId !== sel.value) state.ui.walkStartId = sel.value;
    }

    wrap.style.display = starts.length ? "inline-flex" : "none";
  }
  // ==== walk-from: end ====

  // ==== bootstrap: begin ====
  function renderAll() {
    renderActiveView();
    // ledger render is wired in by group 60
    if (typeof renderLedger === "function") renderLedger();
    if (typeof renderOverrideBadge === "function") renderOverrideBadge();
    if (typeof renderWarningBanner === "function") renderWarningBanner();
    if (typeof syncModeButton === "function") syncModeButton();
    if (typeof syncHglSelect === "function") syncHglSelect();
    if (typeof renderWalkFromSelect === "function") renderWalkFromSelect();
    if (typeof syncTr55Toggle === "function") syncTr55Toggle();
  }

  // V hotkey (also 'v' lowercase). Ignore while typing in form controls.
  document.addEventListener("keydown", (ev) => {
    if (ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey || ev.repeat) return;
    if (isBranchPopupOpen() || document.getElementById("overridePanel")) return;  // a modal owns the keyboard
    const t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
    if (ev.key === "v" || ev.key === "V") {
      ev.preventDefault();
      toggleView();
    }
  });

  // Toolbar click
  const toggleLabel = document.getElementById("viewToggle");
  if (toggleLabel) toggleLabel.addEventListener("click", () => toggleView());
  const tr55Label = document.getElementById("tr55Toggle");
  if (tr55Label) tr55Label.addEventListener("click", () => toggleTr55());
  document.getElementById("fileInput").addEventListener("change", async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    document.getElementById("fileName").textContent = f.name;
    try {
      const name = f.name.toLowerCase();
      if (name.endsWith(".json")) await importFromJsonFile(f);
      else if (name.endsWith(".xlsx")) await importFromXlsxFile(f);  // added by task-06
      else throw new Error("Unsupported file type: " + f.name);
      autoLayoutIfNeeded();
      renderAll();
    } catch (err) {
      alert("Import failed: " + err.message);
      renderAll();
    }
  });
  // Expose top-level bindings for the jsdom test harness (top-level const/let
  // declarations are not properties of `window`).
  window.state = state;
  window.KB_SEED = KB_SEED;
  window.TABLE_4_6 = TABLE_4_6;
  renderAll();
  // ==== bootstrap: end ====
</script>
</body>
</html>
